<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>/*TITULO*/ · Prácticas SAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Hoja de la práctica de la profe: una columna de lectura, las 4 partes en el orden del papel. Paleta del sitio (ROADMAP §2). */
:root{
  --fondo:#FFF8EE;--carta:#FFFFFF;--tinta:#241F1A;--suave:#5F574E;--linea:#EAE2D6;--crema:#F1EADF;
  --accion:#FF8A3D;--calma:#0E7C78;--calmaClaro:#E6F3F2;
  --oro:#FFC43D;--oroTexto:#7A4B00;--oroClaro:#FFF1CC;
  --ambar:#B45309;--ambarTexto:#8A4B06;--ambarClaro:#FDE7C8;
  --verde:#15803D;--verdeTexto:#166534;--verdeClaro:#DCFCE7;
  --azulTexto:#1E4E8C;--azulClaro:#E3EEFB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
.envoltura{max-width:780px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1,h2{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:900} h2{font-size:1.2rem;font-weight:800}
p{margin:0}
a{color:var(--calma)}
.arriba{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.volver{font-weight:800;text-decoration:none;color:var(--calma);padding:8px 0}
.etiqueta{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--calma)}
.hoja,.panel{background:var(--carta);border:1px solid var(--linea);border-radius:22px;padding:22px;display:grid;gap:18px}
.hoja section{display:grid;gap:6px}
.hoja h2{border-bottom:2px solid var(--linea);padding-bottom:6px}
.dir{font-weight:400;font-size:.95rem;color:var(--suave)}
.preg{display:grid;gap:8px;padding:12px;border-radius:14px;border:1.5px solid transparent;margin:0}
fieldset.preg{min-width:0}
.preg legend{font-weight:700;padding:0}
.opc{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.opc:hover{background:var(--crema)}
.opc input{margin-top:5px;width:20px;height:20px;accent-color:var(--calma);flex:none}
label{font-weight:700}
textarea,input[type=text]{font-family:inherit;font-size:1rem;width:100%;border:1.5px solid #D8D1C5;border-radius:14px;padding:10px 12px;background:#FBFAF7;color:var(--tinta)}
textarea{min-height:80px;resize:vertical}
.ensayo textarea{min-height:150px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:.85rem;color:var(--suave)}
select{font-family:inherit;font-size:1rem;padding:6px 8px;border-radius:10px;border:1.5px solid #D8D1C5;background:#FBFAF7;color:var(--tinta)}
.preg.bien{border-color:var(--verde);background:var(--verdeClaro)}
.preg.revisar{border-color:var(--ambar);background:var(--ambarClaro)}
.preg.parcial{border-color:#8DB3E2;background:var(--azulClaro)}
.pill{display:inline-flex;font-size:.82rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--crema)}
.pill.ok{background:var(--verdeClaro);color:var(--verdeTexto)} .pill.warn{background:var(--ambarClaro);color:var(--ambarTexto)} .pill.info{background:var(--azulClaro);color:var(--azulTexto)}
.fb{font-size:.95rem;border-left:4px solid var(--calma);padding:6px 10px;background:var(--carta);border-radius:8px;display:grid;gap:4px}
.btn{font-family:inherit;font-size:1.05rem;font-weight:800;border-radius:16px;padding:13px 18px;border:1.5px solid var(--linea);background:var(--carta);color:var(--tinta);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-accion{background:var(--accion);border-color:var(--accion);color:#2A1300}
.btn:disabled{opacity:.55;cursor:default}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aviso{background:var(--oroClaro);color:var(--oroTexto);border-radius:14px;padding:10px 14px;font-size:.95rem}
.puntaje{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.puntaje div{background:var(--fondo);border-radius:14px;padding:12px;display:grid;gap:2px}
.puntaje b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.espera{display:flex;gap:10px;align-items:center}
.giro{width:18px;height:18px;border-radius:50%;border:3px solid var(--calmaClaro);border-top-color:var(--calma);animation:g 1s linear infinite;flex:none}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.giro{animation:none}}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (max-width:520px){.hoja,.panel{padding:14px}h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="envoltura" id="app"></div>
<script>
var EXAMEN=/*EXAMEN*/;
/*SHA*/
(function(){
'use strict';
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function lsGet(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function r2(n){return Math.round(n*100)/100;}
function fmtP(n){var x=Math.round(n*100)/100;return x%1===0?String(x):x.toFixed(2).replace(/0$/,'');}
var LETRAS=['A','B','C','D','E','F','G','H'];
var ARCHIVO=(function(){try{return decodeURIComponent(location.pathname.split('/').pop())||'examen_profe.html';}catch(e){return 'examen_profe.html';}})();
var SESION=lsGet('sas-sesion',null);
var SUF=SESION&&SESION.alias?':'+SESION.alias:'';
var CLAVE_BORRADOR='sas-profe-borrador:'+ARCHIVO+SUF, CLAVE_INTENTOS='sas-profe-intentos:'+ARCHIVO+SUF;

/* Progreso global del sitio (lo leen docs/index.html y familia.html) y telemetría, igual que el motor. */
var SAS=(function(){
  var CLAVE_G='sas-progreso-v1'+SUF;
  function hoy(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
  function cargar(){var g=lsGet(CLAVE_G,null);if(!g||g.v!==1)g={v:1,puntos:0,dias:{},practicas:{}};g.dias=g.dias||{};g.practicas=g.practicas||{};return g;}
  function registrar(intento,partes){
    var g=cargar(),h=hoy();
    var d=g.dias[h]=g.dias[h]||{segundos:0,respondidas:0,puntos:0,misiones:0};
    var pts=10*intento.respondidas;
    d.respondidas+=intento.respondidas;d.puntos+=pts;d.segundos+=Math.min(3600,intento.segundos||0);g.puntos=(g.puntos||0)+pts;
    var p=g.practicas[ARCHIVO]=g.practicas[ARCHIVO]||{titulo:EXAMEN.titulo,materia:EXAMEN.materia,modo:'fiel',temas:{},respondidas:0,ultimaVez:null,completada:false};
    p.titulo=EXAMEN.titulo;p.materia=EXAMEN.materia;p.respondidas=(p.respondidas||0)+intento.respondidas;p.ultimaVez=new Date().toISOString();p.completada=true;
    p.nota={total:intento.total,max:intento.max,intento:intento.intento};
    partes.forEach(function(x){p.temas[x.id]={nombre:x.nombre,estado:x.puntos>=x.max?'dominado':'progreso',fallos:x.max-x.puntos>0?1:0,intentos:intento.intento,reforzado:false};});
    try{localStorage.setItem(CLAVE_G,JSON.stringify(g));}catch(e){}
    enviar('practica_completa',{titulo:EXAMEN.titulo,materia:EXAMEN.materia,nota:intento.total,max:intento.max,intento:intento.intento});
  }
  function enviar(tipo,datos){
    var tele='';try{tele=localStorage.getItem('sas-telemetria')||'';}catch(e){}
    if(!tele||!SESION||!SESION.alias)return;
    try{var c=JSON.stringify({alias:SESION.alias,tipo:tipo,practica:ARCHIVO,datos:datos||{},t:new Date().toISOString()});
      if(navigator.sendBeacon)navigator.sendBeacon(tele,new Blob([c],{type:'text/plain'}));else fetch(tele,{method:'POST',body:c,keepalive:true,mode:'no-cors'});}catch(e){}
  }
  return {registrar:registrar};
})();

var inicio=Date.now(), estadoEx={intento:1};
function borrador(){return lsGet(CLAVE_BORRADOR,{});}
function leer(){
  var r={nombre:(el('ex-nombre')||{}).value||'',p1:{},p2:{},p3:{},p4:{}};
  EXAMEN.p1.forEach(function(q,i){var s=document.querySelector('input[name="p1-'+i+'"]:checked');r.p1[i]=s?s.value:'';});
  EXAMEN.p2.forEach(function(q,i){r.p2[i]=el('p2-'+i).value||'';});
  EXAMEN.p3.forEach(function(q,i){r.p3[i]=el('p3-'+i).value||'';});
  EXAMEN.p4.forEach(function(q,i){r.p4[i]=el('p4-'+i).value||'';});
  return r;
}
function pintar(){
  var b=borrador();
  var h='<div class="arriba"><a class="volver" href="../">← Inicio</a><span class="etiqueta">Science · práctica del profe</span></div>';
  h+='<div class="hoja" id="hoja"><div style="display:grid;gap:8px"><h1>'+esc(EXAMEN.titulo)+'</h1>';
  h+='<div class="fila"><label for="ex-nombre">Name:</label><input type="text" id="ex-nombre" style="max-width:320px" value="'+esc(b.nombre||(SESION&&SESION.nombre)||'')+'"><span class="dir">Date: '+new Date().toLocaleDateString('es-CR')+'</span></div>';
  h+='<p class="aviso">Igual que la hoja de la profe. Respondé todo con calma y al final tocá <b>Entregar para revisar</b>. La opción múltiple y el pareo se revisan al instante; las respuestas escritas reciben una revisión por ideas clave y ortografía.</p></div>';
  h+='<section><h2>Part 1: Multiple Choice (1 point each). <span class="dir">Directions: Choose the best answer from the three choices.</span></h2>';
  EXAMEN.p1.forEach(function(q,i){
    h+='<fieldset class="preg" id="q-p1-'+i+'"><legend>'+(i+1)+'. '+q.q+'</legend>';
    q.o.forEach(function(o,j){var L=LETRAS[j];h+='<label class="opc" style="font-weight:600"><input type="radio" name="p1-'+i+'" value="'+L+'"'+(b.p1&&b.p1[i]===L?' checked':'')+'><span><b>'+L+'.</b> '+esc(o)+'</span></label>';});
    h+='<div class="fb-slot"></div></fieldset>';
  });
  h+='</section><section><h2>Part 2: Short Answer. <span class="dir">Directions: Answer in short sentences.</span></h2>';
  EXAMEN.p2.forEach(function(q,i){h+='<div class="preg" id="q-p2-'+i+'"><label for="p2-'+i+'">'+(i+1)+'. '+q.q+'</label><textarea id="p2-'+i+'" spellcheck="false" autocorrect="off" autocapitalize="off">'+esc(b.p2&&b.p2[i]||'')+'</textarea><div class="fb-slot"></div></div>';});
  h+='</section><section><h2>Part 3: Matching. <span class="dir">Directions: Match each term to its correct description. Write the correct letter on the line.</span></h2>';
  h+='<div class="tabla"><table><tr><th>Column A</th><th>( )</th><th>Column B</th></tr>';
  EXAMEN.p3.forEach(function(q,i){
    h+='<tr id="q-p3-'+i+'"><td>'+esc(LETRAS[i]+'. '+EXAMEN.colA[i])+'</td><td><select id="p3-'+i+'" aria-label="Letter for: '+esc(q.d)+'"><option value="">( )</option>';
    LETRAS.forEach(function(L){h+='<option value="'+L+'"'+(b.p3&&b.p3[i]===L?' selected':'')+'>'+L+'</option>';});
    h+='</select></td><td>'+esc(q.d)+'<div class="fb-slot"></div></td></tr>';
  });
  h+='</table></div></section><section><h2>Part 4: Essay Questions. <span class="dir">Directions: Write a well-organized paragraph. Use key vocabulary and complete sentences.</span></h2>';
  EXAMEN.p4.forEach(function(q,i){h+='<div class="preg ensayo" id="q-p4-'+i+'"><label for="p4-'+i+'">'+(i+1)+'. '+q.q+'</label><textarea id="p4-'+i+'" spellcheck="false" autocorrect="off" autocapitalize="off">'+esc(b.p4&&b.p4[i]||'')+'</textarea><div class="fb-slot"></div></div>';});
  h+='</section><div style="display:grid;gap:10px"><button class="btn btn-accion" id="btn-entregar">Entregar para revisar</button><p class="dir" id="msg"></p></div></div><div id="resultado"></div>';
  el('app').innerHTML=h;
  var guardar=function(){lsSet(CLAVE_BORRADOR,leer());};
  el('hoja').addEventListener('input',guardar);el('hoja').addEventListener('change',guardar);
  el('btn-entregar').addEventListener('click',entregar);
}
function faltan(r){var f=[];
  EXAMEN.p1.forEach(function(q,i){if(!r.p1[i])f.push('Part 1 #'+(i+1));});
  EXAMEN.p2.forEach(function(q,i){if(!r.p2[i].trim())f.push('Part 2 #'+(i+1));});
  EXAMEN.p3.forEach(function(q,i){if(!r.p3[i])f.push('Part 3 fila '+(i+1));});
  EXAMEN.p4.forEach(function(q,i){if(!r.p4[i].trim())f.push('Part 4 #'+(i+1));});return f;}
function entregar(){
  var r=leer(),f=faltan(r),b=el('btn-entregar');
  if(f.length&&!b.dataset.ok){el('msg').innerHTML='Te falta: '+esc(f.join(', '))+'. Podés completarlas, o tocar otra vez <b>Entregar</b> para revisar así.';b.dataset.ok='1';return;}
  b.disabled=true;
  var res={p1:[],p3:[]};
  EXAMEN.p1.forEach(function(q,i){res.p1.push({ok:!!r.p1[i]&&sha(EXAMEN.sal+'|p1-'+i+'|'+r.p1[i])===q.h,resp:r.p1[i]});});
  EXAMEN.p3.forEach(function(q,i){res.p3.push({ok:!!r.p3[i]&&sha(EXAMEN.sal+'|p3-'+i+'|'+r.p3[i])===q.h,resp:r.p3[i]});});
  res.p1.forEach(function(x,i){var q=el('q-p1-'+i);q.classList.remove('bien','revisar');q.classList.add(x.ok?'bien':'revisar');
    q.querySelector('.fb-slot').innerHTML=x.ok?'<span class="pill ok">✓ 1 punto</span>':'<span class="pill warn">'+(x.resp?'Revisá esta: todavía no':'Sin responder')+'</span>';});
  res.p3.forEach(function(x,i){el('q-p3-'+i).querySelector('.fb-slot').innerHTML=x.ok?' <span class="pill ok">✓</span>':' <span class="pill warn">'+(x.resp?'Revisá':'Sin responder')+'</span>';});
  res.p2=EXAMEN.p2.map(function(q,i){return revisarLocal(q,r.p2[i]||'',2,EXAMEN.puntosP2,'p2-'+i);});
  res.p4=EXAMEN.p4.map(function(q,i){return revisarLocal(q,r.p4[i]||'',4,EXAMEN.puntosP4,'p4-'+i);});
  terminar(r,res);
}
/* esqueleto fonético (el mismo de las prácticas) para aceptar palabras casi bien escritas */
function skel(s){
  var t=norm(s).replace(/[^a-z]/g,'');if(!t)return '';
  t=t.replace(/ph/g,'f').replace(/ck/g,'k').replace(/qu/g,'k').replace(/q/g,'k').replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/g(?=[ei])/g,'j')
    .replace(/x/g,'ks').replace(/z/g,'s').replace(/y/g,'i').replace(/w/g,'u').replace(/v/g,'b').replace(/(.)ti(?=[aeiou])/g,'$1s').replace(/h/g,'');
  if(!t)return '';
  return (t[0]+t.slice(1).replace(/[aeiou]/g,'')).replace(/(.)\1+/g,'$1');
}
var VOCAB=['renewable','nonrenewable','pollution','pollutant','pollutants','scrubber','scrubbers','greenhouse','geothermal','hydropower','biomass','nuclear','uranium','environment','electricity','electric','energy','turbine','turbines','generator','mining','drilling','spills','animals','habitat','carbon','dioxide','solar','panels','replaced','technology','atmosphere','fossil','fuels','chemicals','emission','emissions','forests','damage'];
function revisarLocal(q,resp,parte,max,id){
  var txt=' '+norm(resp).replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ')+' ';
  var pal=txt.trim().split(' ').filter(Boolean),orto=[];
  pal.forEach(function(w){if(w.length<5||VOCAB.indexOf(w)>=0)return;
    VOCAB.forEach(function(v){if(skel(w)===skel(v)&&Math.min(w.length,v.length)/Math.max(w.length,v.length)>=0.75&&!orto.some(function(o){return o.escrito===w;}))orto.push({escrito:w,correcto:v});});});
  var arreglado=txt;orto.forEach(function(o){arreglado=arreglado.split(' '+o.escrito+' ').join(' '+o.correcto+' ');});
  var pts=0,maxIdeas=0,faltaron=0;
  q.ideas.forEach(function(idea){maxIdeas+=idea[0];
    var ex=idea[1].some(function(k){return txt.indexOf(norm(k))>=0;});
    var casi=!ex&&idea[1].some(function(k){return arreglado.indexOf(norm(k))>=0;});
    if(ex)pts+=idea[0];else if(casi)pts+=idea[0]/2;else faltaron++;});
  var puntos;
  if(parte===4){var or=(resp.match(/[.!?](\s|$)/g)||[]).length;puntos=pts+((pal.length>=35&&or>=3)?1:(pal.length>=20?0.5:0));}
  else puntos=pts*(max/maxIdeas);
  puntos=Math.round(Math.min(max,puntos)*4)/4;if(!resp.trim())puntos=0;
  var com=!resp.trim()?'Sin responder.':(puntos>=max?'¡Muy bien! Tiene las ideas principales.':(puntos>0?'Vas bien: tiene parte de las ideas. Le falta '+(faltaron===1?'una idea':'alguna idea')+'.':'Todavía no: repasá este tema en la práctica adaptativa.'));
  if(parte===4&&resp.trim()&&pal.length<35)com+=' Escribí un párrafo más completo (3 oraciones o más).';
  return {id:id,puntos:puntos,max:max,comentario:com,ortografia:orto,respuesta:resp};
}
function sumar(a){return a.reduce(function(s,x){return s+(x.puntos!=null?x.puntos:(x.ok?1:0));},0);}
function textoParaClaude(r){
  var L=['Please grade these answers of a 4th grade Science practice (Costa Rica, Spanish speaker learning in English). Use the rubric of each question. If a key word is misspelled but close to the right word, count that idea as partially valid and give the correct spelling. Answer in Spanish, kindly, with points per question.',''];
  EXAMEN.p2.forEach(function(q,i){L.push('Part 2 #'+(i+1)+' ('+EXAMEN.puntosP2+' pts): '+q.q.replace(/<[^>]+>/g,''));L.push('Rubric: '+atob(q.rb));L.push('Answer: '+(r.p2[i]||'(blank)'));L.push('');});
  EXAMEN.p4.forEach(function(q,i){L.push('Part 4 #'+(i+1)+' ('+EXAMEN.puntosP4+' pts): '+q.q.replace(/<[^>]+>/g,''));L.push('Rubric: '+atob(q.rb));L.push('Answer: '+(r.p4[i]||'(blank)'));L.push('');});
  return L.join('\n');
}
function terminar(r,res){
  var t1=sumar(res.p1),t2=r2(sumar(res.p2)),t3=sumar(res.p3),t4=r2(sumar(res.p4));
  var m1=EXAMEN.p1.length,m2=EXAMEN.p2.length*EXAMEN.puntosP2,m3=EXAMEN.p3.length,m4=EXAMEN.p4.length*EXAMEN.puntosP4;
  var total=r2(t1+t2+t3+t4),max=m1+m2+m3+m4;
  [['p2',res.p2],['p4',res.p4]].forEach(function(par){par[1].forEach(function(x,i){
    var q=el('q-'+par[0]+'-'+i);q.classList.remove('bien','revisar','parcial');q.classList.add(x.puntos>=x.max?'bien':(x.puntos>0?'parcial':'revisar'));
    var f='<div class="fb"><div><span class="pill '+(x.puntos>=x.max?'ok':(x.puntos>0?'info':'warn'))+'">'+fmtP(x.puntos)+' de '+x.max+' puntos</span></div><div>'+esc(x.comentario)+'</div>';
    if(x.ortografia.length)f+='<div>✍️ Ortografía: '+x.ortografia.map(function(o){return '«'+esc(o.escrito)+'» se escribe <b>'+esc(o.correcto)+'</b>';}).join(' · ')+' (cuenta como parcialmente válida)</div>';
    q.querySelector('.fb-slot').innerHTML=f+'</div>';});});
  var respondidas=0;['p1','p3'].forEach(function(k){Object.keys(r[k]).forEach(function(i){if(r[k][i])respondidas++;});});['p2','p4'].forEach(function(k){Object.keys(r[k]).forEach(function(i){if(String(r[k][i]).trim())respondidas++;});});
  var intento={cuando:Date.now(),intento:estadoEx.intento,total:total,max:max,respondidas:respondidas,segundos:Math.round((Date.now()-inicio)/1000),
    partes:{p1:[t1,m1],p2:[t2,m2],p3:[t3,m3],p4:[t4,m4]},p1:res.p1.map(function(x){return x.ok?1:0;}),p3:res.p3.map(function(x){return x.ok?1:0;}),
    escritas:res.p2.concat(res.p4).map(function(x){return {id:x.id,puntos:x.puntos,max:x.max,respuesta:x.respuesta,ortografia:x.ortografia};})};
  var lista=lsGet(CLAVE_INTENTOS,[]);lista.unshift(intento);lsSet(CLAVE_INTENTOS,lista.slice(0,20));
  SAS.registrar(intento,[{id:'p1',nombre:'Part 1 · Multiple choice',puntos:t1,max:m1},{id:'p2',nombre:'Part 2 · Short answer',puntos:t2,max:m2},{id:'p3',nombre:'Part 3 · Matching',puntos:t3,max:m3},{id:'p4',nombre:'Part 4 · Essays',puntos:t4,max:m4}]);
  inicio=Date.now();
  var pct=Math.round(100*total/max);
  var h='<div class="panel" id="panel-resultado"><h2>Resultado · intento '+estadoEx.intento+'</h2>';
  h+='<div class="puntaje"><div><span class="dir">Total</span><b>'+fmtP(total)+' / '+max+'</b><span>'+pct+' %</span></div>';
  h+='<div><span class="dir">Part 1 · opción múltiple</span><b>'+t1+' / '+m1+'</b></div><div><span class="dir">Part 2 · respuesta corta</span><b>'+fmtP(t2)+' / '+m2+'</b></div>';
  h+='<div><span class="dir">Part 3 · pareo</span><b>'+t3+' / '+m3+'</b></div><div><span class="dir">Part 4 · ensayos</span><b>'+fmtP(t4)+' / '+m4+'</b></div></div>';
  h+='<p class="aviso">Las partes 2 y 4 tienen una <b>revisión preliminar</b> por ideas clave. Para una revisión completa, un adulto puede copiar las respuestas y pegárselas a Claude, o abrir la versión que revisa Claude.</p>';
  h+='<div class="fila"><button class="btn" id="btn-copiar">Copiar respuestas para Claude</button><a class="btn" href="'+esc(EXAMEN.enlaceClaude)+'" target="_blank" rel="noopener">Abrir la versión con Claude ↗</a><span class="dir" id="msg-copiar"></span></div>';
  h+='<p class="dir">Puntaje sugerido: Part 1 vale 1 punto cada una (como dice la hoja). La hoja no indica el valor de las otras partes: aquí valen '+EXAMEN.puntosP2+' puntos cada respuesta corta, 1 cada fila del pareo y '+EXAMEN.puntosP4+' cada ensayo.</p>';
  var pendiente=res.p1.some(function(x){return !x.ok;})||res.p3.some(function(x){return !x.ok;})||res.p2.concat(res.p4).some(function(x){return x.puntos<x.max;});
  h+='<div class="fila">'+(pendiente?'<button class="btn btn-accion" id="btn-corregir">Corregir lo que faltó</button>':'')+'<button class="btn" id="btn-nueva">Empezar otra vez</button><a class="btn" href="../">Volver al inicio</a></div>';
  h+='<p class="dir">La práctica no muestra cuál es la opción correcta: en las marcadas con «Revisá esta», volvé a leer y probá otra vez.</p></div>';
  el('resultado').innerHTML=h;el('msg').textContent='';el('btn-entregar').style.display='none';
  el('resultado').scrollIntoView({behavior:'smooth',block:'start'});
  el('btn-copiar').addEventListener('click',function(){var t=textoParaClaude(r);
    var mostrar=function(){el('msg-copiar').innerHTML='<textarea readonly style="min-height:140px">'+esc(t)+'</textarea>';var ta=el('msg-copiar').querySelector('textarea');ta.focus();ta.select();};
    try{navigator.clipboard.writeText(t).then(function(){el('msg-copiar').textContent='Copiado. Péguelo en un chat con Claude.';},mostrar);}catch(e){mostrar();}});
  var bc=el('btn-corregir');
  if(bc)bc.addEventListener('click',function(){
    estadoEx.intento++;
    res.p1.forEach(function(x,i){if(x.ok)document.querySelectorAll('input[name="p1-'+i+'"]').forEach(function(z){z.disabled=true;});});
    res.p3.forEach(function(x,i){if(x.ok)el('p3-'+i).disabled=true;});
    res.p2.forEach(function(x,i){if(x.puntos>=x.max)el('p2-'+i).readOnly=true;});
    res.p4.forEach(function(x,i){if(x.puntos>=x.max)el('p4-'+i).readOnly=true;});
    var b=el('btn-entregar');b.style.display='';b.disabled=false;b.textContent='Entregar las correcciones';delete b.dataset.ok;
    el('resultado').innerHTML='';var p=document.querySelector('.preg.revisar,.preg.parcial');if(p)p.scrollIntoView({behavior:'smooth',block:'center'});
  });
  el('btn-nueva').addEventListener('click',function(){var b=el('btn-nueva');
    if(!b.dataset.ok){b.dataset.ok='1';b.textContent='¿Seguro? Se borran las respuestas (la nota queda guardada). Tocá otra vez';return;}
    lsSet(CLAVE_BORRADOR,{});estadoEx.intento=1;pintar();window.scrollTo(0,0);});
}
// Puerta de cortesía, igual que las prácticas: en el sitio publicado se entra desde el inicio con alias y clave.
var enSitio=location.protocol==='http:'||location.protocol==='https:';
if(enSitio&&!SESION){el('app').innerHTML='<div class="panel" style="text-align:center"><h1>🔒 Entrá desde el inicio</h1><p>Esta práctica se abre desde la página principal, con tu alias y tu clave, para que tu nota quede guardada a tu nombre.</p><a class="btn btn-accion" href="../">Ir al inicio</a></div>';return;}
pintar();
})();
</script>
