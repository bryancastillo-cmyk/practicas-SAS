<!doctype html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>practicas-SAS</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header>
  <h1>Prácticas interactivas</h1>
  <p>Repasos y ejercicios para 4to grado</p>
</header>

<main>
  <div class="tabs" id="tabs">
    <button class="tab-boton" data-tab="actual">📚 Quiz actual</button>
    <button class="tab-boton" data-tab="anteriores">🗂️ Prácticas anteriores</button>
  </div>
  <div id="contenido">
    <p class="vacio">Cargando prácticas…</p>
  </div>
</main>

<footer>
  practicas-SAS · <a href="acerca.html">👨‍👩‍👧 ¿Cómo funciona esto? (para mamá y papá)</a>
</footer>

<script>
const MATERIAS = ['Matemáticas', 'Science', 'English', 'Español', 'Estudios Sociales'];

const FECHAS_QUIZ = {
  'Estudios Sociales': '2026-10-05',
  'Matemáticas': '2026-10-10',
  'Español': '2026-10-15',
  'Science': '2026-10-02',
  'English': '2026-10-01'
};

// Cada práctica nueva pertenece a un "periodo" (ronda de quiz), formato "YYYY-MM".
// Cuando empiece la siguiente ronda, cambiar PERIODO_ACTUAL acá y agregar su
// etiqueta en PERIODOS_LABEL — las prácticas del periodo anterior pasan solas
// a la pestaña "Prácticas anteriores".
const PERIODO_ACTUAL = '2026-10';
const PERIODOS_LABEL = {
  '2026-08': 'Quiz 1 — Agosto 2026',
  '2026-10': 'Quiz 2 — Octubre 2026'
};

let vista = 'actual';
let practicasGlobal = [];

function formatearFechaQuiz(iso) {
  const d = new Date(iso + 'T00:00:00');
  const texto = d.toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long' });
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function estadoFecha(iso) {
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const fecha = new Date(iso + 'T00:00:00');
  const diffDias = Math.round((fecha - hoy) / 86400000);
  return { diffDias, pasada: diffDias <= 0 };
}

function etiquetaRelativa(diffDias) {
  if (diffDias === 1) return 'Mañana';
  return `En ${diffDias} días`;
}

function periodoDe(p) {
  return p.periodo || PERIODO_ACTUAL;
}

function etiquetaPeriodo(periodo) {
  return PERIODOS_LABEL[periodo] || periodo;
}

async function cargarPracticas() {
  const contenido = document.getElementById('contenido');
  try {
    const resp = await fetch('practicas/manifest.json', { cache: 'no-store' });
    practicasGlobal = await resp.json();
  } catch (e) {
    contenido.innerHTML = '<p class="vacio">No se pudo cargar la lista de prácticas.</p>';
    return;
  }
  render();
}

function render() {
  document.querySelectorAll('.tab-boton').forEach((btn) => {
    btn.classList.toggle('activo', btn.dataset.tab === vista);
  });
  if (vista === 'actual') renderActual();
  else renderAnteriores();
}

function renderActual() {
  const contenido = document.getElementById('contenido');
  const actuales = practicasGlobal.filter((p) => periodoDe(p) === PERIODO_ACTUAL);

  const porMateria = {};
  for (const p of actuales) {
    const materia = p.materia || 'Otras';
    (porMateria[materia] ||= []).push(p);
  }

  const porFecha = MATERIAS.slice().sort((a, b) =>
    (FECHAS_QUIZ[a] || '9999-99-99').localeCompare(FECHAS_QUIZ[b] || '9999-99-99'));
  const otras = Object.keys(porMateria).filter((m) => !MATERIAS.includes(m)).sort();
  const orden = [...porFecha, ...otras];

  contenido.innerHTML = `<p class="periodo-vigente">${escapeHtml(etiquetaPeriodo(PERIODO_ACTUAL))}</p>` +
    orden.map((materia) => renderMateria(materia, porMateria[materia] || [])).join('');
}

function renderAnteriores() {
  const contenido = document.getElementById('contenido');
  const pasadas = practicasGlobal.filter((p) => periodoDe(p) !== PERIODO_ACTUAL);

  if (!pasadas.length) {
    contenido.innerHTML = '<p class="vacio">Todavía no hay prácticas anteriores.</p>';
    return;
  }

  const porPeriodo = {};
  for (const p of pasadas) {
    (porPeriodo[periodoDe(p)] ||= []).push(p);
  }
  const periodos = Object.keys(porPeriodo).sort().reverse();

  contenido.innerHTML = periodos.map((periodo) => {
    const porMateria = {};
    for (const p of porPeriodo[periodo]) {
      const materia = p.materia || 'Otras';
      (porMateria[materia] ||= []).push(p);
    }
    const materias = MATERIAS.filter((m) => porMateria[m]);
    const otras = Object.keys(porMateria).filter((m) => !MATERIAS.includes(m)).sort();
    const grupos = [...materias, ...otras]
      .map((materia) => renderMateriaSimple(materia, porMateria[materia]))
      .join('');
    return `
      <h2 class="periodo-titulo">${escapeHtml(etiquetaPeriodo(periodo))}</h2>
      ${grupos}
    `;
  }).join('');
}

function renderEncabezadoMateria(materia) {
  const iso = FECHAS_QUIZ[materia];
  if (!iso) {
    return `<div class="encabezado-materia"><h2>${escapeHtml(materia)}</h2></div>`;
  }
  const { diffDias, pasada } = estadoFecha(iso);
  const fechaTexto = formatearFechaQuiz(iso);
  const badge = pasada
    ? `<span class="fecha-quiz fecha-pasada">✅ Quiz ya realizado <span class="fecha-quiz-detalle">· ${escapeHtml(fechaTexto)}</span></span>`
    : `<span class="fecha-quiz fecha-proxima${diffDias <= 1 ? ' fecha-urgente' : ''}">📅 ${escapeHtml(etiquetaRelativa(diffDias))} <span class="fecha-quiz-detalle">· ${escapeHtml(fechaTexto)}</span></span>`;
  return `<div class="encabezado-materia">${badge}<h2>${escapeHtml(materia)}</h2></div>`;
}

function renderMateria(materia, practicas) {
  if (!practicas.length) {
    return `
      <section class="materia-grupo">
        ${renderEncabezadoMateria(materia)}
        <p class="vacio">Todavía no hay prácticas de ${escapeHtml(materia)}.</p>
      </section>
    `;
  }
  return `
    <section class="materia-grupo">
      ${renderEncabezadoMateria(materia)}
      ${renderTarjetas(practicas)}
    </section>
  `;
}

function renderMateriaSimple(materia, practicas) {
  return `
    <section class="materia-grupo">
      <div class="encabezado-materia"><h3>${escapeHtml(materia)}</h3></div>
      ${renderTarjetas(practicas)}
    </section>
  `;
}

function renderTarjetas(practicas) {
  const tarjetas = practicas
    .slice()
    .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))
    .map((p) => `
      <a class="tarjeta" href="${encodeURI(p.archivo)}">
        <span class="tema">${escapeHtml(p.tema || p.titulo || 'Práctica')}</span>
        ${p.titulo ? `<span class="detalle">${escapeHtml(p.titulo)}</span>` : ''}
        <span class="fecha">${escapeHtml(p.fecha || '')}</span>
      </a>
    `).join('');
  return `<div class="tarjetas">${tarjetas}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-boton');
  if (!btn) return;
  vista = btn.dataset.tab;
  render();
});

cargarPracticas();
</script>
</body>
</html>
