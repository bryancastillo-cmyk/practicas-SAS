<title>Práctica de Estudios Sociales — Valles, llanuras y costas de Costa Rica</title>
<style>
:root{--azul:#2563eb;--azulOsc:#1e40af;--verde:#16a34a;--ambar:#d97706;--fondo:#f0f6ff;--carta:#ffffff;--texto:#1f2937;--suave:#6b7280;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh}
.contenedor{max-width:640px;margin:0 auto;padding:16px}
.carta{background:var(--carta);border-radius:18px;padding:20px;box-shadow:0 3px 14px rgba(30,64,175,.10);margin-bottom:14px}
h1{font-size:1.35rem;margin:.2em 0;color:var(--azulOsc)}
h2{font-size:1.1rem;color:var(--azulOsc)}
.suave{color:var(--suave);font-size:.9rem}
button{font-family:inherit;font-size:1rem;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .06s}
button:active{transform:scale(.97)}
.btn-principal{background:var(--azul);color:#fff;width:100%;font-weight:600;font-size:1.05rem}
.btn-sec{background:#e0e9ff;color:var(--azulOsc);font-weight:600}
.btn-opcion{display:block;width:100%;text-align:left;background:#eef3fe;color:var(--texto);margin:8px 0;border:2px solid transparent;font-size:1rem}
.btn-opcion:hover{border-color:var(--azul)}
.ficha{display:inline-block;background:#fff7e6;border:2px solid var(--ambar);color:#92400e;font-weight:700;margin:4px;padding:10px 14px;border-radius:10px}
.zona-construccion{min-height:52px;background:#f8fafc;border:2px dashed #cbd5e1;border-radius:12px;padding:8px;margin:10px 0}
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:#e0e9ff;color:var(--azulOsc);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600}
.fila-orden{display:flex;align-items:center;gap:8px;background:#eef3fe;border-radius:10px;padding:8px 10px;margin:6px 0}
.fila-orden span{flex:1}
.fila-orden button{padding:6px 10px;background:#dbeafe;color:var(--azulOsc)}
select{font-family:inherit;font-size:.95rem;padding:8px;border-radius:10px;border:2px solid #cbd5e1;background:#fff;max-width:100%}
.fila-sel{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.fila-sel b{flex:1;min-width:120px}
.feedback{border-radius:12px;padding:14px;margin-top:12px;font-weight:600}
.fb-bien{background:#dcfce7;color:#166534}
.fb-nube{background:#fef3c7;color:#92400e}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .carta{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.oculto{display:none!important}
.orden-num{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--azul);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-right:8px;font-size:.85rem}
table.informe{width:100%;border-collapse:collapse;font-size:.9rem}
table.informe th,table.informe td{border-bottom:1px solid #e5e7eb;padding:8px 6px;text-align:left}
.explicacion{background:#f8fafc;border-left:4px solid var(--azul);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:.95rem}
.progreso{height:8px;background:#e0e9ff;border-radius:99px;overflow:hidden;margin:8px 0}
.progreso div{height:100%;background:var(--verde);width:0%}
.tarjeta-repaso{margin:10px 0;cursor:pointer;transition:transform .2s}
.tarjeta-repaso.girando{transform:rotateY(90deg)}
.tarjeta-repaso .cara-frente{background:var(--azul);color:#fff;font-weight:700;padding:16px;text-align:center;border-radius:12px}
.tarjeta-repaso .cara-dorso{background:#eef3fe;border:2px solid var(--azul);border-radius:12px;padding:14px;font-size:.95rem}
.tarjeta-repaso.vista{cursor:default}
button:disabled{opacity:.45;cursor:not-allowed}
.respuesta-escrita{width:100%;font-family:inherit;font-size:1.05rem;padding:12px;border-radius:12px;border:2px solid #cbd5e1;box-sizing:border-box;margin:8px 0}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:10px;border-radius:12px;border:2px solid #cbd5e1;box-sizing:border-box}
.esquema{background:#f8fafc;border-radius:14px;padding:12px}
.nodo-centro{background:var(--azulOsc);color:#fff;font-weight:700;text-align:center;border-radius:99px;padding:10px 16px;margin-bottom:10px}
.ramas{display:grid;grid-template-columns:1fr;gap:8px}
.rama{border-left:5px solid var(--azul);background:#eef3fe;border-radius:0 12px 12px 0;padding:10px 12px;font-size:.92rem}
.rama b{color:var(--azulOsc)}
.rama-estrella{border-left-color:var(--ambar);background:#fff7e6}
</style>

var DATOS = {"titulo":"Práctica de Estudios Sociales — Valles, llanuras y costas de Costa Rica","materia":"Estudios Sociales · Lección 5","sal":"868e99da95d9d337ef90786e","creditosNecesarios":2,"temas":[{"id":"valles-origen","nombre":"Los valles y su origen","explicacion":"Los valles de nuestro país se ubican en el centro del territorio y en las cercanías de las costas del Pacífico y del Caribe. Son amplios, planos, estrechos o profundos. Poseen suelos fértiles, aptos para la agricultura y la ganadería. Son de origen volcánico o sedimentario. Los volcánicos se formaron por el depósito de materiales como las cenizas. Los sedimentarios se crearon por la acción erosiva de los ríos y el arrastre de arena y piedra.","microleccion":"Para saber el origen de un valle, preguntate QUÉ lo formó. Ejemplo: si un valle se formó porque un río fue desgastando el terreno y arrastrando arena y piedra, es <b>sedimentario</b>. Si se formó porque se depositaron cenizas que soltaron los volcanes, es <b>volcánico</b>. Truco para recordar: volcánico ↔ cenizas; sedimentario ↔ ríos y arrastre.","variantes":[{"id":"vo-v1","formato":"mc","pregunta":"¿Dónde se ubican los valles de Costa Rica?","pista":"Pensá en el mapa: están en el centro y cerca de los dos mares.","hashes":["02a387ef31651c8361392fe0683622a8e6e479f067d24601193c9469092b8ed2"],"opciones":["En el centro del territorio y en las cercanías de las costas del Pacífico y del Caribe","Únicamente en las cimas de las montañas más altas","Solamente en la frontera con Nicaragua"]},{"id":"vo-v2","formato":"clasifica","pregunta":"Clasificá cada descripción según el origen del valle:","pista":"Volcánico ↔ cenizas. Sedimentario ↔ ríos, arena y piedra.","hashes":["2c31901706f3c31694606cda56ed4b1507686c0af2a5d9f95a858b057a203686"],"categorias":["Origen volcánico","Origen sedimentario"],"elementos":["Se creó por la acción erosiva de los ríos","Se formó por el arrastre de arena y piedra","Se formó con materiales que soltaron los volcanes","Se formó por el depósito de cenizas"]},{"id":"vo-v3","formato":"verifica","pregunta":"¿Es cierto que los valles NO son aptos para la agricultura?","pista":"Los valles poseen suelos fértiles. ¿Para qué sirven los suelos fértiles?","hashes":["460caf29c43c4adda3a120cbdd3c8ac7e15a3a2d3c961c366a093cdf92076a67"],"opciones":["Sí","No"]},{"id":"vo-v4","formato":"porque","pregunta":"¿Por qué en los valles se desarrollan actividades agropecuarias (agricultura y ganadería)?","pista":"¿Cómo son los suelos de los valles según el libro?","hashes":["255f92f6d45e2c6f37488fd7d1f6e2bba4bbd8a434e1ede2fc4b83509635e214"],"opciones":["Porque son terrenos muy rocosos y empinados","Porque están cubiertos de arena de playa","Porque poseen suelos fértiles"]},{"id":"vo-v5","formato":"verifica","pregunta":"¿Es cierto que, según su origen, los valles se clasifican en volcánicos y sedimentarios?","pista":"Recordá las dos formas en que se formaron los valles.","hashes":["93d578458b74d5a6e1d09cf8acbd4b3fa55d4d81f4579a749c993d72bd3838d9"],"opciones":["Sí","No"]}]},{"id":"valle-central","nombre":"El Valle Central","explicacion":"El Valle Central se ubica en el centro del país, entre la cordillera volcánica Central, la cordillera de Talamanca y los montes del Aguacate. Posee ríos principales como Virilla y Grande de San Ramón, que al unirse forman el Grande de Tárcoles. Se desarrolla la industria y el sector servicios. Los cultivos principales son café, caña de azúcar, papas y plantas ornamentales. Está dividido en dos secciones por los cerros Ochomogo y La Carpintera. En la sección occidental se ubican las ciudades de Alajuela, Heredia y San José. En la sección oriental se encuentra la ciudad de Cartago y destaca el río Reventazón.","microleccion":"Para ubicar una ciudad del Valle Central, pensá en los dos cerros que lo dividen: Ochomogo y La Carpintera. Al oeste (sección <b>occidental</b>) quedan TRES ciudades juntas; al este (sección <b>oriental</b>) queda UNA sola ciudad con su río. Ejemplo: si te preguntan por Heredia, recordá que está en el grupo de tres, con Alajuela y San José: sección occidental.","variantes":[{"id":"vc-v1","formato":"arma","pregunta":"El Virilla y el Grande de San Ramón se unen y forman el río Grande de... (armá el nombre con las fichas)","pista":"No es el río de Cartago; es el que se forma en la parte occidental.","hashes":["83a498a607feea49789c74a5f6e32aaad63f472c3185261ac29d74ad4da8c854"],"fichas":["Re","tazón","Tár","co","les","ven"]},{"id":"vc-v2","formato":"clasifica","pregunta":"Colocá cada ciudad en su sección del Valle Central:","pista":"En la sección oriental hay una sola ciudad, y ahí destaca el río Reventazón.","hashes":["ceadab697222d8f35fadb2b5a2364030f67d9512331d439089df34f6246de337"],"categorias":["Sección occidental","Sección oriental"],"elementos":["Cartago","Alajuela","Heredia","San José"]},{"id":"vc-v3","formato":"mc","pregunta":"¿Cuáles cerros dividen el Valle Central en dos secciones?","pista":"Son dos cerros, no cordilleras ni volcanes.","hashes":["a3f6ce0ffdeb963d97470640be6ea893cb358f5ebc7216e95c9924bd0ef8f489"],"opciones":["La cordillera de Talamanca y la fila Brunqueña","Los montes del Aguacate y el volcán Arenal","Ochomogo y La Carpintera"]},{"id":"vc-v4","formato":"empareja","pregunta":"Uní cada elemento con lo que le corresponde en el Valle Central:","pista":"La sección oriental tiene una ciudad y un río famosos.","hashes":["e8670fc91d9a933bd8c81ec6d0683bc5d59e5395016c243a15b7e0ab8c604b73"],"izquierda":["Río que destaca en la sección oriental","Ciudad de la sección oriental","Uno de los cultivos principales","Se desarrolla junto al sector servicios"],"derecha":["La industria","Reventazón","Cartago","Café"]},{"id":"vc-v5","formato":"verifica","pregunta":"¿Es cierto que el Valle Central se ubica entre la cordillera volcánica Central, la cordillera de Talamanca y los montes del Aguacate?","pista":"Repasá los tres límites que menciona el libro para el Valle Central.","hashes":["a1a2a841070e3971df7cae3fe6f0053043a1940fc70f3592f920b9036a5e2790"],"opciones":["Sí","No"]},{"id":"vc-v6","formato":"escribe","pregunta":"En la sección oriental del Valle Central destaca un río muy importante. Escribí su nombre.","pista":"Es el río de la sección donde está Cartago. Empieza con 'Re...'.","hashes":["6c157e42d7bf7268fb2da4f0b0effc89de9182478b23cfea111c0936450ee789","729e5d493ba80b3711c6022e7d75a0f0d33856cac86a46e493a769a959d78b49","a39ce9f7301ac7d236653ce9894732db9c915c1183a1a2855117bb28dad04b3a","be3356e4ed149eb57de72de658d4fbac4eebbbc296b5291c58a64d7d2dbe32ca"]}]},{"id":"otros-valles","nombre":"Otros valles: Tempisque, Talamanca y El General-Coto Brus","explicacion":"Valle del Tempisque: se ubica en la provincia de Guanacaste. Es recorrido por el río Tempisque y sus afluentes Cañas y Bebedero. Las principales actividades económicas son la ganadería de engorde y el cultivo de arroz y caña de azúcar; además, el turismo en los parques nacionales Palo Verde y Barra Honda. Valle de Talamanca: se localiza al sureste del país, rodeado por las estribaciones de la cordillera de Talamanca. Es atravesado por los ríos Telire, Coen, Lari y Urén. Se desarrolla la ganadería y el cultivo de banano, cacao, maíz y plátano. Valle de El General-Coto Brus: se encuentra en el sureste del país, entre la cordillera de Talamanca y la fila Brunqueña. Es recorrido por los ríos General y Coto Brus, que al unirse forman el Grande de Térraba. Se practica el cultivo de café, plátano, piña y palma aceitera; también, la ganadería y el comercio en la zona fronteriza con Panamá.","microleccion":"Truco para no confundir los valles: fijate en el RÍO que los recorre o les da el nombre. Ejemplo: si en una pregunta mencionan el río Tempisque o sus afluentes Cañas y Bebedero, es el valle de Guanacaste (Tempisque). Si mencionan los ríos General y Coto Brus (que juntos forman el Grande de Térraba), es El General-Coto Brus. Si mencionan Telire, Coen, Lari o Urén, es Talamanca.","variantes":[{"id":"ov-v1","formato":"empareja","pregunta":"Uní cada valle con un río que lo recorre:","pista":"El nombre del valle muchas veces se parece al de su río.","hashes":["29722afda4d7cbdec95de3645dac2ed09623cb29a49ff064cfc6078d93eeae79"],"izquierda":["Valle del Tempisque","Valle de Talamanca","Valle de El General-Coto Brus"],"derecha":["Río General","Río Tempisque","Río Telire"]},{"id":"ov-v2","formato":"mc","pregunta":"¿En cuál provincia se ubica el valle del Tempisque?","pista":"Es la provincia donde están los parques nacionales Palo Verde y Barra Honda.","hashes":["94dc7be05149d379b84e8fea85b186c6abc10a9bc2c4d320132b2596538f092d"],"opciones":["Limón","Cartago","Guanacaste"]},{"id":"ov-v3","formato":"clasifica","pregunta":"¿A cuál valle pertenece cada característica?","pista":"El Tempisque está en Guanacaste; El General-Coto Brus está en el sureste, cerca de Panamá.","hashes":["dbc924d1273ac4756e699dc3330163a957cd9aeb10db0ce2bf84e715c7777f7d"],"categorias":["Valle del Tempisque","Valle de El General-Coto Brus"],"elementos":["Comercio en la zona fronteriza con Panamá","Cultivo de arroz y caña de azúcar con ganadería de engorde","Turismo en Palo Verde y Barra Honda","Sus ríos forman el Grande de Térraba"]},{"id":"ov-v4","formato":"verifica","pregunta":"¿Es cierto que el valle de Talamanca se localiza al noroeste del país?","pista":"Talamanca y El General-Coto Brus están del mismo lado del país. ¿Cuál es?","hashes":["f177deff510a0ef97d0e9adc41d4cebe37e24760bfec674d696ccb54d107d57b"],"opciones":["Sí","No"]},{"id":"ov-v5","formato":"porque","pregunta":"¿Por qué el valle de El General-Coto Brus se relaciona con el río Grande de Térraba?","pista":"Dos ríos del valle se juntan... ¿y qué forman?","hashes":["0f1539d29782811bf5965cbc15e0fe24ddf837937821a5eaa7fd6d656f5d0a10"],"opciones":["Porque el Grande de Térraba nace en el volcán Arenal","Porque el Grande de Térraba desemboca en el mar Caribe","Porque los ríos General y Coto Brus se unen y lo forman"]},{"id":"ov-v6","formato":"escribe","pregunta":"Escribí el nombre de la provincia donde se ubica el valle del Tempisque.","pista":"Es la provincia de las llanuras del norte del Pacífico, famosa por sus playas y sabanas.","hashes":["37ee5d5c766cc5b9856b41abbfcce7776a4508d8981607579b1aa3467006e27d","9a881d5b7aeefee1b36f8d0f75a9e352d526aa0b860699b7d90c7c925d245f8b"]}]},{"id":"llanuras-general","nombre":"Las llanuras: características generales","explicacion":"Las llanuras son las tierras más bajas del territorio nacional. Se encuentran en áreas que van de 0 a 500 m s. n. m., entre el eje montañoso central y las costas. En el país se distinguen las llanuras del norte, del Caribe y del Pacífico. Las del norte y las del Caribe son más extensas por causa de la lejanía del sistema montañoso, mientras que las del Pacífico son más cortas debido a la cercanía de ese conjunto de montañas. Son terrenos llanos; por lo tanto, facilitan el asentamiento humano y el desarrollo de actividades como agricultura y ganadería de engorde y de leche. Son los territorios que reciben mayor cantidad de turistas debido a la cercanía con la costa. Son recorridas por un río principal, el cual arrastra y deposita sedimentos en los suelos. Por ello, se conocen como tierras sedimentarias o de relleno. Son tierras fértiles por los materiales volcánicos y marinos depositados en ellas.","microleccion":"Pensá en las llanuras como 'tierras planas y bajitas'. Ejemplo para la altura: un terreno a 200 m s. n. m. SÍ puede ser llanura (está entre 0 y 500), pero uno a 900 m s. n. m. NO, porque pasa de 500. Y para la extensión: cuanto MÁS LEJOS están las montañas de la costa, MÁS LARGA es la llanura (norte y Caribe); cuanto más cerca están, más corta (Pacífico).","variantes":[{"id":"llg-v1","formato":"mc","pregunta":"¿A cuál de estas alturas es posible encontrar las llanuras del país?","pista":"Las llanuras van de 0 a 500 m s. n. m. ¿Cuál número está en ese rango?","hashes":["d3b924b5a153626ab72757e3f97149a98f71cf3dfa96fd1bece8bfd4ac63bcf2"],"opciones":["1500 m s. n. m.","950 m s. n. m.","350 m s. n. m.","800 m s. n. m."]},{"id":"llg-v2","formato":"porque","pregunta":"¿Por qué las llanuras del Pacífico son más cortas que las del norte y las del Caribe?","pista":"Depende de qué tan lejos de la costa están las montañas.","hashes":["0439c685e980f055737e8239b9d6cc63aaa724169b21dc6be1aa5459463204f7"],"opciones":["Porque tienen menos turistas","Porque en el Pacífico llueve menos","Porque el sistema montañoso está más cerca de esa costa"]},{"id":"llg-v3","formato":"verifica","pregunta":"¿Es cierto que las llanuras se conocen como tierras sedimentarias o de relleno?","pista":"Pensá en lo que el río va soltando en los suelos a su paso.","hashes":["5e97e88f5d0fb442a7b45f3cee3e59483d2a9243318114c968a0b430650cc100"],"opciones":["Sí","No"]},{"id":"llg-v4","formato":"arma","pregunta":"El río principal de una llanura arrastra y deposita... (armá la palabra con las fichas)","pista":"Es la arena, las piedrecillas y la tierra que el río va soltando en los suelos.","hashes":["ce3be6c28d5a4f974e0d0dfd41ae546c268e75cfafe03d771ca981a4966e871c"],"fichas":["ce","men","di","se","ni","zas","tos"]},{"id":"llg-v5","formato":"ordena","pregunta":"Ordená estos terrenos desde el MÁS BAJO hasta el MÁS ALTO:","pista":"Las llanuras están ENTRE el eje montañoso y las costas, de 0 a 500 metros.","hashes":["61ab91f09c0a8e95b164bbe3ec131d2ae717d17584e913036638ac92b3a76b74"],"elementos":["Las llanuras","El eje montañoso central","Las costas"]}]},{"id":"tipos-llanuras","nombre":"Llanuras del norte, del Caribe y del Pacífico","explicacion":"Llanuras del norte: se ubican entre las cordilleras volcánicas de Guanacaste y Central, la cordillera de Tilarán y la frontera con Nicaragua. Son recorridas por los ríos San Carlos, Frío y Sarapiquí, que desembocan en el río San Juan y en el lago de Nicaragua. Se cultiva banano, cítricos, arroz y piña; también se impulsa la ganadería y la explotación de madera. Llanuras del Caribe: se localizan entre la cordillera volcánica Central, la cordillera de Talamanca y la costa del Caribe. Son atravesadas por los ríos Tortuguero, Santa Clara, Matina, La Estrella y Sixaola, que desembocan en el mar Caribe. Destaca la siembra de banano, plátano, palmito, tubérculos, papaya y piña. Llanuras del Pacífico: se extienden entre la costa del Pacífico y los sistemas montañosos. Son recorridas por los ríos Tempisque, Grande de Tárcoles, Pirrís, Parrita, Grande de Térraba y Coto-Colorado, que desembocan en el golfo de Nicoya y en el océano Pacífico. Los cultivos principales son arroz, banano, caña de azúcar y palma africana. Se desarrolla la ganadería de leche y de engorde, así como la industria de fertilizantes.","microleccion":"Truco: seguí el camino del agua. Ejemplo: si un río desemboca en el mar Caribe (como el Matina), su llanura es la del Caribe. Si desemboca en el río San Juan o en el lago de Nicaragua (como el San Carlos), es la del norte. Si desemboca en el océano Pacífico o en el golfo de Nicoya (como el Pirrís), es la del Pacífico.","variantes":[{"id":"tll-v1","formato":"clasifica","pregunta":"Clasificá cada característica según la llanura a la que pertenece (como en la actividad 'Colorea'):","pista":"Seguí el camino del agua: ¿hacia dónde desembocan los ríos de cada una?","hashes":["c8aedeae7bab7105bcbe1fb02d2d288882b9790f8335f4f9a83e869f6b2bae7c"],"categorias":["Llanuras del norte","Llanuras del Caribe","Llanuras del Pacífico"],"elementos":["Se siembra banano, plátano, palmito y tubérculos","Abarcan la mayor parte de la frontera con Nicaragua","Son atravesadas por los ríos Tortuguero y Santa Clara","Se desarrolla la ganadería y la industria de fertilizantes","Son recorridas por los ríos San Carlos, Frío y Sarapiquí","Sus ríos desembocan en el golfo de Nicoya"]},{"id":"tll-v2","formato":"empareja","pregunta":"Uní cada llanura con el lugar donde desembocan sus ríos:","pista":"Los ríos del norte van hacia Nicaragua; los demás, hacia su propio mar.","hashes":["ff6de3d8316ed35687367e4e5f1154be412cae7291868d5c06fd040 or ejemplo, con el oeste de Estados Unidos, y con América del Sur y Europa. Turismo, que se impulsa en las playas y en los parques nacionales costeros.","microleccion":"Para ubicar las masas de agua, usá el sol como guía: por donde SALE el sol (este) está el mar Caribe; por donde se OCULTA (oeste), el océano Pacífico. Y para recordar 'cabotaje', pensá en 'costa + bote': botes pequeños que van de punto a punto por la costa llevando mercadería o personas.","variantes":[{"id":"ca-v1","formato":"verifica","pregunta":"¿Es cierto que el cabotaje es la navegación en pequeñas lanchas?","pista":"Cabotaje: 'costa + bote'.","hashes":["56e34afa86526b482cb7099a1fabc313e9cbda54f92f2049adabcd2cdb5299d3"],"opciones":["Sí","No"]},{"id":"ca-v2","formato":"empareja","pregunta":"Uní cada idea con lo que le corresponde:","pista":"Por donde sale el sol está el Caribe; por donde se oculta, el Pacífico.","hashes":["a73506fd57c882d7311553df0403d21990eed7f8367e2fcf7edb67adbb91a504"],"izquierda":["Al este del país","Al oeste del país","Tierra en contacto con las masas de agua"],"derecha":["Mar Caribe","Costa","Océano Pacífico"]},{"id":"ca-v3","formato":"mc","pregunta":"¿Qué es el cabotaje?","pista":"Es parte del COMERCIO y sirve para intercambiar mercadería o transportar personas.","hashes":["097a8632927e8d45a26d19ce96c003726f6ce1758272f51e6788cc79d66f8a41"],"opciones":["La navegación en pequeñas lanchas hacia diversos puntos de la costa","El turismo en los parques nacionales costeros","La pesca que se practica en los manglares"]},{"id":"ca-v4","formato":"clasifica","pregunta":"Clasificá cada ejemplo según la actividad económica de las costas:","pista":"Una se hace con redes y anzuelos, otra con lanchas y ventas, y otra con visitantes.","hashes":["6980bb469745f7f1db66bf4a13eecabd11e09ae1d81c78fca448fcd415f737b9"],"categorias":["Pesca","Comercio","Turismo"],"elementos":["Cabotaje e intercambios con América del Sur y Europa","Se impulsa en las playas y en los parques nacionales costeros","Se practica en los ríos, en los manglares y en el mar"]},{"id":"ca-v5","formato":"escribe","pregunta":"¿Cómo se llama la navegación en pequeñas lanchas que va por la costa haciendo intercambios comerciales o transportando personas? Escribí la palabra.","pista":"Empieza con 'ca...' y suena a 'costa + bote'.","hashes":["c7f3f95ceff07582cc1106b47cdd6c02e4404916ea273b0810beedbe1d776ef9","8676b0a3f237b7fac28e69da2f583f6cc75e2bddde7e5b17f71eaab801e11e6f"]}]},{"id":"costa-pacifico","nombre":"La costa del Pacífico","explicacion":"La costa del Pacífico presenta numerosas puntas, cabos, golfos y penínsulas, que la hacen muy irregular; entre ellas están bahía Salinas, cabo Santa Elena, golfo de Papagayo, isla Chira, golfo de Nicoya, isla San Lucas, península de Nicoya, cabo Blanco, isla del Coco, isla del Caño, península de Osa, golfo Dulce y punta Burica. Mide aproximadamente 1254 km y se extiende desde bahía Salinas, en el noroeste del país, hasta punta Burica, en el sureste. Su paisaje está integrado por terrenos rocosos y playas pequeñas como Potrero, Tamarindo, Sámara, Brasilito, Conchal y Herradura; en la región del golfo de Papagayo y de la península de Santa Elena son evidentes los acantilados. Sus puertos son Puntarenas, Caldera, Quepos y Golfito.","microleccion":"Para acordarte de la costa del Pacífico: es la LARGA y la IRREGULAR. Ejemplo de razonamiento: si te nombran un golfo o una península, casi seguro está en el Pacífico, porque esa costa está llena de puntas, cabos, golfos y penínsulas; la del Caribe, en cambio, es casi una línea recta.","variantes":[{"id":"cp-v1","formato":"verifica","pregunta":"¿Es cierto que la costa del Pacífico es casi lineal, con pocas irregularidades?","pista":"¿Cuál de las dos costas está llena de puntas, cabos, golfos y penínsulas?","hashes":["6f248508964d9479b8a48fb322df23b2d9085bff2cf41399f68a8f8305acdadd"],"opciones":["Sí","No"]},{"id":"cp-v2","formato":"mc","pregunta":"¿Desde dónde y hasta dónde se extiende la costa del Pacífico?","pist /* ---------- sha256 puro en JS (sin depender de crypto.subtle) ---------- */
function sha256hex(ascii){
function rr(v,c){return(v>>>c)|(v<<(32-c));}
var mw=Math.pow,ms=mw(2,32),i,j,result='';
var words=[],al=ascii.length*8;
var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
var isC={};
for(var cand=2;pc<64;cand++){
if(!isC[cand]){for(i=0;i<313;i+=cand){isC[i]=cand;}
hash[pc]=(mw(cand,.5)*ms)|0;k[pc++]=(mw(cand,1/3)*ms)|0;}}
ascii+='\x80';
while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;
words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=(al/ms)|0;words[words.length]=al;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16),oh=hash.slice(0,8);
for(i=16;i<64;i++){var w15=w[i-15],w2=w[i-2];
w[i]=((rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))+w[i-16])|0;}
for(i=0;i<64;i++){
var a=hash[0],e=hash[4];
var t1=(hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+w[i])|0;
var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.length=8;}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b>>4).toString(16))+((b&15).toString(16));}
return result;}
function utf8(s){return unescape(encodeURIComponent(s));}
function sha(s){return sha256hex(utf8(s));}

/* ---------- utilidades ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function normArma(s){return norm(s).replace(/\s+/g,'');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(id){return document.getElementById(id);}
function mezclarVista(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- estado ---------- */
var estado={
  orden:[],            // ids de temas en el orden elegido por el niño/la niña
  cola:[],             // encuentros pendientes: ids de tema
  temas:{},            // id -> {creditos,fallos,intentos,pistas,dominado,usadas:[],ultimoFormato,microVista}
  actual:null,         // {temaId, variante}
  respondidas:0,
  guardadas:0,         // usos de "guardar para después" (máx 2)
  rondas:0,
  inicioRonda:0,
  fase:'normal',          // 'normal' | 'repaso'
  repasoLista:[],
  repasoIdx:0,
  refuerzoIntentos:0
};
DATOS.temas.forEach(function(t){estado.temas[t.id]={creditos:0,fallos:0,intentos:0,pistas:0,dominado:false,usadas:[],ultimoFormato:null,microVista:false,reforzado:false,resumen:''};});

/* ---------- progreso guardado entre sesiones ---------- */
var CLAVE='practica-'+DATOS.sal;
function guardarProgreso(){
  try{
    var t={};
    DATOS.temas.forEach(function(x){var s=estado.temas[x.id];t[x.id]={creditos:s.creditos,fallos:s.fallos,intentos:s.intentos,pistas:s.pistas,dominado:s.dominado,usadas:s.usadas,ultimoFormato:s.ultimoFormato,microVista:s.microVista,reforzado:s.reforzado,resumen:s.resumen||''};});
    localStorage.setItem(CLAVE,JSON.stringify({orden:estado.orden,temas:t,respondidas:estado.respondidas,guardadas:estado.guardadas,rondas:estado.rondas}));
  }catch(e){}
}
function cargarProgreso(){try{var s=localStorage.getItem(CLAVE);return s?JSON.parse(s):null;}catch(e){return null;}}
function borrarProgreso(){try{localStorage.removeItem(CLAVE);}catch(e){}}

/* ---------- lectura en voz alta ---------- */
function leerEnVoz(texto){
  try{
    var u=new SpeechSynthesisUtterance(String(texto).replace(/<[^>]*>/g,' '));
    u.lang='es-ES';u.rate=0.95;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}

function temaPorId(id){for(var i=0;i<DATOS.temas.length;i++)if(DATOS.temas[i].id===id)return DATOS.temas[i];return null;}
function temasPendientes(){return DATOS.temas.filter(function(t){return !estado.temas[t.id].dominado;});}

/* ---------- selección de variantes ---------- */
function elegirVariante(tema,evitarFormato){
  var st=estado.temas[tema.id];
  var cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0 && v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0;});
  if(!cand.length){st.usadas=[];cand=tema.variantes.slice();}
  var v=cand[Math.floor(Math.random()*cand.length)];
  if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);
  st.ultimoFormato=v.formato;
  return v;
}

/* ---------- planificador ---------- */
function insertarEncuentro(temaId,distancia){
  var pos=Math.min(estado.cola.length,distancia);
  estado.cola.splice(pos,0,temaId);
}
function siguiente(){
  if(!estado.cola.length){
    var pend=temasPendientes();
    if(!pend.length){mostrarFinal();return;}
    estado.orden.forEach(function(id){if(pend.some(function(t){return t.id===id;}))estado.cola.push(id);});
  }
  // evitar dos encuentros seguidos del mismo tema si hay alternativa
  if(estado.actual&&estado.cola.length>1&&estado.cola[0]===estado.actual.temaId){
    estado.cola.push(estado.cola.shift());
  }
  var temaId=estado.cola.shift();
  var tema=temaPorId(temaId);
  if(estado.temas[temaId].dominado){siguiente();return;}
  var evitar=(estado.actual&&estado.actual.temaId===temaId)?estado.actual.variante.formato:estado.temas[temaId].ultimoFormato;
  var v=elegirVariante(tema,evitar);
  estado.actual={temaId:temaId,variante:v};
  pintarPregunta(tema,v);
}

/* ---------- pantallas ---------- */
function pintarInicio(){
  var prog=cargarProgreso();
  if(prog&&prog.respondidas>0){
    var listos=0;DATOS.temas.forEach(function(t){if(prog.temas&&prog.temas[t.id]&&prog.temas[t.id].dominado)listos++;});
    var h='<div class="carta" style="text-align:center"><h1>¡Hola de nuevo! 👋</h1>';
    h+='<p>La vez pasada llevabas <b>'+prog.respondidas+' preguntas</b> y <b>'+listos+' de '+DATOS.temas.length+' temas listos</b>.</p>';
    h+='<button class="btn-principal" id="btn-continuar" style="margin-bottom:8px">Continuar donde iba ▶</button>';
    h+='<button class="btn-sec" id="btn-cero" style="width:100%">🔄 Empezar de cero</button></div>';
    el('app').innerHTML=h;
    el('btn-continuar').addEventListener('click',function(){restaurarProgreso(prog);});
    el('btn-cero').addEventListener('click',function(){borrarProgreso();pintarInicioNuevo();});
    return;
  }
  pintarInicioNuevo();
}
function restaurarProgreso(prog){
  estado.orden=prog.orden||DATOS.temas.map(function(t){return t.id;});
  estado.respondidas=prog.respondidas||0;
  estado.guardadas=prog.guardadas||0;
  estado.rondas=prog.rondas||0;
  DATOS.temas.forEach(function(t){
    var g=prog.temas&&prog.temas[t.id];
    if(g)Object.keys(g).forEach(function(k){estado.temas[t.id][k]=g[k];});
  });
  estado.cola=[];
  estado.inicioRonda=Date.now();
  siguiente();
}
function pintarInicioNuevo(){
  var h='<div class="carta"><h1>'+esc(DATOS.titulo)+'</h1>';
  if(DATOS.materia)h+='<p class="suave">'+esc(DATOS.materia)+'</p>';
  h+='<p>Elegí <b>el orden</b> en que querés practicar los temas. Tocá cada tema en el orden que prefieras:</p><div id="lista-temas">';
  DATOS.temas.forEach(function(t){
    h+='<button class="btn-opcion" data-tema="'+esc(t.id)+'"><span class="orden-num oculto"></span>'+esc(t.nombre)+'</button>';
  });
  h+='</div><button class="btn-sec" id="btn-sugerido" style="margin-top:6px">Usar el orden sugerido</button>';
  h+='<button class="btn-principal oculto" id="btn-comenzar" style="margin-top:10px">¡Comenzar! 🚀</button></div>';
  el('app').innerHTML=h;
  var botones=el('lista-temas').querySelectorAll('button');
  botones.forEach(function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-tema');
      var i=estado.orden.indexOf(id);
      if(i>=0){estado.orden.splice(i,1);}else{estado.orden.push(id);}
      botones.forEach(function(bb){
        var idx=estado.orden.indexOf(bb.getAttribute('data-tema'));
        var num=bb.querySelector('.orden-num');
        if(idx>=0){num.classList.remove('oculto');num.textContent=idx+1;}
        else{num.classList.add('oculto');num.textContent='';}
      });
      el('btn-comenzar').classList.toggle('oculto',estado.orden.length!==DATOS.temas.length);
    });
  });
  el('btn-sugerido').addEventListener('click',function(){
    estado.orden=DATOS.temas.map(function(t){return t.id;});
    comenzar();
  });
  el('btn-comenzar').addEventListener('click',comenzar);
}
function comenzar(){
  estado.cola=estado.orden.slice();
  estado.inicioRonda=Date.now();
  siguiente();
}

function barraSuperior(){
  if(estado.fase==='repaso'){
    return '<div class="barra"><span class="pill">🔁 Repaso final</span><span class="pill">Tema '+(estado.repasoIdx+1)+' de '+estado.repasoLista.length+'</span><button class="btn-sec" id="btn-pausa">⏸ Pausa</button></div>';
  }
  var dom=DATOS.temas.filter(function(t){return estado.temas[t.id].dominado;}).length;
  var pct=Math.round(100*dom/DATOS.temas.length);
  var restanRonda=6-(estado.respondidas%6);
  return '<div class="barra"><span class="pill">Temas listos: '+dom+'/'+DATOS.temas.length+'</span>'+
    '<span class="pill">Ronda '+(estado.rondas+1)+' · faltan '+restanRonda+'</span>'+
    '<button class="btn-sec" id="btn-pausa">⏸ Pausa</button></div>'+
    '<div class="progreso"><div style="width:'+pct+'%"></div></div>';
}

function pintarPregunta(tema,v){
  var h=barraSuperior();
  h+='<div class="carta"><p class="suave">Tema: <b>'+esc(tema.nombre)+'</b></p>';
  h+='<h2>'+esc(v.pregunta)+'</h2><div id="zona-respuesta">';
  switch(v.formato){
    case 'mc': case 'porque': case 'verifica':
      v.opciones.forEach(function(o,i){h+='<button class="btn-opcion" data-op="'+i+'">'+esc(o)+'</button>';});
      break;
    case 'arma':
      h+='<div class="zona-construccion" id="construccion"></div><div id="fichas">';
      v.fichas.forEach(function(f,i){h+='<button class="ficha" data-f="'+i+'">'+esc(f)+'</button>';});
      h+='</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn-sec" id="btn-borrar">Borrar</button><button class="btn-principal" id="btn-comprobar" style="flex:1">Comprobar</button></div>';
      break;
    case 'clasifica':
      v.elementos.forEach(function(e,i){
        h+='<div class="fila-sel"><b>'+esc(e)+'</b><select data-el="'+i+'"><option value="">— elegir —</option>';
        v.categorias.forEach(function(c){h+='<option value="'+esc(c)+'">'+esc(c)+'</option>';});
        h+='</select></div>';
      });
      h+='<button class="btn-principal" id="btn-comprobar">Comprobar</button>';
      break;
    case 'ordena':
      h+='<div id="lista-ordena"></div><button class="btn-principal" id="btn-comprobar" style="margin-top:8px">Comprobar</button>';
      break;
    case 'empareja':
      var der=mezclarVista(v.derecha);
      v.izquierda.forEach(function(iz,i){
        h+='<div class="fila-sel"><b>'+esc(iz)+'</b><select data-iz="'+i+'"><option value="">— elegir —</option>';
        der.forEach(function(d){h+='<option value="'+esc(d)+'">'+esc(d)+'</option>';});
        h+='</select></div>';
      });
      h+='<button class="btn-principal" id="btn-comprobar">Comprobar</button>';
      break;
    case 'escribe':
      h+='<input type="text" class="respuesta-escrita" id="respuesta-texto" placeholder="Escribí tu respuesta aquí..." autocomplete="off" autocorrect="off" spellcheck="false">';
      h+='<button class="btn-principal" id="btn-comprobar">Comprobar</button>';
      break;
  }
  h+='</div><div id="feedback"></div>';
  h+='<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">';
  h+='<button class="btn-sec" id="btn-pista">💡 Pista</button>';
  h+='<button class="btn-sec" id="btn-oir-preg">🔊 Escuchar</button>';
  if(estado.fase==='normal'&&estado.guardadas<2)h+='<button class="btn-sec" id="btn-guardar">📌 Para después ('+(2-estado.guardadas)+')</button>';
  h+='</div></div>';
  el('app').innerHTML=h;
  el('btn-pausa').addEventListener('click',function(){pausaLibre();});
  el('btn-oir-preg').addEventListener('click',function(){leerEnVoz(v.pregunta);});
  el('btn-pista').addEventListener('click',function(){
    estado.temas[tema.id].pistas++;
    mostrarOverlay('💡 Pista','<p>'+esc(v.pista||'Releé la pregunta con calma; fijate bien en cada palabra.')+'</p>','Seguir');
  });
  var bg=el('btn-guardar');
  if(bg)bg.addEventListener('click',function(){
    estado.guardadas++;
    estado.cola.push(tema.id);
    estado.actual=null;
    siguiente();
  });
  var construccion=[];
  switch(v.formato){
    case 'mc': case 'porque': case 'verifica':
      el('zona-respuesta').querySelectorAll('.btn-opcion').forEach(function(b){
        b.addEventListener('click',function(){responder(tema,v,norm(v.opciones[parseInt(b.getAttribute('data-op'),10)]));});
      });
      break;
    case 'arma':
      function pintarConstruccion(){
        var z=el('construccion');z.innerHTML='';
        construccion.forEach(function(f,i){
          var b=document.createElement('button');b.className='ficha';b.textContent=f;
          b.addEventListener('click',function(){construccion.splice(i,1);pintarConstruccion();});
          z.appendChild(b);
        });
      }
      el('fichas').querySelectorAll('.ficha').forEach(function(b){
        b.addEventListener('click',function(){construccion.push(v.fichas[parseInt(b.getAttribute('data-f'),10)]);pintarConstruccion();});
      });
      el('btn-borrar').addEventListener('click',function(){construccion=[];pintarConstruccion();});
      el('btn-comprobar').addEventListener('click',function(){responder(tema,v,normArma(construccion.join('')));});
      break;
    case 'clasifica':
      el('btn-comprobar').addEventListener('click',function(){
        var sels=el('zona-respuesta').querySelectorAll('select');
        var partes=[],completo=true;
        sels.forEach(function(s){
          var i=parseInt(s.getAttribute('data-el'),10);
          if(!s.value)completo=false;
          partes.push(norm(v.elementos[i])+'>'+norm(s.value));
        });
        if(!completo){avisoCompletar();return;}
        responder(tema,v,partes.sort().join(';'));
      });
      break;
    case 'ordena':
      var elems=v.elementos.slice();
      function pintarOrden(){
        var z=el('lista-ordena');z.innerHTML='';
        elems.forEach(function(e,i){
          var f=document.createElement('div');f.className='fila-orden';
          f.innerHTML='<span>'+esc(e)+'</span>';
          var up=document.createElement('button');up.textContent='▲';
          var dn=document.createElement('button');dn.textContent='▼';
          up.addEventListener('click',function(){if(i>0){var t=elems[i-1];elems[i-1]=elems[i];elems[i]=t;pintarOrden();}});
          dn.addEventListener('click',function(){if(i<elems.length-1){var t=elems[i+1];elems[i+1]=elems[i];elems[i]=t;pintarOrden();}});
          f.appendChild(up);f.appendChild(dn);z.appendChild(f);
        });
      }
      pintarOrden();
      el('btn-comprobar').addEventListener('click',function(){responder(tema,v,elems.map(norm).join('>'));});
      break;
    case 'empareja':
      el('btn-comprobar').addEventListener('click',function(){
        var sels=el('zona-respuesta').querySelectorAll('select');
        var partes=[],completo=true;
        sels.forEach(function(s){
          var i=parseInt(s.getAttribute('data-iz'),10);
          if(!s.value)completo=false;
          partes.push(norm(v.izquierda[i])+'>'+norm(s.value));
        });
        if(!completo){avisoCompletar();return;}
        responder(tema,v,partes.sort().join(';'));
      });
      break;
    case 'escribe':
      var inp=el('respuesta-texto');
      var enviarEscrita=function(){
        var val=inp.value.trim();
        if(!val){avisoCompletar();return;}
        responder(tema,v,norm(val));
      };
      el('btn-comprobar').addEventListener('click',enviarEscrita);
      inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarEscrita();});
      inp.focus();
      break;
  }
}
function avisoCompletar(){
  el('feedback').innerHTML='<div class="feedback fb-nube">Te falta completar alguna parte 😊</div>';
}

/* ---------- respuesta ---------- */
function responder(tema,v,canonicaUsuario){
  var st=estado.temas[tema.id];
  st.intentos++;
  var ok=v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+canonicaUsuario))>=0;
  estado.respondidas++;
  if(estado.fase==='repaso'){responderRepaso(tema,st,ok);return;}
  if(ok){
    st.creditos++;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;}
    else{insertarEncuentro(tema.id,3);} // vuelve más adelante: dominio en encuentros separados
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐ '+(st.dominado?'¡Tema completado!':'Este tema volverá una vez más para asegurarlo.')+'</div>';
  }else{
    st.fallos++;
    insertarEncuentro(tema.id,2); // vuelve pronto, con otra variante de otro formato
    el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Este tema volverá más adelante con otra pregunta.</div>';
  }
  guardarProgreso();
  desactivarZona();
  setTimeout(function(){
    if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
    despuesDeResponder();
  },1400);
}
function desactivarZona(){
  el('zona-respuesta').querySelectorAll('button,select').forEach(function(x){x.disabled=true;});
  var bp=el('btn-pista');if(bp)bp.disabled=true;
  var bg=el('btn-guardar');if(bg)bg.disabled=true;
}
function despuesDeResponder(){
  if(estado.respondidas%6===0){estado.rondas++;pausaRonda();return;}
  siguiente();
}

/* ---------- microlección ---------- */
function mostrarMicro(tema){
  var h='<p>Veamos un ejemplo parecido, paso a paso:</p><div class="explicacion">'+tema.microleccion+'</div>';
  if(tema.explicacion)h+='<details><summary class="suave">Ver la explicación del profesor</summary><div class="explicacion">'+tema.explicacion+'</div></details>';
  mostrarOverlay('📖 Mini-lección: '+esc(tema.nombre),h,'¡Entendido!',function(){despuesDeResponder();});
}

/* ---------- pausas ---------- */
function pausaRonda(){
  var min=Math.round((Date.now()-estado.inicioRonda)/60000);
  var h='<div class="carta" style="text-align:center"><h1>¡Ronda '+estado.rondas+' completada! 🎉</h1>';
  h+='<p>Llevás '+estado.respondidas+' preguntas'+(min>0?' en unos '+min+' minutos':'')+'.</p>';
  h+='<p><b>Pausa con movimiento:</b> levantate, estirá los brazos, saltá 10 veces o andá por un vaso de agua. 🤸</p>';
  if(estado.rondas>=3){
    h+='<p>Ya hiciste 3 rondas. <b>Es un buen momento para parar</b> y seguir otro día.</p>';
    h+='<button class="btn-principal" id="btn-terminar" style="margin-bottom:8px">Terminar y ver el informe</button>';
    h+='<button class="btn-sec" id="btn-seguir" style="width:100%">Quiero seguir un poco más</button>';
  }else{
    h+='<button class="btn-principal" id="btn-seguir">¡Listo, sigamos!</button>';
  }
  h+='</div>';
  el('app').innerHTML=h;
  var bs=el('btn-seguir');
  if(bs)bs.addEventListener('click',function(){estado.inicioRonda=Date.now();siguiente();});
  var bt=el('btn-terminar');
  if(bt)bt.addEventListener('click',mostrarFinal);
}
function pausaLibre(){
  mostrarOverlay('⏸ En pausa','<p style="text-align:center;font-size:2rem">🧘</p><p style="text-align:center">Tomate el tiempo que necesités.</p>','Seguir practicando');
}

/* ---------- overlay genérico ---------- */
function mostrarOverlay(titulo,cuerpoHtml,textoBoton,alCerrar){
  var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="carta"><h2>'+titulo+'</h2>'+cuerpoHtml+'<button class="btn-principal" style="margin-top:10px">'+esc(textoBoton)+'</button></div>';
  o.querySelector('.btn-principal').addEventListener('click',function(){o.remove();if(alCerrar)alCerrar();});
  document.body.appendChild(o);
}

/* ---------- fase de repaso final ---------- */
function tarjetasDeTema(t){
  var cartas=[];
  var exp=String(t.explicacion||'').trim();
  if(exp){
    if(exp.indexOf('<')>=0){cartas.push({frente:'Idea clave',dorso:exp,html:true});}
    else{
      var partes=exp.split('. ').map(function(p){p=p.trim();return p?(/[.!?:]$/.test(p)?p:p+'.'):'';}).filter(Boolean);
      var maxCartas=5,tam=Math.max(1,Math.ceil(partes.length/maxCartas));
      for(var i=0;i<partes.length;i+=tam){cartas.push({frente:'Idea '+(cartas.length+1),dorso:partes.slice(i,i+tam).join(' '),html:false});}
    }
  }
  cartas.push({frente:'⭐ Ejemplo paso a paso',dorso:t.microleccion,html:true});
  return cartas;
}
function pintarRepaso(tema){
  var st=estado.temas[tema.id];
  var cartas=tarjetasDeTema(tema);
  var completado=false;
  var h=barraSuperior();
  h+='<div class="carta"><h2>🔁 Repaso: '+esc(tema.nombre)+'</h2>';
  h+='<p class="suave">Elegí CÓMO querés repasarlo. Al terminar cualquiera de las formas, vas a poder demostrarlo.</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">';
  h+='<button class="btn-sec" data-modo="tarjetas">📖 Tarjetas</button>';
  h+='<button class="btn-sec" data-modo="esquema">🗺️ Esquema</button>';
  h+='<button class="btn-sec" data-modo="escribir">✍️ Escribirlo</button>';
  h+='<button class="btn-sec" id="btn-oir-repaso">🔊 Escuchar</button></div>';
  h+='<div id="zona-modo"><p class="suave">👆 Elegí una forma de repasar. Todas valen: usá la que más te guste hoy.</p></div>';
  h+='<button class="btn-principal" id="btn-demostrar" disabled style="margin-top:10px">¡Ya lo repasé, a demostrarlo! 💪</button></div>';
  el('app').innerHTML=h;
  el('btn-pausa').addEventListener('click',pausaLibre);
  el('btn-oir-repaso').addEventListener('click',function(){
    leerEnVoz(cartas.map(function(c){return c.dorso;}).join('. '));
  });
  function desbloquear(){if(!completado){completado=true;el('btn-demostrar').disabled=false;}}
  document.querySelectorAll('[data-modo]').forEach(function(b){
    b.addEventListener('click',function(){
      var m=b.getAttribute('data-modo');
      if(m==='tarjetas')modoTarjetas(cartas,desbloquear);
      else if(m==='esquema')modoEsquema(tema,cartas,desbloquear);
      else modoEscribir(cartas,desbloquear,st);
    });
  });
  el('btn-demostrar').addEventListener('click',function(){preguntaRefuerzo(tema);});
}
function modoTarjetas(cartas,alCompletar){
  var vistas=0;
  var h='<p class="suave">Tocá cada tarjeta para descubrir la idea.</p><div id="cartas-repaso">';
  cartas.forEach(function(c,i){
    h+='<div class="tarjeta-repaso" data-i="'+i+'"><div class="cara-frente">'+esc(c.frente)+' · tocá para ver 👆</div><div class="cara-dorso oculto"></div></div>';
  });
  h+='</div><p class="suave" id="contador-cartas">Tarjetas vistas: 0 de '+cartas.length+'</p>';
  el('zona-modo').innerHTML=h;
  document.querySelectorAll('.tarjeta-repaso').forEach(function(card){
    card.addEventListener('click',function(){
      if(card.classList.contains('vista'))return;
      var i=parseInt(card.getAttribute('data-i'),10);
      card.classList.add('girando');
      setTimeout(function(){
        card.querySelector('.cara-frente').classList.add('oculto');
        var dorso=card.querySelector('.cara-dorso');
        if(cartas[i].html)dorso.innerHTML=cartas[i].dorso;else dorso.textContent=cartas[i].dorso;
        dorso.classList.remove('oculto');
        card.classList.remove('girando');
        card.classList.add('vista');
        vistas++;
        el('contador-cartas').textContent='Tarjetas vistas: '+vistas+' de '+cartas.length;
        if(vistas===cartas.length)alCompletar();
      },200);
    });
  });
}
function modoEsquema(tema,cartas,alCompletar){
  var h='<p class="suave">Un mapa de ideas para verlo todo de un vistazo:</p>';
  h+='<div class="esquema"><div class="nodo-centro">'+esc(tema.nombre)+'</div><div class="ramas">';
  cartas.forEach(function(c){
    h+='<div class="rama'+(c.frente.indexOf('⭐')>=0?' rama-estrella':'')+'"><b>'+esc(c.frente)+'</b><div>'+(c.html?c.dorso:esc(c.dorso))+'</div></div>';
  });
  h+='</div></div><button class="btn-sec" id="btn-esquema-listo" style="width:100%;margin-top:8px">¡Ya estudié el esquema! ✅</button>';
  el('zona-modo').innerHTML=h;
  el('btn-esquema-listo').addEventListener('click',function(){
    el('btn-esquema-listo').textContent='Esquema estudiado ✔';
    alCompletar();
  });
}
function modoEscribir(cartas,alCompletar,st){
  var h='<p class="suave">Escribí con TUS palabras lo más importante de este tema. Escribirlo vos ayuda muchísimo a recordarlo:</p>';
  h+='<textarea id="txt-resumen" rows="4" placeholder="Yo aprendí que..."></textarea>';
  h+='<button class="btn-sec" id="btn-comparar" style="width:100%;margin-top:8px" disabled>Comparar con las ideas del libro</button>';
  h+='<div id="zona-comparar"></div>';
  el('zona-modo').innerHTML=h;
  var t=el('txt-resumen');
  t.addEventListener('input',function(){el('btn-comparar').disabled=t.value.trim().length<15;});
  el('btn-comparar').addEventListener('click',function(){
    st.resumen=t.value.trim();
    var c='<p style="margin-top:10px"><b>Compará lo tuyo con las ideas del libro:</b></p>';
    cartas.forEach(function(x){c+='<div class="explicacion">'+(x.html?x.dorso:esc(x.dorso))+'</div>';});
    c+='<p class="suave">¿Se parece? Si te faltó algo, es normal: para eso repasamos 😉</p>';
    el('zona-comparar').innerHTML=c;
    guardarProgreso();
    alCompletar();
  });
}
function preguntaRefuerzo(tema){
  var st=estado.temas[tema.id];
  // preferir formatos generativos (escribir/armar): recordar produciendo fija más la memoria
  var gen=tema.variantes.filter(function(x){return (x.formato==='escribe'||x.formato==='arma')&&st.usadas.indexOf(x.id)<0;});
  var v;
  if(gen.length){v=gen[Math.floor(Math.random()*gen.length)];if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);st.ultimoFormato=v.formato;}
  else{v=elegirVariante(tema,st.ultimoFormato);}
  estado.actual={temaId:tema.id,variante:v};
  pintarPregunta(tema,v);
}
function responderRepaso(tema,st,ok){
  desactivarZona();
  if(ok){
    st.reforzado=true;
    guardarProgreso();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Eso es! 🌟 Tema reforzado.</div>';
    setTimeout(avanzarRepaso,1400);
  }else{
    st.fallos++;
    estado.refuerzoIntentos++;
    guardarProgreso();
    if(estado.refuerzoIntentos<2){
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Mirá el ejemplo otra vez y probá con otra pregunta.</div>';
      setTimeout(function(){
        mostrarOverlay('⭐ Ejemplo paso a paso','<div class="explicacion">'+tema.microleccion+'</div>','Probar otra vez',function(){preguntaRefuerzo(tema);});
      },1400);
    }else{
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no — este tema lo seguimos practicando otro día 💙</div>';
      setTimeout(avanzarRepaso,1400);
    }
  }
}
function avanzarRepaso(){
  estado.refuerzoIntentos=0;
  estado.repasoIdx++;
  if(estado.repasoIdx<estado.repasoLista.length){pintarRepaso(temaPorId(estado.repasoLista[estado.repasoIdx]));}
  else{informeFinal();}
}

/* ---------- informe final ---------- */
function mostrarFinal(){
  if(estado.fase==='normal'){
    var lista=DATOS.temas.filter(function(t){var st=estado.temas[t.id];return st.fallos>0||(st.intentos>0&&!st.dominado);}).map(function(t){return t.id;});
    if(lista.length){
      var h='<div class="carta" style="text-align:center"><h1>🔁 ¡Último paso!</h1>';
      h+='<p>Hubo '+lista.length+' tema'+(lista.length>1?'s':'')+' que costaron un poquito. Vamos a repasarlos con tarjetas y después demostrás lo aprendido.</p>';
      h+='<button class="btn-principal" id="btn-ir-repaso" style="margin-bottom:8px">¡Vamos al repaso! ✨</button>';
      h+='<button class="btn-sec" id="btn-saltar-repaso" style="width:100%">Ver el informe ya</button></div>';
      el('app').innerHTML=h;
      el('btn-ir-repaso').addEventListener('click',function(){estado.fase='repaso';estado.repasoLista=lista;estado.repasoIdx=0;estado.refuerzoIntentos=0;pintarRepaso(temaPorId(lista[0]));});
      el('btn-saltar-repaso').addEventListener('click',informeFinal);
      return;
    }
  }
  informeFinal();
}
function informeFinal(){
  var h='<div class="carta"><h1>¡Buen trabajo! 🌟</h1><p>Practicaste '+estado.respondidas+' preguntas.</p></div>';
  h+='<div class="carta"><h2>Informe para la persona adulta</h2><table class="informe"><tr><th>Tema</th><th>Intentos</th><th>Pistas</th><th>Estado</th></tr>';
  var repasar=[];
  DATOS.temas.forEach(function(t){
    var st=estado.temas[t.id];
    var estadoTxt;
    if(st.dominado)estadoTxt='✅ Dominado'+(st.reforzado?' · 💪 reforzado':'');
    else if(st.reforzado)estadoTxt='💪 Reforzado en el repaso';
    else if(st.intentos)estadoTxt='🔄 Para seguir practicando';
    else estadoTxt='⬜ Sin ver';
    if((st.fallos>0&&!st.reforzado)||(!st.dominado&&!st.reforzado&&st.intentos>0))repasar.push(t.nombre);
    h+='<tr><td>'+esc(t.nombre)+'</td><td>'+st.intentos+'</td><td>'+st.pistas+'</td><td>'+estadoTxt+'</td></tr>';
  });
  h+='</table>';
  if(repasar.length)h+='<p style="margin-top:12px"><b>Qué conviene repasar:</b> '+repasar.map(esc).join(', ')+'.</p>';
  else h+='<p style="margin-top:12px"><b>Todos los temas quedaron dominados.</b> 🎉</p>';
  h+='</div>';
  var escritos=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
  if(escritos.length){
    h+='<div class="carta"><h2>✍️ Lo que escribió con sus palabras</h2>';
    escritos.forEach(function(t){h+='<p><b>'+esc(t.nombre)+':</b> «'+esc(estado.temas[t.id].resumen)+'»</p>';});
    h+='</div>';
  }
  h+='<div class="carta"><p class="suave">El progreso queda guardado en este dispositivo: al abrir de nuevo la práctica se puede continuar. "Empezar de cero" borra todo el avance.</p>';
  h+='<button class="btn-sec" style="width:100%" id="btn-reiniciar">🔄 Empezar de cero</button></div>';
  el('app').innerHTML=h;
  el('btn-reiniciar').addEventListener('click',function(){
    mostrarOverlay('🔄 Empezar de cero','<p>Se borrará todo el avance guardado y la práctica comenzará desde el principio. ¿Continuar?</p>','Sí, empezar de cero',function(){borrarProgreso();location.reload();});
  });
}

pintarInicio();
</script>

</html>
