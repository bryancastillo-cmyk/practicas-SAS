name: Desplegar worker de estadísticas

# Se corre a mano desde la pestaña Actions (Run workflow) una vez que existen los secrets de
# Cloudflare. No se dispara solo al hacer push, para no fallar mientras no estén configurados.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Falta el secret CLOUDFLARE_API_TOKEN (ver worker/README.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Falta el secret CLOUDFLARE_ACCOUNT_ID (ver worker/README.md)"; exit 1; }
          [ -n "${{ secrets.ESTADISTICAS_CLAVE }}" ] || { echo "Falta el secret ESTADISTICAS_CLAVE (ver worker/README.md)"; exit 1; }

      - name: Base D1 (crear si no existe)
        working-directory: worker
        run: |
          set +e
          LISTA=$(npx --yes wrangler@4 d1 list --json 2>&1)
          CODIGO=$?
          set -e
          if [ $CODIGO -ne 0 ] || echo "$LISTA" | grep -q "Authentication error"; then
            echo "::error::El token de Cloudflare no tiene permiso sobre D1. En Cloudflare: My Profile → API Tokens → Edit del token → Add more → Account / D1 / Edit → Save. Luego vuelva a correr este workflow."
            echo "$LISTA" | tail -5
            exit 1
          fi
          ID=$(echo "$LISTA" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let l=[];try{l=JSON.parse(s)}catch(e){};const d=l.find(x=>x.name==='practicas-sas');process.stdout.write(d?d.uuid:'')})")
          if [ -z "$ID" ]; then
            echo "Creando la base D1 practicas-sas"
            SALIDA=$(npx --yes wrangler@4 d1 create practicas-sas)
            echo "$SALIDA"
            ID=$(echo "$SALIDA" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          [ -n "$ID" ] || { echo "No se pudo obtener el id de la base D1"; exit 1; }
          echo "DATABASE_ID=$ID" >> "$GITHUB_ENV"

      - name: Generar wrangler.toml
        working-directory: worker
        run: |
          SITIO="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/"
          sed -e "s#__DATABASE_ID__#${DATABASE_ID}#" -e "s#__SITIO_URL__#${SITIO}#" wrangler.toml.plantilla > wrangler.toml
          cat wrangler.toml

      - name: Subdominio workers.dev (registrar si la cuenta no tiene)
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          ACTUAL=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);process.stdout.write((r.result&&r.result.subdomain)||'')}catch(e){}})")
          if [ -n "$ACTUAL" ]; then echo "La cuenta ya tiene el subdominio $ACTUAL.workers.dev"; exit 0; fi
          for NOMBRE in "practicas-sas" "practicas-sas-cr" "practicas-sas-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-6)"; do
            RESP=$(curl -s -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "$API" --data "{\"subdomain\":\"$NOMBRE\"}")
            if echo "$RESP" | grep -q '"success":true'; then echo "Subdominio registrado: $NOMBRE.workers.dev"; exit 0; fi
            echo "No se pudo registrar $NOMBRE: $RESP"
          done
          echo "::error::No se pudo registrar un subdominio workers.dev. Hágalo a mano: Cloudflare → Compute → Workers & Pages → Overview → 'Set up a subdomain', y vuelva a correr."
          exit 1

      - name: Desplegar
        working-directory: worker
        run: |
          npx --yes wrangler@4 deploy | tee despliegue.log
          echo "${{ secrets.ESTADISTICAS_CLAVE }}" | npx --yes wrangler@4 secret put ADMIN_CLAVE
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' despliegue.log | head -1)
          [ -n "$URL" ] || { echo "No se encontró la URL del worker en la salida"; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          echo "Worker publicado en $URL"

      - name: Escribir la URL en docs/config.json
        run: |
          node -e "
            const fs=require('fs');const p='docs/config.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.telemetria=Object.assign({},c.telemetria,{url:process.env.WORKER_URL+'/evento',resumen:process.env.WORKER_URL+'/resumen',eventos:process.env.WORKER_URL+'/eventos'});
            fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');"
          git config user.name "practicas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/config.json
          git commit -m "Estadísticas: URL del worker en config.json" || echo "Sin cambios"
          git push
