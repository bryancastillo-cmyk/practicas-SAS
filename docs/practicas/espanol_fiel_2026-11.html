:root{
  --cielo1:#1B1464;--cielo2:#4A1E9E;--carta:#FFFFFF;--tinta:#2D2A5E;--tintaSuave:#6B6899;
  --sol:#FFB703;--solOscuro:#D89400;--menta:#06D6A0;--mentaOscuro:#04A87E;
  --nube:#FFD166;--nubeOscuro:#E0B04A;--cielitoBtn:#8ECAE6;--cielitoOscuro:#5FA8CC;
  --lila:#9B5DE5;--moradoTitulo:#3A1D8A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Andika','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  color:var(--tinta);min-height:100vh;overflow-x:hidden;
  font-size:17px;line-height:1.6;letter-spacing:.01em;
  background:linear-gradient(160deg,var(--cielo1) 0%,var(--cielo2) 55%,#7B2FBE 100%);
  background-attachment:fixed}
.estrella{position:fixed;color:#FFF;pointer-events:none;z-index:0;animation:titilar 3s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.contenedor{max-width:640px;margin:0 auto;padding:14px;position:relative;z-index:1}
.carta{background:var(--carta);border-radius:22px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(20,10,60,.35);animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{font-size:1.55rem;margin:.2em 0;color:var(--moradoTitulo);letter-spacing:.3px}
h2{font-size:1.15rem;color:var(--moradoTitulo);margin:.3em 0 .5em}
.suave{color:var(--tintaSuave);font-size:.92rem}
button{font-family:inherit;font-size:1.02rem;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;font-weight:700}
button:active{transform:translateY(4px)}
.btn-principal{background:var(--sol);color:#4A2500;width:100%;font-size:1.12rem;font-weight:800;
  box-shadow:0 5px 0 var(--solOscuro)}
.btn-principal:active{box-shadow:0 1px 0 var(--solOscuro)}
.btn-sec{background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 4px 0 var(--cielitoOscuro)}
.btn-sec:active{box-shadow:0 1px 0 var(--cielitoOscuro)}
.btn-opcion{display:block;width:100%;text-align:left;background:#F5F3FF;color:var(--tinta);
  margin:9px 0;border:3px solid #E4DEFF;font-weight:600;box-shadow:0 3px 0 #E4DEFF}
.btn-opcion:hover{border-color:var(--lila);transform:translateY(-2px)}
.btn-opcion:active{transform:translateY(2px)}
.ficha{display:inline-block;background:#FFF4D6;border:3px solid var(--sol);color:#7A4E00;font-weight:800;
  margin:4px;padding:11px 15px;border-radius:14px;box-shadow:0 3px 0 var(--solOscuro)}
.ficha:active{transform:translateY(3px);box-shadow:none}
.zona-construccion{min-height:56px;background:#F5F3FF;border:3px dashed #C9BEF5;border-radius:16px;padding:8px;margin:10px 0}
.ruta-planetas{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.14);border-radius:99px;padding:8px 12px;margin-bottom:10px}
.planeta{font-size:1.45rem;filter:grayscale(1) opacity(.45);transition:filter .4s,transform .4s}
.planeta.dominado{filter:none;transform:scale(1.18);text-shadow:0 0 14px #FFD166}
.cohete{font-size:1.5rem;animation:flotar 2.6s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:rgba(255,255,255,.18);color:#FFF;border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:700}
.btn-icono{background:rgba(255,255,255,.18);color:#FFF;padding:6px 12px;border-radius:99px;box-shadow:none;font-size:.95rem}
.mascota{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mascota .emoji-mascota{font-size:2.5rem;animation:flotar 3s ease-in-out infinite}
.burbuja{background:#FFF;border-radius:18px;border-bottom-left-radius:4px;padding:12px 15px;flex:1;
  box-shadow:0 5px 16px rgba(20,10,60,.3);font-size:.98rem}
.fila-orden{display:flex;align-items:center;gap:8px;background:#F5F3FF;border:3px solid #E4DEFF;border-radius:14px;padding:9px 11px;margin:7px 0}
.fila-orden span{flex:1;font-weight:600}
.fila-orden button{padding:7px 12px;background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 3px 0 var(--cielitoOscuro)}
select{font-family:inherit;font-size:.95rem;padding:9px;border-radius:12px;border:3px solid #E4DEFF;background:#fff;max-width:100%;font-weight:600;color:var(--tinta)}
.fila-sel{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.fila-sel b{flex:1;min-width:120px}
.feedback{border-radius:16px;padding:15px;margin-top:12px;font-weight:800;font-size:1.05rem;text-align:center}
.fb-bien{background:#D9FBEF;color:#046B52;border:3px solid var(--menta);animation:rebotar .5s ease}
@keyframes rebotar{0%{transform:scale(.9)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.fb-nube{background:#FFF4D6;color:#7A5300;border:3px solid var(--nube);animation:mecer .6s ease}
@keyframes mecer{0%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{transform:none}}
.overlay{position:fixed;inset:0;background:rgba(20,10,60,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .carta{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.oculto{display:none!important}
.orden-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--sol);color:#4A2500;
  align-items:center;justify-content:center;font-weight:800;margin-right:8px;font-size:.9rem}
table.informe{width:100%;border-collapse:collapse;font-size:.9rem}
table.informe th,table.informe td{border-bottom:1px solid #E4DEFF;padding:8px 6px;text-align:left}
.modo-adulto{font-family:system-ui,'Segoe UI',Arial,sans-serif}
.explicacion{background:#F5F3FF;border-left:5px solid var(--lila);padding:13px 15px;border-radius:10px;margin:12px 0;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch}
.progreso{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:8px 0}
.progreso div{height:100%;background:linear-gradient(90deg,var(--menta),var(--sol));width:0%;transition:width .5s}
.progreso.mision div{background:#FF8A3D}
.confianza{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.confianza .suave{margin-right:4px}
.chip-conf{background:#F1EADF;color:#5F574E;border:2px solid transparent;border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:800;box-shadow:none}
.chip-conf.sel{background:#E6F3F2;color:#0A5C59;border-color:#0E7C78}
.cierre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.cierre-celda{background:#FFF8EE;border-radius:16px;padding:12px;text-align:center}
.cierre-celda .num{display:block;font-size:1.7rem;font-weight:900;line-height:1;color:#241F1A}
.cierre-celda .sub{display:block;font-size:.8rem;color:#5F574E;font-weight:700;margin-top:4px}
.cierre-tema{display:flex;justify-content:space-between;gap:8px;background:#F7F4EE;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.92rem;color:#241F1A}
.cierre-tema.sube{background:#DCFCE7}.cierre-tema.pend{background:#FDE7C8}
.chips-proxima{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chips-proxima button{background:#fff;color:#0A5C59;border:2px solid #0E7C78;border-radius:99px;padding:9px 14px;font-size:.9rem;box-shadow:none}
.chips-proxima button.sel{background:#FF8A3D;color:#241F1A;border-color:#FF8A3D}
.btn-accion{background:#FF8A3D;color:#241F1A;width:100%;font-size:1.12rem;font-weight:900;box-shadow:0 4px 0 #D9641A}
.btn-accion:active{box-shadow:0 1px 0 #D9641A}
.contador-pausa{font-size:2.6rem;font-weight:900;text-align:center;color:#0A5C59;margin:6px 0}
.tarjeta-repaso{margin:10px 0;cursor:pointer;transition:transform .2s}
.tarjeta-repaso.girando{transform:rotateY(90deg)}
.tarjeta-repaso .cara-frente{background:linear-gradient(135deg,var(--lila),#7B2FBE);color:#fff;font-weight:800;padding:17px;text-align:center;border-radius:16px;box-shadow:0 4px 0 #5B1E96}
.tarjeta-repaso .cara-dorso{background:#F5F3FF;border:3px solid var(--lila);border-radius:16px;padding:15px;font-size:1rem;line-height:1.7;letter-spacing:.015em}
.tarjeta-repaso.vista{cursor:default}
button:disabled{opacity:.45;cursor:not-allowed}
.respuesta-escrita{width:100%;font-family:inherit;font-size:1.1rem;padding:13px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;margin:8px 0;font-weight:700;color:var(--tinta)}
.respuesta-escrita:focus{outline:none;border-color:var(--sol)}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:11px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;color:var(--tinta)}
textarea:focus{outline:none;border-color:var(--sol)}
.esquema{background:#F5F3FF;border-radius:16px;padding:12px}
.nodo-centro{background:linear-gradient(135deg,var(--moradoTitulo),var(--lila));color:#fff;font-weight:800;text-align:center;border-radius:99px;padding:11px 16px;margin-bottom:10px;box-shadow:0 4px 0 #2A1266}
.ramas{display:grid;grid-template-columns:1fr;gap:12px}
.rama{border-left:6px solid var(--lila);background:#fff;border-radius:0 14px 14px 0;padding:13px 16px;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch;box-shadow:0 2px 8px rgba(20,10,60,.08)}
.rama b{color:var(--moradoTitulo);display:block;margin-bottom:6px}
.rama-estrella{border-left-color:var(--sol);background:#FFF9E8}
.toast-insignia{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFF4D6,#FFE39A);border:3px solid var(--sol);color:#7A4E00;font-weight:800;border-radius:99px;padding:11px 19px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastIn .35s ease}
.toast-puntos{position:fixed;top:14px;right:14px;background:#FFC43D;color:#7A4B00;font-weight:900;font-size:15px;padding:8px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:60;animation:toastPuntos 1.5s ease forwards}
@keyframes toastPuntos{0%{opacity:0;transform:translateY(-10px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.confeti{position:fixed;top:-14px;width:10px;height:14px;z-index:55;border-radius:3px;animation:caerConfeti linear forwards}
@keyframes caerConfeti{to{transform:translateY(105vh) rotate(540deg)}}
.pulso{animation:pulsar 1.6s ease-in-out infinite}
@keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

var DATOS = {"titulo":"Práctica de examen — Español 4° (versión fiel) · Prueba semestral 16 de noviembre","materia":"Español","sal":"5bed5d32f82713bdc139fb21","creditosNecesarios":2,"fiel":true,"voz":true,"temas":[{"id":"gue-gui","nombre":"1. Las combinaciones gue, gui, güe y güi (libro pp. 174-175)","explicacion":"<b>Combinaciones gue, gui, güe y güi.</b> <b>Instrucción.</b> Complete las palabras que se le muestran utilizando las combinaciones gue, gui, güe y güi.<br><i>(En la web: elija la combinación que va en el espacio. Fíjese bien si lleva diéresis ¨ o no.)</i>","microleccion":"<b>Recuerde (libro, p. 174):</b> La letra g tiene un sonido suave en las combinaciones gue, gui, güe y güi. En las combinaciones <b>gue</b> y <b>gui</b>, la letra u no se pronuncia. En las combinaciones <b>güe</b> y <b>güi</b>, la letra u sí se pronuncia; esto se indica con la diéresis (¨).<br><br><b>Ejemplo con otras palabras:</b><br>1) man___ra → digo la palabra en voz alta: «man-gue-ra». ¿Suena la u? No → va <b>gue</b>: manguera.<br>2) ___sante → «gui-san-te». ¿Suena la u? No → va <b>gui</b>: guisante.<br>3) ci___ña → «ci-güe-ña». ¿Suena la u? Sí → va <b>güe</b>: cigüeña.<br>4) pin___no → «pin-güi-no». ¿Suena la u? Sí → va <b>güi</b>: pingüino.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"gg-1","formato":"mc","pregunta":"ju_____te","pista":"Es un objeto para jugar. Dígala en voz alta: ¿suena la u?","hashes":["0ef226d3c8b8a351816c901fd620c340a4cc12df27fc5c71b5c6ef4148badb18"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-2","formato":"mc","pregunta":"_____ar","pista":"Es lo que hace un guía: mostrar el camino.","hashes":["12784d22eece6ea5e27ec91fd0ddaf8effd562465efa6a8b7fa246c000c2d769"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-3","formato":"mc","pregunta":"desa_____","pista":"Es por donde se va el agua del fregadero. Dígala despacio: ¿se oye la u?","hashes":["01e25d32dce4d7286803e4f1508288cfdcba796fadabcb2e2abf2fa103b907f0"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-4","formato":"mc","pregunta":"plie_____","pista":"Es el doblez de una tela o de un papel. ¿Suena la u?","hashes":["f6b1ade3d428ccde47fb6d9237e042e40c0d39c6055a55779e055991d4797714"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-5","formato":"mc","pregunta":"_____rra","pista":"Lo contrario de la paz.","hashes":["e7dc671449aa837ba2dfade38cfa2e56421008839e0c9a9740ff863b75bc888b"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-6","formato":"mc","pregunta":"ju____tería","pista":"Es la tienda donde venden juguetes.","hashes":["d8d85eab4d2893bf78deff18c1420c2f828ce090a61290835f6d29808151f98a"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-7","formato":"mc","pregunta":"para____ro","pista":"Es el lugar donde se guardan los paraguas. ¿Se oye la u?","hashes":["e38191954f64bb8648da38530b9b79ff4c0e7cfd4db4ab5fd92f90e3cf688576"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-8","formato":"mc","pregunta":"_____so","pista":"Es una comida preparada en olla, como el de papas.","hashes":["4d2d83fef27ef02d70ba2b2c16223078614a907b21c92242252640a7fc5b58f3"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-9","formato":"mc","pregunta":"Á____la","pista":"Es un ave grande que vuela muy alto.","hashes":["389b7d3a9e4758cbe01b489cf8dbdba7341ee7ab7ef5ecb53e176beb81d2becd"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-10","formato":"mc","pregunta":"bilin_____","pista":"Se dice de quien habla dos idiomas. Dígala despacio: ¿se oye la u?","hashes":["5f83400234ed4b991dd2a6b7bd9dd3f1d1b73be6b1ec68e97caa53f80e9961a5"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-11","formato":"mc","pregunta":"espa____ti","pista":"Es una pasta larga y delgada.","hashes":["b512727e0b8676bb562f085f768cb21d89b0df466e19ded7b8455bdfd9e944de"],"opciones":["A) gue","B) gui","C) güe","D) güi"]},{"id":"gg-12","formato":"mc","pregunta":"_____on","pista":"Es el texto que siguen los actores de una obra o una película.","hashes":["8d16c621a5b949cbc5fc655cc0b422859c440af759272340b51d1e953e2906ad"],"opciones":["A) gue","B) gui","C) güe","D) güi"]}]},{"id":"senales","nombre":"2. Las señales de tránsito (libro pp. 200-201)","explicacion":"<b>Las señales de tránsito.</b> <b>Instrucción.</b> Complete la información que se le solicita. Siga el primero como ejemplo:<br><br><b>Señal ALTO</b><br>Tipo de señal: reglamentaria.<br>Lenguaje verbal: palabra “ALTO”.<br>Lenguaje icónico: Figura geométrica octagonal (de ocho lados) de color rojo con un borde blanco.<br>Significado: Indica que los conductores deben detener completamente el vehículo antes de continuar su recorrido.<br><br><i>(En la web: como no se ven las imágenes de la hoja, cada señal viene descrita en un recuadro, y usted elige la respuesta correcta para cada línea. Cuando el profesor ya dio el significado, no se pregunta.)</i>","microleccion":"<b>Recuerde (libro, p. 200):</b> Las señales incluyen lenguaje verbal (letras, palabras y números) y lenguaje no verbal o icónico (dibujos, colores y formas). <b>Señales de reglamentación</b>: informan sobre las reglas específicas para circular en una sección de la vía pública. Están hechas con los colores blanco, negro y rojo. <b>Señales de prevención</b>: alertan sobre la presencia en la vía de elementos de riesgo; entre otros, animales, curvas peligrosas de la carretera y derrumbes. Están hechas con los colores amarillo y negro.<br><br><b>Ejemplo con otra señal:</b> rombo amarillo con borde negro y el dibujo de una vaca, sin palabras.<br>1) Colores amarillo y negro → <b>prevención</b>.<br>2) ¿Tiene letras, palabras o números? No → <b>no tiene lenguaje verbal</b>.<br>3) Lenguaje icónico: rombo amarillo con borde negro y el dibujo de una vaca.<br>4) Significado: cuidado, puede haber ganado en la vía.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"se-2a","formato":"mc","pregunta":"Señal 2. Tipo de señal:","pista":"Mire los colores: ¿blanco, negro y rojo, o amarillo y negro?","hashes":["8a6fe217ebc03bb4844a35a8634e3a643c892fd4e773e26a904c653992db7b86"],"contexto":"<b>Señal 2:</b> rectángulo blanco con borde negro. Arriba, un círculo rojo con el número «10» y la palabra «TONS». Abajo dice «PESO MÁXIMO POR VEHÍCULO».","opciones":["A) Reglamentaria","B) Prevención","C) Ninguna de las dos"]},{"id":"se-2b","formato":"mc","pregunta":"Señal 2. Lenguaje verbal:","pista":"El lenguaje verbal son letras, palabras y números.","hashes":["bdfea698929fa2a6f5739153c76550fa51c63a8103d3c5cf5ff81b027c6b2bfc"],"contexto":"<b>Señal 2:</b> rectángulo blanco con borde negro. Arriba, un círculo rojo con el número «10» y la palabra «TONS». Abajo dice «PESO MÁXIMO POR VEHÍCULO».","opciones":["A) El número «10» y las palabras «TONS» y «PESO MÁXIMO POR VEHÍCULO»","B) No tiene lenguaje verbal","C) El círculo rojo"]},{"id":"se-2c","formato":"mc","pregunta":"Señal 2. Lenguaje icónico:","pista":"El lenguaje icónico son los dibujos, colores y formas, no las palabras.","hashes":["8442bff4ec7f33047d0b73f4cec45dbbc0e252fb5a0852b93c046f9ca49214fd"],"contexto":"<b>Señal 2:</b> rectángulo blanco con borde negro. Arriba, un círculo rojo con el número «10» y la palabra «TONS». Abajo dice «PESO MÁXIMO POR VEHÍCULO».","opciones":["A) Las palabras «PESO MÁXIMO»","B) Rectángulo blanco con borde negro y un círculo rojo","C) Rombo amarillo con borde negro"]},{"id":"se-2d","formato":"mc","pregunta":"Señal 2. Significado:","pista":"Lea con atención: «TONS» es de toneladas, y dice «peso máximo».","hashes":["b03bc7d6e822665d280dfe3e7f827f70e2cf34f089f69be5960b2112aa5cfd9a"],"contexto":"<b>Señal 2:</b> rectángulo blanco con borde negro. Arriba, un círculo rojo con el número «10» y la palabra «TONS». Abajo dice «PESO MÁXIMO POR VEHÍCULO».","opciones":["A) Los vehículos deben ir a 10 kilómetros por hora como máximo","B) No pueden pasar vehículos que pesen más de 10 toneladas","C) Cuidado: hay un puente en re verbal:","pista":"La X de esta señal representa el cruce, como un dibujo. ¿Hay alguna palabra o número escrito?","hashes":["be40b5f00ad482bb41248e8c32c675bda8c848437eb8903700fb39c4d8f8d514"],"contexto":"<b>Señal 6:</b> rombo amarillo con una X negra grande y, encima, el dibujo de una vía de tren. No tiene palabras ni números. Significado (lo da el profesor): proximidad al cruce ferroviario (ferrocarril).","opciones":["A) No tiene lenguaje verbal (la X es un dibujo, no una palabra)","B) La letra «X»","C) La palabra «TREN»"]},{"id":"se-6c","formato":"mc","pregunta":"Señal 6. Lenguaje icónico:","pista":"Describa la forma, el color y el dibujo de ESTA señal.","hashes":["0a28832f0ccdc2ceed030b586ba636d12fc5098f9e9b0c2c7457f82c422910fe"],"contexto":"<b>Señal 6:</b> rombo amarillo con una X negra grande y, encima, el dibujo de una vía de tren. No tiene palabras ni números. Significado (lo da el profesor): proximidad al cruce ferroviario (ferrocarril).","opciones":["A) Octágono rojo con borde blanco","B) Rombo amarillo con borde negro y un peatón","C) Rombo amarillo con una X negra y el dibujo de una vía de tren"]},{"id":"se-7a","formato":"mc","pregunta":"Señal 7. Tipo de señal:","pista":"Mire los colores: ¿blanco, negro y rojo, o amarillo y negro?","hashes":["1da7eb485f0f5b3062c2549d22fa111ff2829efdff1d187858b8fbfb722db353"],"contexto":"<b>Señal 7:</b> rectángulo blanco. Dentro, una letra «E» negra dentro de un círculo rojo con una línea roja diagonal que la tacha. Abajo dice «PROHIBIDO ESTACIONAR».","opciones":["A) Reglamentaria","B) Prevención","C) Ninguna de las dos"]},{"id":"se-7b","formato":"mc","pregunta":"Señal 7. Lenguaje verbal:","pista":"El lenguaje verbal son letras, palabras y números.","hashes":["82a2d41d647f8e610b85e6a0df08a675bb041bcf6f9375c574dbe0e5d648de85"],"contexto":"<b>Señal 7:</b> rectángulo blanco. Dentro, una letra «E» negra dentro de un círculo rojo con una línea roja diagonal que la tacha. Abajo dice «PROHIBIDO ESTACIONAR».","opciones":["A) El círculo rojo con la línea diagonal","B) La letra «E» y las palabras «PROHIBIDO ESTACIONAR»","C) No tiene lenguaje verbal"]},{"id":"se-7c","formato":"mc","pregunta":"Señal 7. Lenguaje icónico:","pista":"El lenguaje icónico son los dibujos, colores y formas, no las letras.","hashes":["f05588cacf6345964b975d021d0b7b50097da3ea3f84062f980097a09a144517"],"contexto":"<b>Señal 7:</b> rectángulo blanco. Dentro, una letra «E» negra dentro de un círculo rojo con una línea roja diagonal que la tacha. Abajo dice «PROHIBIDO ESTACIONAR».","opciones":["A) El círculo y la diagonal rojos, que significan «prohibido»","B) La letra «E» de «estacionar»","C) Rombo amarillo con borde negro"]},{"id":"se-7d","formato":"mc","pregunta":"Señal 7. Significado:","pista":"La «E» es de «estacionar», y el círculo rojo tachado significa «prohibido».","hashes":["89cb69dabbdbd3e5c002a438a7918ae897959bd903568288922d313a68e7c063"],"contexto":"<b>Señal 7:</b> rectángulo blanco. Dentro, una letra «E» negra dentro de un círculo rojo con una línea roja diagonal que la tacha. Abajo dice «PROHIBIDO ESTACIONAR».","opciones":["A) Hay un estacionamiento cerca","B) Cuidado: escuela cercana","C) Se prohíbe dejar los vehículos estacionados en ese lugar"]}]},{"id":"linguisticos","nombre":"3. Elementos lingüísticos (libro pp. 202-203)","explicacion":"<b>Elementos lingüísticos.</b> <b>Instrucción.</b> Para cada caso, escribe si el error se presenta en precisión, en las muletillas o en gramática y ortografía.<br><i>(En la web: elija el tipo de error.)</i>","microleccion":"<b>Recuerde (libro, p. 202):</b> <b>Precisión.</b> Consiste en no emplear vocablos carentes de significado o de significado muy general, como «cosa», «algo», «hacer» o palabras mal pronunciadas, como «agüelo» en vez de «abuelo». <b>Gramática y ortografía.</b> Se refiere a escribir oraciones bien formadas, siguiendo las normas de la ortografía, la gramática y la puntuación, y con coherencia y cohesión. <b>Evitar las muletillas.</b> Consiste en usar las palabras exactas para la idea que se desea transmitir y evitar la repetición de expresiones llamadas muletillas, como «este», «o sea», «entonces», «eh»…<br><br><b>Ejemplos con otros casos:</b><br>• Carlos escribió «Las niña juega en el parque». → No concuerda (las/niña, juega) → <b>gramática y ortografía</b>.<br>• Ana dijo «Me compré algo para la lluvia» en vez de «un paraguas». → Palabra muy general → <b>precisión</b>.<br>• Luis decía «o sea» en cada oración. → Expresión repetida → <b>muletillas</b>.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"li-1","formato":"mc","pregunta":"1. En el cartel de la feria científica se leía: “Los experimento se realizará el viernes”.","pista":"¿«Los» y «experimento» concuerdan? ¿Y «se realizará»?","hashes":["e51a4c621d5f60590cd635b9283be8777b80121389bc4e772218eae3de1a1169"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-2","formato":"mc","pregunta":"2. Durante la exposición sobre los volcanes, Mateo utilizó muchas veces la palabra “cosa” para referirse a elementos específicos que no lograba nombrar con exactitud.","pista":"«Cosa» es una palabra de significado muy general. ¿Qué dice el libro de esas palabras?","hashes":["520ebfaedff675b739f408859ad8edbff8b042e9ab3788793e999ce8d3fe1c48"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-3","formato":"mc","pregunta":"3. Cuando Sofía explicó las reglas del juego, repetía “este…” al inicio de casi todas sus oraciones.","pista":"Es una expresión que se repite una y otra vez sin necesidad.","hashes":["48261ab497437288b77f2f7b3ed74800a7ccc6e3435c53db3c94a352e1671fbd"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-4","formato":"mc","pregunta":"4. Al contar lo que había sucedido, Andrés dijo que su equipo “ganó por mucho”, pero no explicó cuál fue la diferencia de puntos.","pista":"«Por mucho» no dice exactamente cuántos puntos. ¿Le faltó exactitud?","hashes":["fc9a32e8a43e859bf7154fba74b1d5527e6906d673c495c458715a3558291835"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-5","formato":"mc","pregunta":"5. En el mensaje del grupo, Lucía escribió: “Haci no se debe cuidar el agua”. En lugar de escribir: “Así se debe cuidar el agua”.","pista":"Fíjese en cómo escribió «así».","hashes":["50c3c80343fc97fec5872759a83ed1dced83237d282db716737994a7c2998553"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-6","formato":"mc","pregunta":"6. Pedro explicó su proyecto diciendo: \"Primero hay que hacer esto y luego poner la cosa en su lugar\".","pista":"«Hacer esto», «la cosa»: ¿son palabras exactas?","hashes":["a24da85f060c3b2b699c907260ca08a3eb851c8059e68f5375ae4541919f732d"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-7","formato":"mc","pregunta":"7. En vez de decir “mamífero”, una estudiante utilizó la palabra “animal” para nombrar a la ballena, sin precisar a qué grupo pertenece.","pista":"Usó una palabra muy general en lugar de la exacta.","hashes":["fb756b744b3f94910833026bc3a2279ae43f6db60a691edc34ecd8694a7028ff"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-8","formato":"mc","pregunta":"8. En el rótulo de una verdulería pusieron: \"Se venden tomate fresco y bananos maduros\".","pista":"¿«Tomate fresco» está en singular o en plural? ¿Concuerda con «se venden»?","hashes":["178733adc56712ea86add9e8cdd5e81b6f45447c3296aac3a8d43d6a09a9152e"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-9","formato":"mc","pregunta":"9. En la tarea de estudios sociales, Jimena escribió: \"La bandera tricolor flamea en alto\", olvidando el punto final.","pista":"El punto es un signo de puntuación.","hashes":["47271519c6f595385857a0ca18208fb90d298da5b251b68a7c29fd0ae301cb20"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]},{"id":"li-10","formato":"mc","pregunta":"10. En lugar de decir \"la inauguración de la tienda\", el anunciador decía \"la inauguración de la cosa\".","pista":"Cambió una palabra exacta por una muy general.","hashes":["e95f0260c73799d7271a4f95a2bfa864f5faf8e66e3042d401ab7ff09b33c5c5"],"opciones":["Precisión","Muletillas","Gramática y ortografía"]}]},{"id":"paralinguisticos","nombre":"4. Elementos paralingüísticos (libro pp. 204-205)","explicacion":"<b>Elementos paralingüísticos.</b> <b>Instrucción.</b> Para cada caso, escribe si la situación hace referencia al timbre, volumen, velocidad y ritmo, dicción, entonación, pausas y gestualidad.<br><i>(En la web: elija el elemento al que se refiere la situación.)</i>","microleccion":"<b>Recuerde (libro, p. 204):</b> <b>Timbre.</b> Es la voz característica de cada persona. <b>Volumen.</b> Consiste en la intensidad adecuada de la voz, de manera que todos los participantes puedan oír y entender el mensaje. <b>Velocidad y ritmo.</b> Es la rapidez o la lentitud con que se pronuncian ciertas palabras en el momento de hacer uso de la palabra. <b>Dicción.</b> Es la pronunciación clara de las palabras, de modo que unas no se confundan con otras. <b>Entonación.</b> Consiste en la melodía, el tono y la fuerza que se usa para dar sentido a lo dicho; por ejemplo, enojo, alegría, tristeza, duda o sorpresa. <b>Pausas.</b> Expresan duda o suspenso acerca de lo que se manifiesta. <b>Gestualidad.</b> Son los gestos y los movimientos corporales que refuerzan el mensaje por comunicar.<br><br><b>Ejemplos con otras situaciones:</b><br>• Raúl habló tan rápido en el acto cívico que nadie le siguió el hilo. → rapidez → <b>velocidad y ritmo</b>.<br>• Por teléfono, todos reconocen la voz aguda de la abuela Rosa. → la voz propia de una persona → <b>timbre</b>.<br>• Elena abrió los brazos para mostrar lo grande que era el árbol. → movimiento del cuerpo → <b>gestualidad</b>.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"pa-1","formato":"mc","pregunta":"1. Al exponer, Alejandro vocalizaba de manera tan deficiente que unía las palabras y no se entendía el objetivo.","pista":"Se trata de pronunciar claro para que las palabras no se confundan.","hashes":["fe754bbd70fe363c94fdc7ce627bf3cf58dc735fb037506a90768f1a770a889b"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-2","formato":"mc","pregunta":"2. Antes de revelar el resultado del experimento, la docente guardó unos segundos de silencio para generar expectativa.","pista":"Unos segundos de silencio para crear suspenso.","hashes":["47983e77d5b4fa5ce67d4657828ac6835ea3b020e54c710010467028add06a75"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-3","formato":"mc","pregunta":"3. Durante la lectura dramática, el estudiante bajó el ritmo de su voz y realizó pausas largas para expresar la tristeza del personaje.","pista":"Habló más lento: ¿qué elemento tiene que ver con la rapidez o la lentitud?","hashes":["781fc5c996b8df1e001609b034b24fe5a11cca12ddf84587d82fa08738030881"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-4","formato":"mc","pregunta":"4. Al enterarse de que ganó el primer lugar en dibujo, la voz de Leonardo tembló ligeramente reflejando una mezcla de duda y sorpresa.","pista":"El tono de la voz mostró un sentimiento (duda y sorpresa).","hashes":["0a8b3e458cd3f59c29a6a9da30ab4e11ec359f3357eb0d9e45107254c2a0522c"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-5","formato":"mc","pregunta":"5. La voz de Gabriel es grave y profunda, por lo que se distingue fácilmente de las voces de sus compañeros.","pista":"Es la voz característica de cada persona.","hashes":["c10192a6043d28cb1e90dbd6ea7f7a26d38ffe6e5a09aed456656b8f7f967faa"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-6","formato":"mc","pregunta":"6. Durante la obra de teatro escolar, el narrador pronunció cada palabra con tanta claridad y precisión que ninguna se confundió con otra.","pista":"Pronunciación clara de las palabras.","hashes":["e0166f0d2d81738981c881ac2e7cc6bd394e875117fa85283909104687eabdb9"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-7","formato":"mc","pregunta":"7. Durante la exposición, Emilia habló tan bajo que las personas ubicadas al fondo del aula no lograron escuchar sus explicaciones.","pista":"Es la intensidad de la voz para que todos puedan oír.","hashes":["db252f337850abc7b71f56a26d12821332747c62a356c68e6899bcc7efbcf192"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-8","formato":"mc","pregunta":"8. Mientras explicaba cómo se formaban las montañas, Sofía señaló hacia arriba con las manos y representó sus formas con movimientos.","pista":"Usó las manos y el cuerpo para reforzar lo que decía.","hashes":["e24f347d6a29e00b42e48d0f4b1c5e4e8f9337d681024131de394f3911ffe671"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-9","formato":"mc","pregunta":"9. En la presentación de oratoria, Martina frunció el ceño y levantó las cejas para enfatizar la gravedad del problema ambiental.","pista":"Fruncir el ceño y levantar las cejas son gestos de la cara.","hashes":["6d600b9f16482c2fda6012b583983eee553ef1e0351eb9b1892ea80c0c860ca5"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-10","formato":"mc","pregunta":"10. María gesticulaba exageradamente con los hombros y las manos mientras explicaba el cuento clásico.","pista":"Movía los hombros y las manos.","hashes":["cd1081d60e08d8a7a0056dac2c0f5c3e866b530c8cb695f453cd2ace5846a9d9"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]},{"id":"pa-11","formato":"mc","pregunta":"11. Camila contó una historia de terror en la clase de literatura y, justo antes del desenlace, se detuvo unos segundos para generar suspenso.","pista":"Se detuvo unos segundos para crear suspenso.","hashes":["15682f9b0441a1b0406935a18a1694c98b2aacb6a62ef69ebd0d342795c10451"],"opciones":["Timbre","Volumen","Velocidad y ritmo","Dicción","Entonación","Pausas","Gestualidad"]}]},{"id":"romanos","nombre":"5. Números romanos del I al C (libro pp. 232-233)","explicacion":"<b>Números romanos.</b> <b>Instrucción.</b> A continuación, se le presentan varias cifras. Escriba en números romanos el valor equivalente en el espacio correspondiente.<br><br><i>A partir del ítem 11 viene la segunda instrucción de la hoja:</i> «A continuación, se le presentan dos cifras escritas en números comunes (arábigos) y en números romanos. Escriba a la derecha la palabra “correcta” si la representación es la adecuada o “incorrecta” si no lo es. Además, si es incorrecta, escriba la corrección en el espacio correspondiente.»<br><i>(En la web: «correcta» se responde con Sí y «incorrecta» con No. Cuando es incorrecta, el ítem siguiente le pide escribir la corrección.)</i>","microleccion":"<b>Recuerde (libro, p. 232):</b> Los números romanos del 1 al 100 se escriben por medio de cinco letras mayúsculas: I = 1, V = 5, X = 10, L = 50, C = 100.<br>• Si a la derecha de un número hay otro igual o menor que él, se suman (XV = 10 + 5 = 15).<br>• Si a la derecha de un número hay otro mayor que él, se resta el menor al mayor. Sin embargo, NO se deben restar los números V (5) y L (50). Además, el número I (1) solo se puede restar de V (5) y de X (10) (IV = 4, XL = 40).<br>• Los números I (1) y X (10) se pueden repetir hasta tres veces seguidas. Los otros números NO se repiten.<br><br><b>Ejemplo con otros números:</b><br>68 = 60 + 8 → 60 = LX, 8 = VIII → <b>LXVIII</b>.<br>84 = 80 + 4 → 80 = LXXX, 4 = IV → <b>LXXXIV</b>.<br>¿48 = XXXXVIII es correcto? No: la X se repetiría 4 veces. 40 = XL, 8 = VIII → <b>XLVIII</b>.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"ro-1","formato":"escribe","pregunta":"1. 76: ______________","pista":"Separe: 70 + 6. Empiece con L (50).","hashes":["68c4fd135e7f30e0f709228d90dfc54812066a5e934844e14d2261b2923e78b2"],"fz":{"f006d27be311748fab6e":"256f4e73fa","5300c16d8fab1db73216":"19d489c3a2","d36e3fef38fbdc14f894":"8d695c8e34","66bf9c5c6874683554b6":"55b7bea1c1","7a7c9b156384593bd575":"0c3d5083c5","019608e96a8c72f68401":"86d93c822f"}},{"id":"ro-2","formato":"escribe","pregunta":"2. 18: ______________","pista":"Separe: 10 + 8.","hashes":["995906211b987506abd71b2324aa25fbcf1489be4261cc9b28440072636d12c3"],"fz":{"917bddd8b89f5053130e":"f1e7a78553"}},{"id":"ro-3","formato":"escribe","pregunta":"3. 94: ______________","pista":"Separe: 90 + 4. El 90 es 10 antes de 100.","hashes":["344ec8879c31b11ae763476a53faab74d5e58c2b059f1330f9f1b0ad5081cfde"],"fz":{"3d73ed3092d42c4f81de":"3d957a72"}},{"id":"ro-4","formato":"escribe","pregunta":"4. 35: ______________","pista":"Separe: 30 + 5. La X se puede repetir hasta tres veces.","hashes":["05f50eabb02f4c42f5007d070a042d1f18ab69ac3e228ab74d47f591fa1bfe52"],"fz":{"e194713ed66cb2c8dfed":"9b48aae9","db50ddb8f9911a2b975d":"eda7d2ec","3b1fb18aee709c8ff7c0":"3f9cb2d6","b81819227e47ad25f1e0":"d4dabccf","8270fe97b3178b7f1179":"8b41a225","ec933c14f2be74a0a36f":"292261de","776cb54d4147967eeced":"6bccf324"}},{"id":"ro-5","formato":"escribe","pregunta":"5. 17: ______________","pista":"Separe: 10 + 7.","hashes":["e0803dc97f215df5964300cab629b71e84228c67a49a80887d7341f7fc3af646"],"fz":{"833ded7b57ae480dfa60":"f04b670c"}},{"id":"ro-6","formato":"escribe","pregunta":"6. 43: ______________","pista":"Separe: 40 + 3. El 40 es 10 antes de 50.","hashes":["b0235689e7451117cfd3143f9e80b4b6fc01894b90a9eae7f6fa5ba4d2726150"],"fz":{"e85ba694c2e0eebc58c6":"b4d0b64abf"}},{"id":"ro-7","formato":"escribe","pregunta":"7. 59: ______________","pista":"Separe: 50 + 9. El 9 es 1 antes de 10.","hashe /* ---------- sha256 puro en JS (sin depender de crypto.subtle) ---------- */
function sha256hex(ascii){
function rr(v,c){return(v>>>c)|(v<<(32-c));}
var mw=Math.pow,ms=mw(2,32),i,j,result='';
var words=[],al=ascii.length*8;
var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
var isC={};
for(var cand=2;pc<64;cand++){
if(!isC[cand]){for(i=0;i<313;i+=cand){isC[i]=cand;}
hash[pc]=(mw(cand,.5)*ms)|0;k[pc++]=(mw(cand,1/3)*ms)|0;}}
ascii+='\x80';
while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;
words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=(al/ms)|0;words[words.length]=al;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16),oh=hash.slice(0,8);
for(i=16;i<64;i++){var w15=w[i-15],w2=w[i-2];
w[i]=((rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))+w[i-16])|0;}
for(i=0;i<64;i++){
var a=hash[0],e=hash[4];
var t1=(hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+w[i])|0;
var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.length=8;}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b>>4).toString(16))+((b&15).toString(16));}
return result;}
function utf8(s){return unescape(encodeURIComponent(s));}
function sha(s){return sha256hex(utf8(s));}

/* ---------- utilidades ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function normArma(s){return norm(s).replace(/\s+/g,'');}
function skel(s){
  var t=norm(s).replace(/[^a-z]/g,'');if(!t)return '';
  t=t.replace(/ph/g,'f').replace(/ck/g,'k').replace(/qu/g,'k').replace(/q/g,'k')
    .replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/g(?=[ei])/g,'j')
    .replace(/x/g,'ks').replace(/z/g,'s').replace(/y/g,'i').replace(/w/g,'u')
    .replace(/v/g,'b').replace(/(.)ti(?=[aeiou])/g,'$1s').replace(/h/g,'');
  if(!t)return '';
  var r=t[0]+t.slice(1).replace(/[aeiou]/g,'');
  return r.replace(/(.)\1+/g,'$1');
}
function clavesCasi(sk){var a=[sk];if(sk.length>=4)for(var i=1;i<sk.length;i++){var d=sk.slice(0,i)+sk.slice(i+1);if(a.indexOf(d)<0)a.push(d);}return a;}
/* Devuelve la forma correcta si lo escrito se le parece mucho; null si no. */
function formaCercana(v,escrito){
  if(!v.fz)return null;
  var sk=skel(escrito);if(sk.length<3)return null;
  var cands=clavesCasi(sk);
  for(var i=0;i<cands.length;i++){
    var tag=sha(DATOS.sal+'|'+v.id+'|tag|'+cands[i]).slice(0,20);
    var c=v.fz[tag];if(!c)continue;
    var n=c.length/2,ks='';
    for(var j=0;ks.length<n*2;j++)ks+=sha(DATOS.sal+'|'+v.id+'|fz|'+cands[i]+'|'+j);
    var bytes='';
    for(var b=0;b<n;b++)bytes+=String.fromCharCode(parseInt(c.substr(b*2,2),16)^parseInt(ks.substr(b*2,2),16));
    var txt;try{txt=decodeURIComponent(escape(bytes));}catch(e){continue;}
    if(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+norm(txt)))<0)continue;
    /* largo parecido: evita aceptar otra palabra más corta (p. ej. «plant» por «pollutant») */
    var la=norm(escrito).replace(/[^a-z]/g,'').length,lb=norm(txt).replace(/[^a-z]/g,'').length;
    if(Math.min(la,lb)/Math.max(la,lb)<0.75)continue;
    return txt;
  }
  return null;
}

function mezclarVista(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

    }catch(e){}
  }
  function totales(){var g=cargar();return {puntos:g.puntos||0,hoy:dia(g)};}
  function confianza(nivel,ok){var g=cargar();g.confianza=g.confianza||{};var c=g.confianza[nivel]=g.confianza[nivel]||{ok:0,fallo:0};if(ok)c.ok++;else c.fallo++;guardar(g);}
  function racha(){
    var g=cargar();function clave(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
    function act(k){var d=g.dias[k];return !!(d&&((d.respondidas||0)>0||(d.misiones||0)>0));}
    var d=new Date(),n=0;if(!act(clave(d)))d.setDate(d.getDate()-1);
    for(var i=0;i<400;i++){if(act(clave(d))){n++;d.setDate(d.getDate()-1);}else break;}
    return n;
  }
  /* telemetría: el inicio guarda la URL del servidor en sas-telemetria; sin URL no se envía nada */
  var TELE=(function(){try{return localStorage.getItem('sas-telemetria')||'';}catch(e){return '';}})();
  var segPendientes=0;
  function enviar(tipo,datos){
    if(!TELE||!SESION||!SESION.alias)return;
    try{
      var cuerpo=JSON.stringify({alias:SESION.alias,tipo:tipo,practica:archivo,datos:datos||{},t:new Date().toISOString()});
      if(navigator.sendBeacon){navigator.sendBeacon(TELE,new Blob([cuerpo],{type:'text/plain'}));}
      else{fetch(TELE,{method:'POST',body:cuerpo,keepalive:true,mode:'no-cors'});}
    }catch(e){}
  }
  function enviarActivo(){if(segPendientes>0){enviar('activo',{segundos:segPendientes});segPendientes=0;}}
  setInterval(enviarActivo,60000);
  window.addEventListener('pagehide',enviarActivo);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState!=='visible')enviarActivo();});
  function guardarProxima(texto){try{var d=new Date();d.setDate(d.getDate()+1);var m=d.getMonth()+1,x=d.getDate();localStorage.setItem('sas-proxima',JSON.stringify({texto:texto,para:d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}));}catch(e){}}
  return {sincronizar:sincronizar,respuesta:respuesta,dominado:dominado,reforzado:reforzado,repasoFinal:repasoFinal,misionCompleta:misionCompleta,practicaCompleta:practicaCompleta,setActivo:setActivo,totales:totales,confianza:confianza,racha:racha,guardarProxima:guardarProxima,PUNTOS:PUNTOS};
})();

/* ---------- lectura en voz alta ---------- */
var vozElegida=null;
function elegirVoz(){
  try{
    var voces=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang);});
    if(!voces.length)return null;
    function puntos(v){
      var n=v.name.toLowerCase(),p=0;
      if(n.indexOf('natural')>=0)p+=6;
      if(n.indexOf('neural')>=0)p+=6;
      if(n.indexOf('online')>=0)p+=3;
      if(n.indexOf('google')>=0)p+=4;
      if(/m[oó]nica|paulina|dalia|sabina|luciana|camila|jorge/.test(n))p+=2;
      var l=v.lang.toLowerCase();
      if(l.indexOf('es-us')===0||l.indexOf('es-419')===0||l.indexOf('es-mx')===0||l.indexOf('es-cr')===0)p+=2;
      return p;
    }
    voces.sort(function(a,b){return puntos(b)-puntos(a);});
    return voces[0];
  }catch(e){return null;}
}
try{speechSynthesis.addEventListener('voiceschanged',function(){vozElegida=elegirVoz();});}catch(e){}
function leerEnVoz(texto){
  try{
    var limpio=String(texto).replace(/<[^>]*>/g,' ')
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,' ')
      .replace(/[\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u2716\u2714]/g,' ')
      .replace(/→/g,', entonces, ')
      .replace(/\s+/g,' ').trim();
    if(!limpio)return;
    if(!vozElegida)vozElegida=elegirVoz();
    speechSynthesis.cancel();
    var frases=limpio.match(/[^.!?…]+[.!?…]*/g)||[limpio];
    frases.forEach(function(f){
      f=f.trim();
      if(!f)return;
      var u=new SpeechSynthesisUtterance(f);
      u.lang=(vozElegida&&vozElegida.lang)||'es-US';
      if(vozElegida)u.voice=vozElegida;
      u.rate=0.98;
      u.pitch=1.05;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

function tono(secuencia){
  if(!sonidoOn)return;
  try{
    var ctx=tono.ctx=tono.ctx||new (window.AudioContext||window.webkitAudioContext)();
    var t=ctx.currentTime;
    secuencia.forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t+p[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t+p[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+p[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+p[1]);o.stop(t+p[1]+p[2]+0.05);
    });
  }catch(e){}
}

/* ---------- selección de variantes ---------- */
function elegirVariante(tema,evitarFormato){
  var st=estado.temas[tema.id];
  if(DATOS.fiel){
    var sig=null;
    for(var k=0;k<tema.variantes.length;k++){if(st.usadas.indexOf(tema.variantes[k].id)<0){sig=tema.variantes[k];break;}}
    if(!sig)sig=tema.variantes[tema.variantes.length-1];
    if(st.usadas.indexOf(sig.id)<0)st.usadas.push(sig.id);
    st.ultimoFormato=sig.formato;
    return sig;
  }
  var cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0 && v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0;});
  if(!cand.length){st.usadas=[];cand=tema.variantes.slice();}
  var v=cand[Math.floor(Math.random()*cand.length)];
  if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);
  st.ultimoFormato=v.formato;
  return v;
}

/* ---------- planificador ---------- */
function insertarEncuentro(temaId,distancia){
  var pos=Math.min(estado.cola.length,distancia);
  estado.cola.splice(pos,0,temaId);
}
function siguiente(){
  if(!estado.cola.length){
    var pend=temasPendientes();
    if(!pend.length){mostrarFinal();return;}
    estado.orden.forEach(function(id){if(pend.some(function(t){return t.id===id;}))estado.cola.push(id);});
  }
  // evitar dos encuentros seguidos del mismo tema si hay alternativa
  if(!DATOS.fiel&&estado.actual&&estado.cola.length>1&&estado.cola[0]===estado.actual.temaId){
    estado.cola.push(estado.cola.shift());
  }
  var temaId=estado.cola.shift();
  var tema=temaPorId(temaId);
  if(estado.temas[temaId].dominado){siguiente();return;}
  var evitar=(estado.actual&&estado.actual.temaId===temaId)?estado.actual.variante.formato:estado.temas[temaId].ultimoFormato;
  var v=elegirVariante(tema,evitar);
  estado.actual={temaId:temaId,variante:v};
  pintarPregunta(tema,v);
}

function barraSuperior(){
  if(estado.fase==='repaso'){

  }
  var dom=DATOS.temas.filter(function(t){return estado.temas[t.id].dominado;}).length;
  var pct=Math.round(100*dom/DATOS.temas.length);
  if(DATOS.fiel){var totV=0,hechas=0;DATOS.temas.forEach(function(t){totV+=t.variantes.length;hechas+=estado.temas[t.id].intentos;});pct=Math.round(100*hechas/totV);}
  if(MISION.activa){
    var hechas=Math.min(MISION.meta,misionHechas()+1);
    var minTrans=Math.round((Date.now()-MISION.inicio)/60000);
    var pctM=Math.round(100*misionHechas()/MISION.meta);
    return rutaPlanetas()+'<div class="barra"><span class="pill">Misión · pregunta '+hechas+' de '+MISION.meta+'</span><span class="pill">⏱ '+minTrans+' de ~'+misionMinutosEstimados()+' min</span>'+botonSonido()+
      '<button class="btn-icono" id="btn-pausa">⏸ Pausa</button>'+enlaceInicio()+'</div>'+
      '<div class="progreso mision"><div style="width:'+pctM+'%"></div></div>';
  }
  var restanRonda=6-(estado.respondidas%6);

    '<button class="btn-icono" id="btn-pausa">⏸ Pausa</button>'+enlaceInicio()+'</div>'+
    '<div class="progreso"><div style="width:'+pct+'%"></div></div>';
}

function pintarPregunta(tema,v){

        var exacta=v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+norm(val)))>=0;
        if(!exacta){var cerca=formaCercana(v,val);if(cerca){responderParcial(tema,v,val,cerca);return;}}
        responder(tema,v,norm(val));
      };

      var inpO=el('respuesta-texto');
      var enviarOracion=function(){
        var val=inpO.value.trim();
        if(!val){avisoCompletar();return;}
        var palabras=val.split(/\s+/);
        if(palabras.length<4){
          el('feedback').innerHTML='<div class="feedback fb-nube">Escribí una oración COMPLETA, de al menos 4 palabras 😊</div>';
          return;
        }
        var ok=palabras.some(function(p){
          var pn=norm(p).replace(/[^a-z0-9ñü]/g,'');
          return pn&&v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+pn))>=0;
        });
        estado.ultimaOracion=val;
        responder(tema,v,null,ok);
      };
      el('btn-comprobar').addEventListener('click',enviarOracion);
      inpO.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarOracion();});
      inpO.focus();
      break;
  }
}
function avisoCompletar(){

/* ---------- respuesta ---------- */
function responder(tema,v,canonicaUsuario,okPrevio){
  var st=estado.temas[tema.id];
  var reintento=st.fallos>0;
  st.intentos++;
  var ok=(okPrevio!==undefined&&canonicaUsuario===null)?okPrevio:(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+canonicaUsuario))>=0);
  if(ok&&v.formato==='oracion'&&estado.ultimaOracion){
    (st.oraciones=st.oraciones||[]).push(estado.ultimaOracion);
    estado.ultimaOracion=null;
  }
  estado.respondidas++;
  SAS.respuesta(ok,reintento);
  var conf=(estado.actual&&estado.actual.confianza)||null;
  if(conf)SAS.confianza(conf,ok);
  document.querySelectorAll('.chip-conf').forEach(function(x){x.disabled=true;});
  if(estado.fase==='repaso'){responderRepaso(tema,st,ok);return;}
  if(DATOS.fiel){
    if(ok){st.creditos++;sonidoBien();el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐</div>';}
    else{st.fallos++;sonidoSuave();el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Seguimos con la siguiente.</div>';}
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;SAS.dominado(tema.nombre);if(st.fallos===0)celebrarDominio();}
    guardarProgreso();
    desactivarZona();
    setTimeout(function(){
      if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
      despuesDeResponder();
    },1400);
    return;
  }
  if(ok&&conf==='adivino'){
    // acertar adivinando no cuenta como dominio: el tema vuelve pronto
    insertarEncuentro(tema.id,2);
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Salió! ⭐ Pero dijiste que ibas adivinando, así que este tema vuelve pronto para asegurarlo de verdad.</div>';
  }else if(ok){
    st.creditos++;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;SAS.dominado(tema.nombre);celebrarDominio();}
    else{insertarEncuentro(tema.id,3);} // vuelve más adelante: dominio en encuentros separados
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐ '+(st.dominado?'¡Planeta conquistado!':'Este tema volverá una vez más para asegurarlo.')+'</div>';
  }else{
    st.fallos++;
    insertarEncuentro(tema.id,2); // vuelve pronto, con otra variante de otro formato
    sonidoSuave();
    var msgNo=conf==='seguro'
      ?'Todavía no 💪 Estabas seguro, y justo esos son los que mejor se aprenden cuando se corrigen. Mirá el ejemplo.'
      :'Todavía no 💪 Este tema volverá más adelante con otra pregunta.';
    el('feedback').innerHTML='<div class="feedback fb-nube">'+msgNo+'</div>';
  }
  guardarProgreso();
  desactivarZona();
  var umbralMicro=(MISION.activa||conf==='seguro')?1:2;
  setTimeout(function(){
    if(!ok&&st.fallos>=umbralMicro&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
    despuesDeResponder();
  },1400);
}
/* Ortografía aproximada: la idea está bien pero la palabra no está bien escrita.
   Cuenta como PARCIALMENTE válida (medio crédito) y muestra cómo se escribe. */
function responderParcial(tema,v,escrito,correcto){
  var st=estado.temas[tema.id];
  var reintento=st.fallos>0;
  st.intentos++;
  estado.respondidas++;
  SAS.respuesta(true,reintento);
  (st.ortografia=st.ortografia||[]).push({escrito:escrito,correcto:correcto});
  document.querySelectorAll('.chip-conf').forEach(function(x){x.disabled=true;});
  var msg='<div class="feedback fb-nube">✍️ ¡Casi! La idea está bien, pero se escribe así: <b style="font-size:1.25em;letter-spacing:.04em">'+esc(correcto)+'</b><br><span class="suave">Escribiste: «'+esc(escrito)+'». Cuenta como <b>parcialmente válida</b>. Copiala una vez en tu cuaderno para recordarla.</span></div>';
  desactivarZona();
  sonidoSuave();
  function boton(fn){var b=document.createElement('button');b.className='btn-principal';b.style.marginTop='10px';b.textContent='Seguir ▶';b.addEventListener('click',fn);el('feedback').appendChild(b);}
  if(estado.fase==='repaso'){
    st.reforzado=true;guardarProgreso();
    el('feedback').innerHTML=msg;boton(avanzarRepaso);return;
  }
  if(DATOS.fiel){
    st.creditos+=0.5;
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;SAS.dominado(tema.nombre);}
  }else{
    st.creditos+=0.5;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;SAS.dominado(tema.nombre);celebrarDominio();}
    else insertarEncuentro(tema.id,3);
  }
  guardarProgreso();
  el('feedback').innerHTML=msg;boton(despuesDeResponder);
}
function desactivarZona(){
  el('zona-respuesta').querySelectorAll('button,select').forEach(function(x){x.disabled=true;});
  var bp=el('btn-pista');if(bp)bp.disabled=true;
  var bg=el('btn-guardar');if(bg)bg.disabled=true;
}
function despuesDeResponder(){
  if(MISION.activa){
    var hechas=misionHechas();
    if(hechas>=MISION.meta){SAS.setActivo(false);SAS.misionCompleta({preguntas:hechas,materia:DATOS.materia});guardarProgreso();pintarCierreMision(false);return;}
    if(!MISION.pausaHecha&&MISION.meta>=6&&hechas===Math.floor(MISION.meta/2)){MISION.pausaHecha=true;pausaMovimiento();return;}
    siguiente();return;
  }
  if(estado.respondidas%6===0){estado.rondas++;pausaRonda();return;}
  siguiente();
}
function pausaMovimiento(){
  SAS.setActivo(false);
  var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="carta" style="text-align:center"><h2>🤸 Pausa de movimiento</h2><p>Vas por la mitad. Levantate, estirá los brazos, saltá o andá por un vaso de agua.</p><div class="contador-pausa" id="contador-pausa">30</div><button class="btn-accion" id="btn-seguir-pausa">Seguir cuando estés listo</button></div>';
  document.body.appendChild(o);
  var seg=30,c=o.querySelector('#contador-pausa');
  var iv=setInterval(function(){seg--;if(seg<=0){clearInterval(iv);c.textContent='¡Listo!';}else c.textContent=seg;},1000);
  o.querySelector('#btn-seguir-pausa').addEventListener('click',function(){clearInterval(iv);o.remove();siguiente();});
}

/* ---------- cierre de misión ---------- */
function pintarCierreMision(todoDominado){
  SAS.setActivo(false);
  confeti();
  var t=SAS.totales();
  var puntos=Math.max(0,(t.puntos||0)-MISION.puntosInicio);
  var minutos=Math.max(0,Math.round(((t.hoy.segundos||0)-MISION.segundosInicio)/60));
  var hechas=misionHechas();
  var racha=SAS.racha();
  var subieron=[],pendientes=[];
  DATOS.temas.forEach(function(x){
    var s=estado.temas[x.id];var ahora=s.dominado?'dominado':(s.intentos>0?'progreso':'pendiente');var antes=MISION.temasAntes[x.id]||'pendiente';
    if(ahora!==antes)subieron.push({nombre:x.nombre,antes:antes,ahora:ahora});
    else if(ahora==='progreso'&&s.fallos>0)pendientes.push(x.nombre);
  });
  function etq(e){return e==='dominado'?'Dominado':(e==='progreso'?'En progreso':'Sin empezar');}
  var reintentos=0;DATOS.temas.forEach(function(x){var s=estado.temas[x.id];if(s.fallos>0&&s.creditos>0)reintentos++;});
  var h='<div class="carta" style="text-align:center"><h1>'+(todoDominado?'¡Conquistaste todos los planetas! 🌟':'¡Misión completa! 🎯')+'</h1>';
  var frase=reintentos>0?'Hubo temas que te costaron y los volviste a intentar hasta que salieron. Eso es exactamente lo que hace que se queden.':'Respondiste con calma y sin apuro. Así se aprende de verdad.';
  h+=mascota(frase);
  h+='<div class="cierre-grid">';
  h+='<div class="cierre-celda"><span class="num" style="color:#7A4B00">+'+puntos+'</span><span class="sub">puntos de esfuerzo</span></div>';
  h+='<div class="cierre-celda"><span class="num">'+hechas+'</span><span class="sub">preguntas</span></div>';
  h+='<div class="cierre-celda"><span class="num" style="color:#0A5C59">'+minutos+'</span><span class="sub">minutos activos</span></div>';
  h+='<div class="cierre-celda"><span class="num" style="color:#B45309">'+racha+'</span><span class="sub">día'+(racha===1?'':'s')+' de racha</span></div>';
  h+='</div></div>';
  if(subieron.length||pendientes.length){

    pendientes.forEach(function(n){h+='<div class="cierre-tema pend"><b>'+esc(n)+'</b><span>Todavía no · vuelve la próxima</span></div>';});
    h+='</div>';
  }
  h+='<div class="carta" style="text-align:center"><h2>¿Cuándo hacés la siguiente misión?</h2><p class="suave">Elegir un momento ahora hace mucho más probable que pase.</p>';
  h+='<div class="chips-proxima"><button data-p="Antes de la escuela">Antes de la escuela</button><button data-p="Al llegar de la escuela">Al llegar de la escuela</button><button data-p="Después de cenar">Después de cenar</button></div>';
  h+='<p class="suave" id="proxima-msg"></p></div>';

  h+='<button class="btn-accion" id="btn-listo-hoy" style="margin-bottom:8px">Listo por hoy</button>';
  if(!todoDominado&&temasPendientes().length)h+='<button class="btn-sec" id="btn-otra-mision" style="width:100%;margin-bottom:8px">Una misión más ('+MISION.meta+' preguntas)</button>';
  h+='<button class="btn-sec" id="btn-ver-informe" style="width:100%">Ver el informe para mamá y papá</button>';
  h+='<p class="suave" style="margin-top:10px">Terminar a tiempo también cuenta. Mañana seguimos.</p></div>';

  mostrarOverlay('📖 Mini-lección: '+esc(tema.nombre),h,'¡Entendido!',function(){despuesDeResponder();});
}

/* ---------- pausas ---------- */
function pausaRonda(){
  var min=Math.round((Date.now()-estado.inicioRonda)/60000);
  var h='<div class="carta" style="text-align:center"><h1>¡Ronda '+estado.rondas+' completada! 🎉</h1>';
  h+=mascota('¡Los astronautas también estiran! Levantate, saltá 10 veces o andá por un vaso de agua. 🤸');
  h+='<p>Llevás '+estado.respondidas+' preguntas'+(min>0?' en unos '+min+' minutos':'')+'.</p>';
  if(estado.rondas>=3){
    h+='<p>Ya hiciste 3 rondas. <b>Es un buen momento para parar</b> y seguir otro día.</p>';

/* ---------- fase de repaso final ---------- */
function tarjetasDeTema(t){
  var cartas=[];
  var exp=String(t.explicacion||'').trim();
  if(exp){
    if(exp.indexOf('<')>=0){cartas.push({frente:'Idea clave',dorso:exp,html:true});}
    else{
      var partes=exp.split('. ').map(function(p){p=p.trim();return p?(/[.!?:]$/.test(p)?p:p+'.'):'';}).filter(Boolean);
      var maxCartas=5,tam=Math.max(1,Math.ceil(partes.length/maxCartas));
      for(var i=0;i<partes.length;i+=tam){cartas.push({frente:'Idea '+(cartas.length+1),dorso:partes.slice(i,i+tam).join(' '),html:false});}
    }
  }
  cartas.push({frente:'⭐ Ejemplo paso a paso',dorso:t.microleccion,html:true});
  return cartas;
}
function graficoSvg(g){
  var h='';
  if(g.tipo==='barra'){
    var w=310,c=28,gap=2;
    h='<svg viewBox="0 0 '+w+' 36" style="max-width:340px;width:100%;display:block;margin:10px auto" role="img" aria-label="Barra dividida en 10 partes, '+g.pintadas+' pintadas">';
    for(var i=0;i<10;i++){
      h+='<rect x="'+(i*(c+gap)+2)+'" y="3" width="'+c+'" height="30" rx="4" fill="'+(i<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="2"/>';
    }
    h+='</svg>';
  }else{
    var cel=26,gp=2,tam=10*(cel+gp)+4;
    h='<svg viewBox="0 0 '+tam+' '+tam+'" style="max-width:300px;width:100%;display:block;margin:10px auto" role="img" aria-label="Cuadrícula de 100 partes, '+g.pintadas+' pintadas">';
    for(var f=0;f<10;f++)for(var col=0;col<10;col++){
      var idx=f*10+col;
      h+='<rect x="'+(col*(cel+gp)+2)+'" y="'+(f*(cel+gp)+2)+'" width="'+cel+'" height="'+cel+'" rx="3" fill="'+(idx<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="1.5"/>';
    }
    h+='</svg>';
  }
  return h;
}

function modoTarjetas(cartas,alCompletar){
  var vistas=0;

    h+='<div class="tarjeta-repaso" data-i="'+i+'"><div class="cara-frente">'+esc(c.frente)+' · tocá para ver 👆</div><div class="cara-dorso oculto"></div></div>';
  });
  h+='</div><p class="suave" id="contador-cartas">Tarjetas vistas: 0 de '+cartas.length+'</p>';
  el('zona-modo').innerHTML=h;
  document.querySelectorAll('.tarjeta-repaso').forEach(function(card){
    card.addEventListener('click',function(){
      if(card.classList.contains('vista'))return;
      var i=parseInt(card.getAttribute('data-i'),10);
      card.classList.add('girando');
      setTimeout(function(){
        card.querySelector('.cara-frente').classList.add('oculto');

        if(cartas[i].html)dorso.innerHTML=cartas[i].dorso;else dorso.textContent=cartas[i].dorso;

function preguntaRefuerzo(tema){
  var st=estado.temas[tema.id];
  // preferir formatos generativos (escribir/armar): recordar produciendo fija más la memoria
  var gen=tema.variantes.filter(function(x){return (x.formato==='escribe'||x.formato==='arma')&&st.usadas.indexOf(x.id)<0;});
  var v;
  if(gen.length){v=gen[Math.floor(Math.random()*gen.length)];if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);st.ultimoFormato=v.formato;}
  else{v=elegirVariante(tema,st.ultimoFormato);}
  estado.actual={temaId:tema.id,variante:v};
  pintarPregunta(tema,v);
}
function responderRepaso(tema,st,ok){
  desactivarZona();
  if(ok){
    st.reforzado=true;
    SAS.reforzado();
    guardarProgreso();
    confeti();
    sonidoBien();
    otorgarInsignia('no-me-rindo');
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Eso es! 🌟 Tema reforzado.</div>';
    setTimeout(avanzarRepaso,1400);
  }else{
    st.fallos++;
    estado.refuerzoIntentos++;
    guardarProgreso();
    sonidoSuave();
    if(estado.refuerzoIntentos<2){
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Mirá el ejemplo otra vez y probá con otra pregunta.</div>';
      setTimeout(function(){
        mostrarOverlay('⭐ Ejemplo paso a paso','<div class="explicacion">'+tema.microleccion+'</div>','Probar otra vez',function(){preguntaRefuerzo(tema);});
      },1400);
    }else{
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no — este tema lo seguimos practicando otro día 💙</div>';
      setTimeout(avanzarRepaso,1400);
    }
  }
}
function avanzarRepaso(){
  estado.refuerzoIntentos=0;

  if(estado.repasoIdx<estado.repasoLista.length){pintarRepaso(temaPorId(estado.repasoLista[estado.repasoIdx]));}
  else{informeFinal();}

  el('app').innerHTML=h;
  el('btn-copiar').addEventListener('click',function(){
    var lineas=['📚 '+DATOS.titulo,'Preguntas practicadas: '+estado.respondidas+(estado.dias.length>1?' en '+estado.dias.length+' días':''),''];
    DATOS.temas.forEach(function(t){
      var s=estado.temas[t.id];
      var est=DATOS.fiel?(s.creditos+' de '+t.variantes.length+' correctas'):(s.dominado?'✅ Dominado':(s.reforzado?'💪 Reforzado':(s.intentos?'🔄 Seguir practicando':'⬜ Sin ver')));
      lineas.push('• '+t.nombre+': '+est+' ('+s.intentos+' intentos, '+s.pistas+' pistas)');
    });
    var conResumen=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
    if(conResumen.length){
      lineas.push('','✍️ Con sus palabras:');
      conResumen.forEach(function(t){lineas.push('• '+t.nombre+': «'+estado.temas[t.id].resumen+'»');});
    }
    var conOr=DATOS.temas.filter(function(t){return (estado.temas[t.id].oraciones||[]).length;});
    if(conOr.length){
      lineas.push('','📝 Oraciones escritas (revisar concordancia):');
      conOr.forEach(function(t){(estado.temas[t.id].oraciones||[]).forEach(function(o){lineas.push('• «'+o+'»');});});
    }
    var cOrt=DATOS.temas.filter(function(t){return (estado.temas[t.id].ortografia||[]).length;});
    if(cOrt.length){
      lineas.push('','✍️ Palabras para practicar la escritura:');
      cOrt.forEach(function(t){(estado.temas[t.id].ortografia||[]).forEach(function(o){lineas.push('• «'+o.escrito+'» → '+o.correcto);});});
    }
    var ins=Object.keys(estado.insignias).filter(function(k){return INSIGNIAS[k];});
    if(ins.length)lineas.push('','🏅 Insignias: '+ins.map(function(k){return INSIGNIAS[k].emoji+' '+INSIGNIAS[k].nombre;}).join(', '));
    var texto=lineas.join('\n');
    try{
      navigator.clipboard.writeText(texto).then(function(){el('btn-copiar').textContent='¡Informe copiado! ✅';});
    }catch(e){el('btn-copiar').textContent='No se pudo copiar en este navegador';}
  });
  el('btn-reiniciar').addEventListener('click',function(){
    mostrarOverlay('🔄 Empezar de cero','<p>Se borrará todo el avance guardado y la práctica comenzará desde el principio. ¿Continuar?</p>','Sí, empezar de cero',function(){borrarProgreso();location.reload();});
  });
}

crearCielo();
(function(){
  // Puerta de cortesía: en el sitio publicado se entra con alias y clave desde el inicio.
  // Abierta como archivo local (file://) no aplica.
  var enSitio=location.protocol==='http:'||location.protocol==='https:';
  if(enSitio&&!SESION){
    el('app').innerHTML='<div class="carta" style="text-align:center"><h1>🔒 Entrá desde el inicio</h1><p>Esta práctica se abre desde la página principal, con tu alias y tu clave, para que tus puntos queden guardados a tu nombre.</p><a class="btn-accion" style="display:block;text-decoration:none;box-sizing:border-box" href="../">Ir al inicio</a></div>';
    return;
  }
  pintarInicio();
})();
</script>
