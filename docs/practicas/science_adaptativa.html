:root{
  --cielo1:#1B1464;--cielo2:#4A1E9E;--carta:#FFFFFF;--tinta:#2D2A5E;--tintaSuave:#6B6899;
  --sol:#FFB703;--solOscuro:#D89400;--menta:#06D6A0;--mentaOscuro:#04A87E;
  --nube:#FFD166;--nubeOscuro:#E0B04A;--cielitoBtn:#8ECAE6;--cielitoOscuro:#5FA8CC;
  --lila:#9B5DE5;--moradoTitulo:#3A1D8A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Andika','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  color:var(--tinta);min-height:100vh;overflow-x:hidden;
  font-size:17px;line-height:1.6;letter-spacing:.01em;
  background:linear-gradient(160deg,var(--cielo1) 0%,var(--cielo2) 55%,#7B2FBE 100%);
  background-attachment:fixed}
.estrella{position:fixed;color:#FFF;pointer-events:none;z-index:0;animation:titilar 3s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.contenedor{max-width:640px;margin:0 auto;padding:14px;position:relative;z-index:1}
.carta{background:var(--carta);border-radius:22px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(20,10,60,.35);animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{font-size:1.55rem;margin:.2em 0;color:var(--moradoTitulo);letter-spacing:.3px}
h2{font-size:1.15rem;color:var(--moradoTitulo);margin:.3em 0 .5em}
.suave{color:var(--tintaSuave);font-size:.92rem}
button{font-family:inherit;font-size:1.02rem;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;font-weight:700}
button:active{transform:translateY(4px)}
.btn-principal{background:var(--sol);color:#4A2500;width:100%;font-size:1.12rem;font-weight:800;
  box-shadow:0 5px 0 var(--solOscuro)}
.btn-principal:active{box-shadow:0 1px 0 var(--solOscuro)}
.btn-sec{background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 4px 0 var(--cielitoOscuro)}
.btn-sec:active{box-shadow:0 1px 0 var(--cielitoOscuro)}
.btn-opcion{display:block;width:100%;text-align:left;background:#F5F3FF;color:var(--tinta);
  margin:9px 0;border:3px solid #E4DEFF;font-weight:600;box-shadow:0 3px 0 #E4DEFF}
.btn-opcion:hover{border-color:var(--lila);transform:translateY(-2px)}
.btn-opcion:active{transform:translateY(2px)}
.ficha{display:inline-block;background:#FFF4D6;border:3px solid var(--sol);color:#7A4E00;font-weight:800;
  margin:4px;padding:11px 15px;border-radius:14px;box-shadow:0 3px 0 var(--solOscuro)}
.ficha:active{transform:translateY(3px);box-shadow:none}
.zona-construccion{min-height:56px;background:#F5F3FF;border:3px dashed #C9BEF5;border-radius:16px;padding:8px;margin:10px 0}
.ruta-planetas{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.14);border-radius:99px;padding:8px 12px;margin-bottom:10px}
.planeta{font-size:1.45rem;filter:grayscale(1) opacity(.45);transition:filter .4s,transform .4s}
.planeta.dominado{filter:none;transform:scale(1.18);text-shadow:0 0 14px #FFD166}
.cohete{font-size:1.5rem;animation:flotar 2.6s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:rgba(255,255,255,.18);color:#FFF;border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:700}
.btn-icono{background:rgba(255,255,255,.18);color:#FFF;padding:6px 12px;border-radius:99px;box-shadow:none;font-size:.95rem}
.mascota{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mascota .emoji-mascota{font-size:2.5rem;animation:flotar 3s ease-in-out infinite}
.burbuja{background:#FFF;border-radius:18px;border-bottom-left-radius:4px;padding:12px 15px;flex:1;
  box-shadow:0 5px 16px rgba(20,10,60,.3);font-size:.98rem}
.fila-orden{display:flex;align-items:center;gap:8px;background:#F5F3FF;border:3px solid #E4DEFF;border-radius:14px;padding:9px 11px;margin:7px 0}
.fila-orden span{flex:1;font-weight:600}
.fila-orden button{padding:7px 12px;background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 3px 0 var(--cielitoOscuro)}
select{font-family:inherit;font-size:.95rem;padding:9px;border-radius:12px;border:3px solid #E4DEFF;background:#fff;max-width:100%;font-weight:600;color:var(--tinta)}
.fila-sel{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.fila-sel b{flex:1;min-width:120px}
.feedback{border-radius:16px;padding:15px;margin-top:12px;font-weight:800;font-size:1.05rem;text-align:center}
.fb-bien{background:#D9FBEF;color:#046B52;border:3px solid var(--menta);animation:rebotar .5s ease}
@keyframes rebotar{0%{transform:scale(.9)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.fb-nube{background:#FFF4D6;color:#7A5300;border:3px solid var(--nube);animation:mecer .6s ease}
@keyframes mecer{0%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{transform:none}}
.overlay{position:fixed;inset:0;background:rgba(20,10,60,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .carta{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.oculto{display:none!important}
.orden-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--sol);color:#4A2500;
  align-items:center;justify-content:center;font-weight:800;margin-right:8px;font-size:.9rem}
table.informe{width:100%;border-collapse:collapse;font-size:.9rem}
table.informe th,table.informe td{border-bottom:1px solid #E4DEFF;padding:8px 6px;text-align:left}
.modo-adulto{font-family:system-ui,'Segoe UI',Arial,sans-serif}
.explicacion{background:#F5F3FF;border-left:5px solid var(--lila);padding:13px 15px;border-radius:10px;margin:12px 0;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch}
.progreso{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:8px 0}
.progreso div{height:100%;background:linear-gradient(90deg,var(--menta),var(--sol));width:0%;transition:width .5s}
.tarjeta-repaso{margin:10px 0;cursor:pointer;transition:transform .2s}
.tarjeta-repaso.girando{transform:rotateY(90deg)}
.tarjeta-repaso .cara-frente{background:linear-gradient(135deg,var(--lila),#7B2FBE);color:#fff;font-weight:800;padding:17px;text-align:center;border-radius:16px;box-shadow:0 4px 0 #5B1E96}
.tarjeta-repaso .cara-dorso{background:#F5F3FF;border:3px solid var(--lila);border-radius:16px;padding:15px;font-size:1rem;line-height:1.7;letter-spacing:.015em}
.tarjeta-repaso.vista{cursor:default}
button:disabled{opacity:.45;cursor:not-allowed}
.respuesta-escrita{width:100%;font-family:inherit;font-size:1.1rem;padding:13px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;margin:8px 0;font-weight:700;color:var(--tinta)}
.respuesta-escrita:focus{outline:none;border-color:var(--sol)}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:11px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;color:var(--tinta)}
textarea:focus{outline:none;border-color:var(--sol)}
.esquema{background:#F5F3FF;border-radius:16px;padding:12px}
.nodo-centro{background:linear-gradient(135deg,var(--moradoTitulo),var(--lila));color:#fff;font-weight:800;text-align:center;border-radius:99px;padding:11px 16px;margin-bottom:10px;box-shadow:0 4px 0 #2A1266}
.ramas{display:grid;grid-template-columns:1fr;gap:12px}
.rama{border-left:6px solid var(--lila);background:#fff;border-radius:0 14px 14px 0;padding:13px 16px;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch;box-shadow:0 2px 8px rgba(20,10,60,.08)}
.rama b{color:var(--moradoTitulo);display:block;margin-bottom:6px}
.rama-estrella{border-left-color:var(--sol);background:#FFF9E8}
.toast-insignia{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFF4D6,#FFE39A);border:3px solid var(--sol);color:#7A4E00;font-weight:800;border-radius:99px;padding:11px 19px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastIn .35s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.confeti{position:fixed;top:-14px;width:10px;height:14px;z-index:55;border-radius:3px;animation:caerConfeti linear forwards}
@keyframes caerConfeti{to{transform:translateY(105vh) rotate(540deg)}}
.pulso{animation:pulsar 1.6s ease-in-out infinite}
@keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

var DATOS = {"titulo":"Práctica de Science — Repaso completo (Quiz #1: Nervous, Digestive y Excretory Systems)","materia":"Science","sal":"0e55d592c539ef9a0294afd8","creditosNecesarios":2,"fiel":false,"voz":true,"temas":[{"id":"sensory-organs","nombre":"What are sensory organs?","explicacion":"<b>Del libro (literal):</b> Your body connects to the world through the sensory organs. Each sensory organ gathers specific kinds of information. The information is sent to your brain, which is the control center of the body. The brain interprets the information and then tells the body how to react.<ul><li><b>Eye</b> — allows us to see. Light enters through the pupil, a lens focuses it onto the back of the eye, and a nerve sends signals to the brain, which interprets them to form a visual image.</li><li><b>Ear</b> — allows us to hear. Sound waves make the eardrum vibrate; the ear changes the vibrations into nerve signals; a nerve carries them to the brain, which interprets them as words, music, or sounds.</li><li><b>Tongue</b> — the sense of taste. Taste buds send signals to the brain, which interprets them as sweet, salty, bitter, or sour.</li><li><b>Nose</b> — detects smell. It picks up chemicals in the air and changes them into nerve signals sent to the brain.</li><li><b>Skin</b> — the sense of touch, from nerve endings that feel pressure, pain, hot, and cold. Fingertips have more nerve endings than other body parts.</li></ul>","microleccion":"Ejemplo con otra situación (no es una de las variantes): cuando olés una flor, la nariz detecta los químicos en el aire y los convierte en una señal nerviosa. Esa señal viaja hasta el cerebro, que la interpreta como 'ese es el olor de una rosa'. Así funcionan TODOS los órganos de los sentidos: recogen información y se la mandan al cerebro para que la interprete.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"sen-v1","formato":"mc","pregunta":"Which sensory organ allows you to see?","pista":"Tiene una pupila y un lente.","hashes":["5574b3f8e095a66b6d99c00a58c3a754fc0ec4d4eda14ed54e2f0d0b8343aecb"],"opciones":["Tongue","Ear","Nose","Eye"]},{"id":"sen-v2","formato":"mc","pregunta":"What causes the eardrum to vibrate, letting you hear?","pista":"Piensa en cómo viaja el sonido por el aire.","hashes":["4ee84094ae48dfe97aaff3b5086e8e4878eaacb062e24a21378816cb594b6f62"],"opciones":["Nerve endings","Sound waves","Light","Chemicals in the air"]},{"id":"sen-v3","formato":"escribe","pregunta":"The tongue has small structures that send taste signals to the brain. What are they called?","pista":"Empieza con 'taste'.","hashes":["545ce7e65d345d2bcc66ecc470adcbeabf336c597a08008f0621e0bfcd240b10"]},{"id":"sen-v4","formato":"mc","pregunta":"Which sense organ has nerve endings that feel pressure, pain, hot, and cold?","pista":"Cubre todo tu cuerpo.","hashes":["8ec9f0f8e5dbdce78371f8c9e82b95955371640cc97353ed505aab571f54bdc0"],"opciones":["Eye","Skin","Tongue","Nose"]},{"id":"sen-v5","formato":"verifica","pregunta":"¿La nariz detecta los olores cambiando los químicos del aire en señales nerviosas que van al cerebro?","pista":"Así funciona el sentido del olfato.","hashes":["7ac9a28d0b95b36a3fc146876f29be27befe90e9119134e6f78f8b4ec3b9f540"],"opciones":["Sí","No"]},{"id":"sen-v6","formato":"empareja","pregunta":"Uní cada órgano de los sentidos con lo que percibe:","pista":"Cada órgano hace un trabajo distinto.","hashes":["e4b3932f3056e4dd8980b46ceb2ba180138c2a6b94109f7b11486b97effce05c"],"izquierda":["Eye","Ear","Tongue","Nose","Skin"],"derecha":["hear","touch","see","taste","smell"]},{"id":"sen-v7","formato":"porque","pregunta":"¿Por qué las puntas de los dedos (fingertips) son más sensibles al tacto que otras partes del cuerpo?","pista":"Piensa en lo que dice el texto sobre la piel (skin).","hashes":["c3415b507db66273f0eba82a7188744c9c00fe0d75751a42f9d81fc98956e073"],"opciones":["Porque están más cerca del cerebro","Porque tienen más terminaciones nerviosas (nerve endings) que otras partes","Porque tienen más piel que otras partes"]},{"id":"sen-v8","formato":"mc","pregunta":"What is the control center of the body that receives information from all the sensory organs?","pista":"Interpreta toda la información y decide cómo reaccionar.","hashes":["f2221d3ec0538bc46314bd8ba30bfc2e5e8686df2f11ff2fc96d94da76903528"],"opciones":["The stomach","The heart","The brain","The skin"]},{"id":"sen-v9","formato":"clasifica","pregunta":"Clasificá cada estructura según a qué órgano de los sentidos pertenece:","pista":"Cada estructura solo pertenece a un órgano de los sentidos.","hashes":["369dbcd3e00e0e1ca68795fb44253160b919a702d42cd103f0192f65a7cbefc9"],"categorias":["Eye","Ear","Tongue","Skin"],"elementos":["pupil","taste buds","nerve endings","eardrum"]}]},{"id":"brain-parts","nombre":"The Brain","explicacion":"<b>Del libro (literal):</b> The nervous system sends messages throughout your body. Your brain is your body's most complex organ. It interprets the information it receives about conditions inside and outside the body. Then it sends messages telling the body how to respond, or react. The brain is made up of nerve cells. Nerve cells also carry messages through the spinal cord to and from all parts of the body.<ul><li><b>Cerebrum</b> — controls your thoughts, imagination, feelings, and voluntary muscle movement (helps you think, learn, and remember).</li><li><b>Brain stem</b> — controls body functions such as breathing, heart rate, and swallowing (things you don't think about).</li><li><b>Cerebellum</b> — controls balance and coordination (helps you balance and move smoothly).</li><li><b>Spinal cord</b> — carries messages to and from the brain.</li></ul>","microleccion":"Ejemplo con otra situación (no es una de las variantes): cuando andás en bicicleta sin caerte, el cerebelo (cerebellum) es el que te ayuda a mantener el equilibrio y a mover el cuerpo con suavidad. Si en cambio estás resolviendo un problema de matemática en tu cabeza, el que trabaja es el cerebro (cerebrum), porque ahí ocurre el pensamiento.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"brn-v1","formato":"mc","pregunta":"Which part of the brain controls balance and coordination?","pista":"Te ayuda a no caerte.","hashes":["c18e65da893537c695347c5a73ae268c590e8bec0cd66faa6153d2857280e39b"],"opciones":["Cerebellum","Brain stem","Cerebrum","Spinal cord"]},{"id":"brn-v2","formato":"mc","pregunta":"Which part of the brain controls thoughts, imagination, feelings, and voluntary muscle movement?","pista":"Es la parte más grande del cerebro; ahí pensás y recordás.","hashes":["8bd51934452a55f1e79fcb5bde29e48e6d0387a7010bdfd956c09d2f880bdf96"],"opciones":["Brain stem","Cerebellum","Cerebrum"]},{"id":"brn-v3","formato":"mc","pregunta":"Which part controls body functions you don't think about, like breathing and heartbeat?","pista":"Funciona aunque no lo pienses, como el corazón latiendo.","hashes":["aadbda154f0db5ebb7942c2f62fbe7c781ba4cf7adecf3a668d3236681d07692"],"opciones":["Brain stem","Cerebellum","Cerebrum"]},{"id":"brn-v4","formato":"escribe","pregunta":"What carries messages to and from the brain, running down the back?","pista":"Dos palabras: 'spinal' + 'cord'.","hashes":["8cb165156d49aed6dae76673c73fd765dbe87d659e74a511fe82f3759058f6cd"]},{"id":"brn-v5","formato":"verifica","pregunta":"¿El cerebro está hecho de células nerviosas (nerve cells)?","pista":"Igual que el resto del sistema nervioso.","hashes":["feefa1b902a4d6e2ac69f9ec20b226342da901daa5e90073809f522fa8b49b73"],"opciones":["Sí","No"]},{"id":"brn-v6","formato":"clasifica","pregunta":"Clasificá cada función según la parte del cerebro que la hace:","pista":"Pensá en cuál de las tres partes hace cada trabajo.","hashes":["127f319461d43eaa2faa6d4606d4a489e40f41ecd5d3439aba8a54a4b87ba11b"],"categorias":["Cerebrum","Cerebellum","Brain stem"],"elementos":["helps you balance and move smoothly","controls voluntary muscle movement","helps you think, learn, and remember","controls breathing and heartbeat"]},{"id":"brn-v7","formato":"mc","pregunta":"What is the brain's job when it receives information from the body?","pista":"El cerebro procesa la información y manda una respuesta.","hashes":["1e92aa48dc6d912cd74b778f589597adb6a5c71585b980301c3db23864ef295d"],"opciones":["It interprets the information and tells the body how to respond","It pumps blood to the lungs","It stores food for later"]},{"id":"brn-v8","formato":"porque","pregunta":"¿Por qué decimos que el cerebro es el órgano más complejo del cuerpo?","pista":"Piensa en todo lo que hace el cerebro a la vez.","hashes":["48eb03ab50cbea3279899312793b1c7e2f3bd919db73e333b36d6d3ccbce067d"],"opciones":["Porque no necesita oxígeno","Porque es el órgano más grande del cuerpo","Porque interpreta información de todo el cuerpo y envía mensajes para decirle cómo reaccionar"]}]},{"id":"nerves-spinal-cord","nombre":"Nerves and the Spinal Cord","explicacion":"<b>Del libro (literal):</b> The brain and the spinal cord make up the central nervous system. The spinal cord is made up of a thick bundle of nerves. Messages to and from your brain travel through the nerves of your spinal cord. These nerves branch out to other parts of the body. Some of these nerves are <b>motor nerves</b> that carry messages from the brain to other parts of the body. Other nerves are <b>sensory nerves</b> that carry messages from sense organs and other body parts to the spinal cord.<br>Del resumen: The nervous system is like your body's messaging system. It helps you think, feel, move, and react! Its two main parts are: 1. <b>Central Nervous System (CNS)</b> — the brain and spinal cord. The brain is the boss, it tells your body what to do. The spinal cord is like a highway for messages. 2. <b>Peripheral Nervous System (PNS)</b> — made up of nerves that spread all over your body, and carry messages to and from the brain and spinal cord.","microleccion":"Ejemplo con otra situación (no es una de las variantes): si tocás algo muy caliente, un nervio sensorial (sensory nerve) manda esa información desde tu mano hacia la médula espinal y el cerebro. El cerebro decide que hay que apartar la mano, y esa orden viaja de vuelta por un nervio motor (motor nerve) hasta los músculos de tu brazo.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"ner-v1","formato":"mc","pregunta":"What are the brain and spinal cord together called?","pista":"Son las dos partes 'centrales' del sistema nervioso.","hashes":["3545d91a2dd17fae16ac5df5d6d30a8335b0b60c790ad8bed64105bf040e3664"],"opciones":["Central Nervous System (CNS)","Excretory System","Peripheral Nervous System (PNS)","Digestive System"]},{"id":"ner-v2","formato":"mc","pregunta":"What is the spinal cord made up of?","pista":"Muchos nervios juntos, formando un solo cordón.","hashes":["03755633c58978f5951b6c38c195ed2eef03a6dbe36a6a3c525cb2e0a80599df"],"opciones":["A muscular sac","Bean-shaped organs","A thick bundle of nerves"]},{"id":"ner-v3","formato":"verifica","pregunta":"¿Los nervios motores (motor nerves) llevan mensajes DESDE el cerebro HACIA otras partes del cuerpo?","pista":"'Motor' tiene que ver con el movimiento que el cuerpo hace.","hashes":["03682113bc43887a0f743484466dde79c0318ebabb1e9f83bc5e6cf6fd4e11dd"],"opciones":["Sí","No"]},{"id":"ner-v4","formato":"verifica","pregunta":"¿Los nervios sensoriales (sensory nerves) llevan mensajes DESDE el cerebro hacia los órganos de los sentidos?","pista":"Van en la dirección contraria: desde los sentidos hacia la médula espinal.","hashes":["65d805a944c159faf81b3890988e1646377b19fbdcb3681829e20223da5236cb"],"opciones":["Sí","No"]},{"id":"ner-v5","formato":"mc","pregunta":"What is the Peripheral Nervous System (PNS) made up of?","pista":"'Peripheral' significa que está en los bordes, no en el centro.","hashes":["d9187dd0bc1a0dc2c31aebce484362bd71491c7043b9989ebb7017286025c563"],"opciones":["Only the spinal cord","Only the brain","Nerves that spread all over the body"]},{"id":"ner-v6","formato":"empareja","pregunta":"Uní cada parte con su descripción:","pista":"Pensá en la dirección de cada tipo de mensaje.","hashes":["b93203e79c58ff0e3d493497705e26355ae2b17a9ae947ec26f0acf8e1f5994d"],"izquierda":["Motor nerves","Sensory nerves","Central Nervous System","Peripheral Nervous System"],"derecha":["carry messages from the brain to other body parts","the brain and spinal cord","nerves that spread all over the body","carry messages from sense organs to the spinal cord"]},{"id":"ner-v7","formato":"porque","pregunta":"¿Por qué se dice que el cerebro es 'el jefe' (the boss) del sistema nervioso?","pista":"Un jefe da órdenes, pero también recibe reportes.","hashes":["3240efd85648839ea6482761cf09b29ed4200c9b38ed1d3880e263c89b6bd7cb"],"opciones":["Porque no recibe información de nadie","Porque es el órgano más grande del cuerpo","Porque le dice al cuerpo qué hacer, y el cuerpo le manda información de vuelta a través de los nervios"]},{"id":"ner-v8","formato":"escribe","pregunta":"What kind of system is 'like your body's messaging system,' helping you think, feel, move, and react?","pista":"Es el nombre del sistema que estamos estudiando.","hashes":["6e2d7e17cfde1187efec74744b56d5e3e17add1f8843e9bcade3516820f05944"]}]},{"id":"digestive-organs","nombre":"Digestive System: Organs and Functions","explicacion":"<b>Del libro (literal):</b> The digestive system breaks down food into nutrients and other substances that the body can use. Cells use these substances for energy, growth, and repair. Food undergoes many changes as it passes through the digestive system. Digestion begins in the mouth, where your teeth tear and crush food. Saliva, the liquid in your mouth, begins to chemically break down some food.<ul><li><b>Mouth</b> — where digestion starts. Teeth chew, and saliva helps break down food.</li><li><b>Esophagus</b> — a tube that carries food to your stomach.</li><li><b>Stomach</b> — uses acids and muscles to break down food into smaller pieces.</li><li><b>Small intestine</b> — most digestion occurs here; nutrients are absorbed from food.</li><li><b>Large intestine</b> — absorbs water and makes waste ready to leave the body.</li></ul>El <b>liver</b> breaks down fats (a tube connects the liver to the small intestine), y el <b>pancreas</b> produces a chemical that adjusts sugar levels in your body — ambos mandan químicos al intestino delgado para ayudar a digerir.","microleccion":"Ejemplo con otra comida (no es una de las variantes): cuando comés una manzana, primero los dientes la mastican en la boca y la saliva empieza a descomponerla. Después baja por el esófago hasta el estómago, donde los ácidos la siguen descomponiendo. Luego pasa al intestino delgado, donde se absorben los nutrientes, y lo que sobra va al intestino grueso, que absorbe el agua y forma el desecho.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"dig-v1","formato":"ordena","pregunta":"Ordená el camino de la comida por el sistema digestivo, del principio al final:","pista":"Pensá en el recorrido real de la comida dentro de tu cuerpo.","hashes":["500c6e6c5ad2751e1744209c77c0db0885d37e5cfc5721f95c1f143ae3c45dbe"],"elementos":["Stomach — acids and muscles break food into smaller pieces","Large intestine — absorbs water and forms waste","Mouth — teeth chew and saliva starts breaking down food","Esophagus — tube that carries food to the stomach","Small intestine — most digestion happens, nutrients are absorbed"]},{"id":"dig-v2","formato":"mc","pregunta":"What is the tube that connects the mouth to the stomach?","pista":"Es solo un tubo de paso, no digiere nada por sí solo.","hashes":["6c93745794d8850e85ea610607d3c0fa50a4f8934e33539b0acd28054b6e9093"],"opciones":["Esophagus","Small intestine","Trachea","Pancreas"]},{"id":"dig-v3","formato":"mc","pregunta":"Which organ uses acids and muscles to keep breaking food into smaller pieces?","pista":"Tiene paredes musculares que la agitan ( c31628ab0c2f513909513dbca07b10f79af3bad3aca7947e0c7651e"],"opciones":["Porque la mayor parte de la digestión ocurre en el intestino delgado","Porque la boca hace todo el trabajo","Porque el estómago no tiene ácidos"]},{"id":"dig-v10","formato":"verifica","pregunta":"¿La comida pasa directo de la boca al intestino grueso, sin pasar por el estómago?","pista":"Repasá el orden completo del sistema digestivo.","hashes":["2c2a87119b42134c2b8c1171a4f913f5c447012626e787ed95e48ff42c90fcd7"],"opciones":["Sí","No"]}]},{"id":"nutrient-absorption","nombre":"How Nutrients Get to Parts of the Body","explicacion":"<b>Del libro (literal):</b> We often think of the stomach as the organ that digests our food. But the stomach is involved in the digestion of only certain kinds of food. Most digestion takes place in the small intestine. In addition to the digestive juices produced by the intestine, the liver and the pancreas send chemicals to the small intestine to break down food. The small fingerlike structures on the inside of the small intestine are called <b>villi</b>. Capillaries line the walls of villi. Food that is completely digested is absorbed through the walls of the villi into the capillaries. The capillaries connect, or attach, with larger blood vessels that carry nutrients to all parts of the body.<br>Dato curioso del libro: en Japón, las personas tienen bacterias en el sistema digestivo que las ayudan a digerir el alga marina (seaweed) — bacterias que no se encuentran en personas de Norteamérica. Los científicos piensan que esas bacterias entraron a los intestinos japoneses a lo largo de muchas generaciones, por comer alga marina en muchas comidas.","microleccion":"Ejemplo con otro nutriente (no es una de las variantes): cuando comés arroz, una vez que llega al intestino delgado, los nutrientes del arroz ya digerido pasan a través de las paredes de las villi hacia los capilares. Esos capilares se conectan con vasos sanguíneos más grandes, que llevan esos nutrientes hasta, por ejemplo, los músculos de tus piernas.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"nut-v1","formato":"escribe","pregunta":"What are the small, fingerlike structures inside the small intestine called?","pista":"Empieza con 'vi'.","hashes":["3eef6fcd5c72730f8458a21ce1209369e31df15acb40d21a290a85316a551290"]},{"id":"nut-v2","formato":"mc","pregunta":"What lines the walls of the villi and absorbs digested food?","pista":"Son vasos sanguíneos muy pequeños.","hashes":["ec76880e86d774f80b42a2131a5a5eeb63997fa75b0e69264c60d815a8512229"],"opciones":["Muscles","Nerves","Capillaries","Bones"]},{"id":"nut-v3","formato":"verifica","pregunta":"¿Las villi se conectan con vasos sanguíneos más grandes que llevan nutrientes a todo el cuerpo?","pista":"Así es como los nutrientes viajan por todo el cuerpo.","hashes":["12b146e2808fc06f79d6cab9579f0a9ea4b71d557efa5e7d95743fbb7deb0295"],"opciones":["Sí","No"]},{"id":"nut-v4","formato":"porque","pregunta":"¿Por qué es importante que las villi absorban el alimento digerido hacia la sangre?","pista":"Piensa para qué sirven los nutrientes.","hashes":["0c4eb35757e300f8992bec937e0158ce7f792ca09a6844924f3366ed38c68438"],"opciones":["Porque así el estómago descansa","Porque así los nutrientes pueden viajar por la sangre a todas las partes del cuerpo","Porque así el alimento se vuelve más grande"]},{"id":"nut-v5","formato":"mc","pregunta":"According to the text, why do some people in Japan have bacteria that helps them digest seaweed?","pista":"Tiene que ver con lo que comen desde hace muchas generaciones.","hashes":["084898c00abedb16421730058f05a5b3baafb99d9202c859b53c6431ebc5fd80"],"opciones":["Because eating seaweed in many meals, over many generations, brought that bacteria into their intestines","Because Japan has no bacteria at all","Because they are born with different stomachs"]},{"id":"nut-v6","formato":"verifica","pregunta":"¿Todas las personas del mundo tienen exactamente las mismas bacterias digestivas?","pista":"El ejemplo de Japón muestra que no.","hashes":["fd5018f1aeb4dcfc89ccbbc74b8f639d9b101a2f97a55aed2eeff8fc3f37626b"],"opciones":["Sí","No"]},{"id":"nut-v7","formato":"mc","pregunta":"Besides the stomach, which two organs send chemicals to the small intestine to help break down food?","pista":"Son los dos órganos ayudantes que mandan químicos al intestino delgado.","hashes":["b57c958671d40b7dd1d4e91b92ebb81eb1c1a4ab655f8be438bc4e7de1b6d61b"],"opciones":["The lungs and the skin","The kidneys and the bladder","The liver and the pancreas"]}]},{"id":"excretory-organs","nombre":"Excretory System: Organs and Functions","explicacion":"<b>Del libro (literal):</b> Cells absorb nutrients from the blood, but in return they produce wastes. These wastes are removed from the body by the excretory system. Several organs help with this process. They include the lungs, the liver, and the skin, but mostly the kidneys, the bladder, and the urethra.<ul><li><b>Kidneys</b> — a pair of bean-shaped organs that filter wastes from the blood. As blood passes through the kidneys, capillaries remove these wastes. The wastes combine with water to form urine.</li><li><b>Ureters</b> — tubes that move urine from the kidneys to the bladder.</li><li><b>Bladder</b> — a muscular sac that stores urine until it is released from the body.</li><li><b>Urethra</b> — a small tube through which urine is released out of the body.</li></ul>","microleccion":"Ejemplo con otra idea (no es una de las variantes): pensá en los riñones como un filtro de agua para pecera. El filtro deja pasar el agua limpia y atrapa la suciedad. Los riñones hacen algo parecido con la sangre: la sangre entra sucia (con desechos), pasa por los riñones, y sale limpia — mientras que los desechos, mezclados con agua, se convierten en orina.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"exc-v1","formato":"mc","pregunta":"What is the main function of the excretory system?","pista":"Piensa en lo que hace el sistema con los desechos del cuerpo.","hashes":["08dd27c9be4bc2aad8ba25ffcf2423a7e7a04a2adc9934789db7d4fd7e81e0f1"],"opciones":["Remove wastes and extra water from the body to keep it healthy","Send messages through the body","Digest food into nutrients","Pump blood to the lungs"]},{"id":"exc-v2","formato":"escribe","pregunta":"What are the bean-shaped organs that filter wastes from the blood?","pista":"Tienen forma de frijol (bean-shaped).","hashes":["df1d4540b71dfa8fd4448426a688df31e93add2d599b7a1e181747f49b18d64f"]},{"id":"exc-v3","formato":"mc","pregunta":"What do the ureters do?","pista":"Son tubos que conectan dos órganos.","hashes":["8938a6aa252c9182808e7b60e748604ade2ac63c8ff8c1b862fa4785b021b61e"],"opciones":["Store urine","Release urine out of the body","Move urine from the kidneys to the bladder","Filter waste from the blood"]},{"id":"exc-v4","formato":"mc","pregunta":"Which organ is a muscular sac that stores urine?","pista":"Guarda la orina hasta que vas al baño.","hashes":["dc1e3033f74cb7fb53541084a002dc7628acc1be406b85e2d1ac76227e56ec12"],"opciones":["Kidney","Bladder","Urethra","Ureter"]},{"id":"exc-v5","formato":"escribe","pregunta":"What is the small tube through which urine is released out of the body?","pista":"Es la última parada del recorrido de la orina.","hashes":["dfaf7dfb26502c9255004e6240a84fab64fb3423e2cf49a4ba2bd0b6aede0945"]},{"id":"exc-v6","formato":"ordena","pregunta":"Ordená los pasos de cómo funciona la excreción:","pista":"Empezá por la sangre y terminá en la salida del cuerpo.","hashes":["924ae8550b209735ea209c7376bb394a5918ac728e7e9dc1a4324913a8612780"],"elementos":["Urine leaves through the urethra","The waste becomes urine","Blood passes through the kidneys, which clean it","Urine travels through the ureters to the bladder"]},{"id":"exc-v7","formato":"verifica","pregunta":"¿Los riñones combinan los desechos con agua para formar la orina (urine)?","pista":"Así se forma la orina dentro de los riñones.","hashes":["fb5231407858ab3b5435fa78a7ca289671ed80c2f47c87fbcb4b2552d06889da"],"opciones":["Sí","No"]},{"id":"exc-v8","formato":"empareja","pregunta":"Uní cada órgano con su función:","pista":"Seguí el camino de la orina desde que se forma hasta que sale.","hashes":["2ca85a75436120baa0c1afd9bcea9cc9398dd1ab711aa696831f22332335a385"],"izquierda":["Kidneys","Ureters","Bladder","Urethra"],"derecha":["Carries urine out of the body","Filter wastes from the blood","Carry urine from the kidneys to the bladder","Stores urine"]},{"id":"exc-v9","formato":"mc","pregunta":"Besides the kidneys, bladder, and urethra, which other organs also help remove waste from the body?","pista":"El texto dice que 'several organs help', no solo los principales.","hashes":["961462e965c4220063baee0c09989709d071a7e247e4cd1386923f4d133a61b7"],"opciones":["The stomach and the small intestine","The brain and the spinal cord","The lungs, the liver, and the skin"]},{"id":"exc-v10","formato":"porque","pregunta":"¿Por qué decimos que los riñones 'limpian' la sangre?","pista":"Piensa en lo que hacen las capilares dentro del riñón.","hashes":["d18d8cae16466f36dbd7dd90fa9922deac51319946a4e6bda432290516de98e1"],"opciones":["Porque filtran los desechos de la sangre y los convierten en orina","Porque almacenan la orina","Porque bombean la sangre por todo el cuerpo"]},{"id":"exc-v11","formato":"verifica","pregunta":"¿La orina se almacena en los riñones hasta que vas al baño?","pista":"La orina se almacena en otro órgano, no en los riñones.","hashes":["4a535d82a5a47b918e25d3baa3ae78b113335319e2915a8db99dc6037a221ff7"],"opciones":["Sí","No"]},{"id":"exc-v12","formato":"mc","pregunta":"What happens right after the kidneys filter the blood?","pista":"Es el paso justo después de filtrar la sangre.","hashes":["057e4558fcc8a638f87e965dc631860143689638d00f06d5360f35791b97aede"],"opciones":["The blood stops moving completely","The urine turns into food","The waste combines with water to form urine"]}]}]};

/* ---------- sha256 puro en JS (sin depender de crypto.subtle) ---------- */
function sha256hex(ascii){
function rr(v,c){return(v>>>c)|(v<<(32-c));}
var mw=Math.pow,ms=mw(2,32),i,j,result='';
var words=[],al=ascii.length*8;
var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
var isC={};
for(var cand=2;pc<64;cand++){
if(!isC[cand]){for(i=0;i<313;i+=cand){isC[i]=cand;}
hash[pc]=(mw(cand,.5)*ms)|0;k[pc++]=(mw(cand,1/3)*ms)|0;}}
ascii+='\x80';
while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;
words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=(al/ms)|0;words[words.length]=al;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16),oh=hash.slice(0,8);
for(i=16;i<64;i++){var w15=w[i-15],w2=w[i-2];
w[i]=((rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))+w[i-16])|0;}
for(i=0;i<64;i++){
var a=hash[0],e=hash[4];
var t1=(hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+w[i])|0;
var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.length=8;}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b>>4).toString(16))+((b&15).toString(16));}
return result;}
function utf8(s){return unescape(encodeURIComponent(s));}
function sha(s){return sha256hex(utf8(s));}

/* ---------- utilidades ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function normArma(s){return norm(s).replace(/\s+/g,'');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(id){return document.getElementById(id);}
function mezclarVista(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

var CLAVE='practica-'+DATOS.sal;
function guardarProgreso(){
  try{
    var t={};
    DATOS.temas.forEach(function(x){var s=estado.temas[x.id];t[x.id]={creditos:s.creditos,fallos:s.fallos,intentos:s.intentos,pistas:s.pistas,dominado:s.dominado,usadas:s.usadas,ultimoFormato:s.ultimoFormato,microVista:s.microVista,reforzado:s.reforzado,resumen:s.resumen||'',oraciones:s.oraciones||[]};});
    localStorage.setItem(CLAVE,JSON.stringify({orden:estado.orden,temas:t,respondidas:estado.respondidas,guardadas:estado.guardadas,rondas:estado.rondas,insignias:estado.insignias,dias:estado.dias,modosRepaso:estado.modosRepaso}));
  }catch(e){}
}
function cargarProgreso(){try{var s=localStorage.getItem(CLAVE);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ---------- lectura en voz alta ---------- */
var vozElegida=null;
function elegirVoz(){
  try{
    var voces=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang);});
    if(!voces.length)return null;
    function puntos(v){
      var n=v.name.toLowerCase(),p=0;
      if(n.indexOf('natural')>=0)p+=6;
      if(n.indexOf('neural')>=0)p+=6;
      if(n.indexOf('online')>=0)p+=3;
      if(n.indexOf('google')>=0)p+=4;
      if(/m[oó]nica|paulina|dalia|sabina|luciana|camila|jorge/.test(n))p+=2;
      var l=v.lang.toLowerCase();
      if(l.indexOf('es-us')===0||l.indexOf('es-419')===0||l.indexOf('es-mx')===0||l.indexOf('es-cr')===0)p+=2;
      return p;
    }
    voces.sort(function(a,b){return puntos(b)-puntos(a);});
    return voces[0];
  }catch(e){return null;}
}
try{speechSynthesis.addEventListener('voiceschanged',function(){vozElegida=elegirVoz();});}catch(e){}
function leerEnVoz(texto){
  try{
    var limpio=String(texto).replace(/<[^>]*>/g,' ')
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,' ')
      .replace(/[\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u2716\u2714]/g,' ')
      .replace(/→/g,', entonces, ')
      .replace(/\s+/g,' ').trim();
    if(!limpio)return;
    if(!vozElegida)vozElegida=elegirVoz();
    speechSynthesis.cancel();
    var frases=limpio.match(/[^.!?…]+[.!?…]*/g)||[limpio];
    frases.forEach(function(f){
      f=f.trim();
      if(!f)return;
      var u=new SpeechSynthesisUtterance(f);
      u.lang=(vozElegida&&vozElegida.lang)||'es-US';
      if(vozElegida)u.voice=vozElegida;
      u.rate=0.98;
      u.pitch=1.05;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

try{sonidoOn=localStorage.getItem('practica-sonido')!=='off';}catch(e){}
function tono(secuencia){
  if(!sonidoOn)return;
  try{
    var ctx=tono.ctx=tono.ctx||new (window.AudioContext||window.webkitAudioContext)();
    var t=ctx.currentTime;
    secuencia.forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t+p[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t+p[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+p[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+p[1]);o.stop(t+p[1]+p[2]+0.05);
    });
  }catch(e){}
}

/* ---------- selección de variantes ---------- */
function elegirVariante(tema,evitarFormato){
  var st=estado.temas[tema.id];
  if(DATOS.fiel){
    var sig=null;
    for(var k=0;k<tema.variantes.length;k++){if(st.usadas.indexOf(tema.variantes[k].id)<0){sig=tema.variantes[k];break;}}
    if(!sig)sig=tema.variantes[tema.variantes.length-1];
    if(st.usadas.indexOf(sig.id)<0)st.usadas.push(sig.id);
    st.ultimoFormato=sig.formato;
    return sig;
  }
  var cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0 && v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0;});
  if(!cand.length){st.usadas=[];cand=tema.variantes.slice();}
  var v=cand[Math.floor(Math.random()*cand.length)];
  if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);
  st.ultimoFormato=v.formato;
  return v;
}

/* ---------- planificador ---------- */
function insertarEncuentro(temaId,distancia){
  var pos=Math.min(estado.cola.length,distancia);
  estado.cola.splice(pos,0,temaId);
}
function siguiente(){
  if(!estado.cola.length){
    var pend=temasPendientes();
    if(!pend.length){mostrarFinal();return;}
    estado.orden.forEach(function(id){if(pend.some(function(t){return t.id===id;}))estado.cola.push(id);});
  }
  // evitar dos encuentros seguidos del mismo tema si hay alternativa
  if(!DATOS.fiel&&estado.actual&&estado.cola.length>1&&estado.cola[0]===estado.actual.temaId){
    estado.cola.push(estado.cola.shift());
  }
  var temaId=estado.cola.shift();
  var tema=temaPorId(temaId);
  if(estado.temas[temaId].dominado){siguiente();return;}
  var evitar=(estado.actual&&estado.actual.temaId===temaId)?estado.actual.variante.formato:estado.temas[temaId].ultimoFormato;
  var v=elegirVariante(tema,evitar);
  estado.actual={temaId:temaId,variante:v};
  pintarPregunta(tema,v);
}

      pintarOrden();
      el('btn-comprobar').addEventListener('click',function(){responder(tema,v,elems.map(norm).join('>'));});
      break;
    case 'empareja':
      el('btn-comprobar').addEventListener('click',function(){
        var sels=el('zona-respuesta').querySelectorAll('select');
        var partes=[],completo=true;
        sels.forEach(function(s){
          var i=parseInt(s.getAttribute('data-iz'),10);
          if(!s.value)completo=false;
          partes.push(norm(v.izquierda[i])+'>'+norm(s.value));
        });
        if(!completo){avisoCompletar();return;}
        responder(tema,v,partes.sort().join(';'));
      });
      break;
    case 'escribe':
      var inp=el('respuesta-texto');
      var enviarEscrita=function(){
        var val=inp.value.trim();
        if(!val){avisoCompletar();return;}
        responder(tema,v,norm(val));
      };
      el('btn-comprobar').addEventListener('click',enviarEscrita);
      inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarEscrita();});
      inp.focus();
      break;
    case 'oracion':
      var inpO=el('respuesta-texto');
      var enviarOracion=function(){
        var val=inpO.value.trim();
        if(!val){avisoCompletar();return;}
        var palabras=val.split(/\s+/);
        if(palabras.length<4){
          el('feedback').innerHTML='<div class="feedback fb-nube">Escribí una oración COMPLETA, de al menos 4 palabras 😊</div>';
          return;
        }
        var ok=palabras.some(function(p){
          var pn=norm(p).replace(/[^a-z0-9ñü]/g,'');
          return pn&&v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+pn))>=0;
        });
        estado.ultimaOracion=val;
        responder(tema,v,null,ok);
      };
      el('btn-comprobar').addEventListener('click',enviarOracion);
      inpO.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarOracion();});
      inpO.focus();
      break;
  }
}
function avisoCompletar(){
  el('feedback').innerHTML='<div class="feedback fb-nube">Te falta completar alguna parte 😊</div>';
}

/* ---------- respuesta ---------- */
function responder(tema,v,canonicaUsuario,okPrevio){
  var st=estado.temas[tema.id];
  st.intentos++;
  var ok=(okPrevio!==undefined&&canonicaUsuario===null)?okPrevio:(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+canonicaUsuario))>=0);
  if(ok&&v.formato==='oracion'&&estado.ultimaOracion){
    (st.oraciones=st.oraciones||[]).push(estado.ultimaOracion);
    estado.ultimaOracion=null;
  }
  estado.respondidas++;
  if(estado.fase==='repaso'){responderRepaso(tema,st,ok);return;}
  if(DATOS.fiel){
    if(ok){st.creditos++;sonidoBien();el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐</div>';}
    else{st.fallos++;sonidoSuave();el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Seguimos con la siguiente.</div>';}
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;if(st.fallos===0)celebrarDominio();}
    guardarProgreso();
    desactivarZona();
    setTimeout(function(){
      if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
      despuesDeResponder();
    },1400);
    return;
  }
  if(ok){
    st.creditos++;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;celebrarDominio();}
    else{insertarEncuentro(tema.id,3);} // vuelve más adelante: dominio en encuentros separados
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐ '+(st.dominado?'¡Planeta conquistado!':'Este tema volverá una vez más para asegurarlo.')+'</div>';
  }else{
    st.fallos++;
    insertarEncuentro(tema.id,2); // vuelve pronto, con otra variante de otro formato
    sonidoSuave();
    el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Este tema volverá más adelante con otra pregunta.</div>';
  }
  guardarProgreso();
  desactivarZona();
  setTimeout(function(){
    if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
    despuesDeResponder();
  },1400);
}
function desactivarZona(){
  el('zona-respuesta').querySelectorAll('button,select').forEach(function(x){x.disabled=true;});
  var bp=el('btn-pista');if(bp)bp.disabled=true;
  var bg=el('btn-guardar');if(bg)bg.disabled=true;
}
function despuesDeResponder(){
  if(estado.respondidas%6===0){estado.rondas++;pausaRonda();return;}
  siguiente();
}

/* ---------- fase de repaso final ---------- */
function tarjetasDeTema(t){
  var cartas=[];
  var exp=String(t.explicacion||'').trim();
  if(exp){
    if(exp.indexOf('<')>=0){cartas.push({frente:'Idea clave',dorso:exp,html:true});}
    else{
      var partes=exp.split('. ').map(function(p){p=p.trim();return p?(/[.!?:]$/.test(p)?p:p+'.'):'';}).filter(Boolean);
      var maxCartas=5,tam=Math.max(1,Math.ceil(partes.length/maxCartas));
      for(var i=0;i<partes.length;i+=tam){cartas.push({frente:'Idea '+(cartas.length+1),dorso:partes.slice(i,i+tam).join(' '),html:false});}
    }
  }
  cartas.push({frente:'⭐ Ejemplo paso a paso',dorso:t.microleccion,html:true});
  return cartas;
}
function graficoSvg(g){
  var h='';
  if(g.tipo==='barra'){
    var w=310,c=28,gap=2;
    h='<svg viewBox="0 0 '+w+' 36" style="max-width:340px;width:100%;display:block;margin:10px auto" role="img" aria-label="Barra dividida en 10 partes, '+g.pintadas+' pintadas">';
    for(var i=0;i<10;i++){
      h+='<rect x="'+(i*(c+gap)+2)+'" y="3" width="'+c+'" height="30" rx="4" fill="'+(i<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="2"/>';
    }
    h+='</svg>';
  }else{
    var cel=26,gp=2,tam=10*(cel+gp)+4;
    h='<svg viewBox="0 0 '+tam+' '+tam+'" style="max-width:300px;width:100%;display:block;margin:10px auto" role="img" aria-label="Cuadrícula de 100 partes, '+g.pintadas+' pintadas">';
    for(var f=0;f<10;f++)for(var col=0;col<10;col++){
      var idx=f*10+col;
      h+='<rect x="'+(col*(cel+gp)+2)+'" y="'+(f*(cel+gp)+2)+'" width="'+cel+'" height="'+cel+'" rx="3" fill="'+(idx<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="1.5"/>';
    }
    h+='</svg>';
  }
  return h;
}

function pintarRepaso(tema){

function modoTarjetas(cartas,alCompletar){
  var vistas=0;
  var h='<p class="suave">Tocá cada tarjeta para descubrir la idea.</p><div id="cartas-repaso">';
  cartas.forEach(function(c,i){
    h+='<div class="tarjeta-repaso" data-i="'+i+'"><div class="cara-frente">'+esc(c.frente)+' · tocá para ver 👆</div><div class="cara-dorso oculto"></div></div>';
  });
  h+='</div><p class="suave" id="contador-cartas">Tarjetas vistas: 0 de '+cartas.length+'</p>';
  el('zona-modo').innerHTML=h;
  document.querySelectorAll('.tarjeta-repaso').forEach(function(card){
    card.addEventListener('click',function(){
      if(card.classList.contains('vista'))return;
      var i=parseInt(card.getAttribute('data-i'),10);
      card.classList.add('girando');
      setTimeout(function(){
        card.querySelector('.cara-frente').classList.add('oculto');
        var dorso=card.querySelector('.cara-dorso');
        if(cartas[i].html)dorso.innerHTML=cartas[i].dorso;else dorso.textContent=cartas[i].dorso;
        dorso.classList.remove('oculto');
        card.classList.remove('girando');
        card.classList.add('vista');
        vistas++;

function preguntaRefuerzo(tema){
  var st=estado.temas[tema.id];
  // preferir formatos generativos (escribir/armar): recordar produciendo fija más la memoria
  var gen=tema.variantes.filter(function(x){return (x.formato==='escribe'||x.formato==='arma')&&st.usadas.indexOf(x.id)<0;});
  var v;
  if(gen.length){v=gen[Math.floor(Math.random()*gen.length)];if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);st.ultimoFormato=v.formato;}
  else{v=elegirVariante(tema,st.ultimoFormato);}
  estado.actual={temaId:tema.id,variante:v};
  pintarPregunta(tema,v);
}
function responderRepaso(tema,st,ok){
  desactivarZona();
  if(ok){
    st.reforzado=true;
    guardarProgreso();
    confeti();
    sonidoBien();
    otorgarInsignia('no-me-rindo');
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Eso es! 🌟 Tema reforzado.</div>';
    setTimeout(avanzarRepaso,1400);
  }else{
    st.fallos++;
    estado.refuerzoIntentos++;
    guardarProgreso();
    sonidoSuave();
    if(estado.refuerzoIntentos<2){
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Mirá el ejemplo otra vez y probá con otra pregunta.</div>';
      setTimeout(function(){
        mostrarOverlay('⭐ Ejemplo paso a paso','<div class="explicacion">'+tema.microleccion+'</div>','Probar otra vez',function(){preguntaRefuerzo(tema);});
      },1400);
    }else{
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no — este tema lo seguimos practicando otro día 💙</div>';
      setTimeout(avanzarRepaso,1400);
    }
  }
}
function avanzarRepaso(){
  estado.refuerzoIntentos=0;
  estado.repasoIdx++;
  if(estado.repasoIdx<estado.repasoLista.length){pintarRepaso(temaPorId(estado.repasoLista[estado.repasoIdx]));}
  else{informeFinal();}
}

/* ---------- informe final ---------- */
function mostrarFinal(){
  if(DATOS.fiel){informeFinal();return;}
  if(estado.fase==='normal'){
    var lista=DATOS.temas.filter(function(t){var st=estado.temas[t.id];return st.fallos>0||(st.intentos>0&&!st.dominado);}).map(function(t){return t.id;});
    if(lista.length){
      var h='<div class="carta" style="text-align:center"><h1>🔁 ¡Último paso!</h1>';
      h+='<p>Hubo '+lista.length+' tema'+(lista.length>1?'s':'')+' que costaron un poquito. Vamos a repasarlos con tarjetas y después demostrás lo aprendido.</p>';
      h+='<button class="btn-principal" id="btn-ir-repaso" style="margin-bottom:8px">¡Vamos al repaso! ✨</button>';
      h+='<button class="btn-sec" id="btn-saltar-repaso" style="width:100%">Ver el informe ya</button></div>';
      el('app').innerHTML=h;
      el('btn-ir-repaso').addEventListener('click',function(){estado.fase='repaso';estado.repasoLista=lista;estado.repasoIdx=0;estado.refuerzoIntentos=0;pintarRepaso(temaPorId(lista[0]));});
      el('btn-saltar-repaso').addEventListener('click',informeFinal);
      return;
    }
  }
  informeFinal();
}
function informeFinal(){
  confeti();
  var h='<div class="carta" style="text-align:center"><h1>¡Misión cumplida! 🌟</h1>';
  h+=mascota('¡Qué gran expedición! Practicaste <b>'+estado.respondidas+' preguntas</b>'+(estado.dias.length>1?' a lo largo de <b>'+estado.dias.length+' días</b> 📅':'')+'. Abajo dejé el reporte para tu persona adulta.');
  h+='</div>';
  var ids=Object.keys(estado.insignias).filter(function(k){return INSIGNIAS[k];});
  if(ids.length){
    h+='<div class="carta"><h2>🏅 Insignias ganadas</h2>';
    ids.forEach(function(k){var i=INSIGNIAS[k];h+='<p>'+i.emoji+' <b>'+esc(i.nombre)+'</b> — '+esc(i.desc)+'</p>';});
    h+='</div>';
  }
  h+='<div class="carta modo-adulto"><h2>Informe para la persona adulta</h2><table class="informe"><tr><th>Tema</th><th>Intentos</th><th>Pistas</th><th>Estado</th></tr>';
  var repasar=[];
  DATOS.temas.forEach(function(t){
    var st=estado.temas[t.id];
    var estadoTxt;
    if(DATOS.fiel){
      var nV=t.variantes.length;
      if(st.dominado)estadoTxt=(st.creditos===nV?'✅ ':'🔄 ')+st.creditos+' de '+nV+' correctas';
      else if(st.intentos)estadoTxt='⏳ En curso: '+st.creditos+' de '+nV+' correctas';
      else estadoTxt='⬜ Sin ver';
      if(st.fallos>0)repasar.push(t.nombre+' ('+st.fallos+' por revisar)');
      h+='<tr><td>'+esc(t.nombre)+'</td><td>'+st.intentos+'</td><td>'+st.pistas+'</td><td>'+estadoTxt+'</td></tr>';
      return;
    }
    if(st.dominado)estadoTxt='✅ Dominado'+(st.reforzado?' · 💪 reforzado':'');
    else if(st.reforzado)estadoTxt='💪 Reforzado en el repaso';
    else if(st.intentos)estadoTxt='🔄 Para seguir practicando';
    else estadoTxt='⬜ Sin ver';
    if((st.fallos>0&&!st.reforzado)||(!st.dominado&&!st.reforzado&&st.intentos>0))repasar.push(t.nombre);
    h+='<tr><td>'+esc(t.nombre)+'</td><td>'+st.intentos+'</td><td>'+st.pistas+'</td><td>'+estadoTxt+'</td></tr>';
  });
  h+='</table>';
  if(repasar.length)h+='<p style="margin-top:12px"><b>Qué conviene repasar:</b> '+repasar.map(esc).join(', ')+'.</p>';
  else h+='<p style="margin-top:12px"><b>'+(DATOS.fiel?'Toda la práctica quedó correcta.':'Todos los temas quedaron dominados.')+'</b> 🎉</p>';
  h+='</div>';
  var escritos=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
  if(escritos.length){
    h+='<div class="carta"><h2>✍️ Lo que escribió con sus palabras</h2>';
    escritos.forEach(function(t){h+='<p><b>'+esc(t.nombre)+':</b> «'+esc(estado.temas[t.id].resumen)+'»</p>';});
    h+='</div>';
  }
  var conOraciones=DATOS.temas.filter(function(t){return (estado.temas[t.id].oraciones||[]).length;});
  if(conOraciones.length){
    h+='<div class="carta modo-adulto"><h2>📝 Oraciones escritas — revisar concordancia y sentido</h2>';
    h+='<p class="suave">El motor verificó la conjugación exacta y la ortografía del verbo; el resto de la oración lo revisa usted.</p>';
    conOraciones.forEach(function(t){
      (estado.temas[t.id].oraciones||[]).forEach(function(o){h+='<p>• «'+esc(o)+'»</p>';});
    });
    h+='</div>';
  }
  h+='<div class="carta modo-adulto"><button class="btn-sec" style="width:100%;margin-bottom:8px" id="btn-copiar">📋 Copiar informe (para WhatsApp o correo)</button>';
  h+='<p class="suave">El progreso queda guardado en este dispositivo: al abrir de nuevo la práctica se puede continuar. "Empezar de cero" borra todo el avance.</p>';
  h+='<button class="btn-sec" style="width:100%" id="btn-reiniciar">🔄 Empezar de cero</button></div>';
  el('app').innerHTML=h;
  el('btn-copiar').addEventListener('click',function(){
    var lineas=['📚 '+DATOS.titulo,'Preguntas practicadas: '+estado.respondidas+(estado.dias.length>1?' en '+estado.dias.length+' días':''),''];
    DATOS.temas.forEach(function(t){
      var s=estado.temas[t.id];
      var est=DATOS.fiel?(s.creditos+' de '+t.variantes.length+' correctas'):(s.dominado?'✅ Dominado':(s.reforzado?'💪 Reforzado':(s.intentos?'🔄 Seguir practicando':'⬜ Sin ver')));
      lineas.push('• '+t.nombre+': '+est+' ('+s.intentos+' intentos, '+s.pistas+' pistas)');
    });
    var conResumen=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
    if(conResumen.length){
      lineas.push('','✍️ Con sus palabras:');
      conResumen.forEach(function(t){lineas.push('• '+t.nombre+': «'+estado.temas[t.id].resumen+'»');});
    }
    var conOr=DATOS.temas.filter(function(t){return (estado.temas[t.id].oraciones||[]).length;});
    if(conOr.length){
      lineas.push('','📝 Oraciones escritas (revisar concordancia):');
      conOr.forEach(function(t){(estado.temas[t.id].oraciones||[]).forEach(function(o){lineas.push('• «'+o+'»');});});
    }
    var ins=Object.keys(estado.insignias).filter(function(k){return INSIGNIAS[k];});
    if(ins.length)lineas.push('','🏅 Insignias: '+ins.map(function(k){return INSIGNIAS[k].emoji+' '+INSIGNIAS[k].nombre;}).join(', '));
    var texto=lineas.join('\n');
    try{
      navigator.clipboard.writeText(texto).then(function(){el('btn-copiar').textContent='¡Informe copiado! ✅';});
    }catch(e){el('btn-copiar').textContent='No se pudo copiar en este navegador';}
  });
  el('btn-reiniciar').addEventListener('click',function(){
    mostrarOverlay('🔄 Empezar de cero','<p>Se borrará todo el avance guardado y la práctica comenzará desde el principio. ¿Continuar?</p>','Sí, empezar de cero',function(){borrarProgreso();location.reload();});
  });
}

crearCielo();
pintarInicio();
</script>
</body>
</html>
