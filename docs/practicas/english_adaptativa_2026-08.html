:root{
  --cielo1:#1B1464;--cielo2:#4A1E9E;--carta:#FFFFFF;--tinta:#2D2A5E;--tintaSuave:#6B6899;
  --sol:#FFB703;--solOscuro:#D89400;--menta:#06D6A0;--mentaOscuro:#04A87E;
  --nube:#FFD166;--nubeOscuro:#E0B04A;--cielitoBtn:#8ECAE6;--cielitoOscuro:#5FA8CC;
  --lila:#9B5DE5;--moradoTitulo:#3A1D8A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Andika','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  color:var(--tinta);min-height:100vh;overflow-x:hidden;
  font-size:17px;line-height:1.6;letter-spacing:.01em;
  background:linear-gradient(160deg,var(--cielo1) 0%,var(--cielo2) 55%,#7B2FBE 100%);
  background-attachment:fixed}
.estrella{position:fixed;color:#FFF;pointer-events:none;z-index:0;animation:titilar 3s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.contenedor{max-width:640px;margin:0 auto;padding:14px;position:relative;z-index:1}
.carta{background:var(--carta);border-radius:22px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(20,10,60,.35);animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{font-size:1.55rem;margin:.2em 0;color:var(--moradoTitulo);letter-spacing:.3px}
h2{font-size:1.15rem;color:var(--moradoTitulo);margin:.3em 0 .5em}
.suave{color:var(--tintaSuave);font-size:.92rem}
button{font-family:inherit;font-size:1.02rem;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;font-weight:700}
button:active{transform:translateY(4px)}
.btn-principal{background:var(--sol);color:#4A2500;width:100%;font-size:1.12rem;font-weight:800;
  box-shadow:0 5px 0 var(--solOscuro)}
.btn-principal:active{box-shadow:0 1px 0 var(--solOscuro)}
.btn-sec{background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 4px 0 var(--cielitoOscuro)}
.btn-sec:active{box-shadow:0 1px 0 var(--cielitoOscuro)}
.btn-opcion{display:block;width:100%;text-align:left;background:#F5F3FF;color:var(--tinta);
  margin:9px 0;border:3px solid #E4DEFF;font-weight:600;box-shadow:0 3px 0 #E4DEFF}
.btn-opcion:hover{border-color:var(--lila);transform:translateY(-2px)}
.btn-opcion:active{transform:translateY(2px)}
.ficha{display:inline-block;background:#FFF4D6;border:3px solid var(--sol);color:#7A4E00;font-weight:800;
  margin:4px;padding:11px 15px;border-radius:14px;box-shadow:0 3px 0 var(--solOscuro)}
.ficha:active{transform:translateY(3px);box-shadow:none}
.zona-construccion{min-height:56px;background:#F5F3FF;border:3px dashed #C9BEF5;border-radius:16px;padding:8px;margin:10px 0}
.ruta-planetas{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.14);border-radius:99px;padding:8px 12px;margin-bottom:10px}
.planeta{font-size:1.45rem;filter:grayscale(1) opacity(.45);transition:filter .4s,transform .4s}
.planeta.dominado{filter:none;transform:scale(1.18);text-shadow:0 0 14px #FFD166}
.cohete{font-size:1.5rem;animation:flotar 2.6s ease-in-out infinite}

.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:rgba(255,255,255,.18);color:#FFF;border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:700}

.mascota{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}

.fila-orden button{padding:7px 12px;background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 3px 0 var(--cielitoOscuro)}

.modo-adulto{font-family:system-ui,'Segoe UI',Arial,sans-serif}
.explicacion{background:#F5F3FF;border-left:5px solid var(--lila);padding:13px 15px;border-radius:10px;margin:12px 0;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch}
.progreso{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:8px 0}

.tarjeta-repaso .cara-frente{background:linear-gradient(135deg,var(--lila),#7B2FBE);color:#fff;font-weight:800;padding:17px;text-align:center;border-radius:16px;box-shadow:0 4px 0 #5B1E96}
.tarjeta-repaso .cara-dorso{background:#F5F3FF;border:3px solid var(--lila);border-radius:16px;padding:15px;font-size:1rem;line-height:1.7;letter-spacing:.015em}

.respuesta-escrita:focus{outline:none;border-color:var(--sol)}

.esquema{background:#F5F3FF;border-radius:16px;padding:12px}
.nodo-centro{background:linear-gradient(135deg,var(--moradoTitulo),var(--lila));color:#fff;font-weight:800;text-align:center;border-radius:99px;padding:11px 16px;margin-bottom:10px;box-shadow:0 4px 0 #2A1266}
.ramas{display:grid;grid-template-columns:1fr;gap:12px}
.rama{border-left:6px solid var(--lila);background:#fff;border-radius:0 14px 14px 0;padding:13px 16px;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch;box-shadow:0 2px 8px rgba(20,10,60,.08)}
.rama b{color:var(--moradoTitulo);display:block;margin-bottom:6px}
.rama-estrella{border-left-color:var(--sol);background:#FFF9E8}
.toast-insignia{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFF4D6,#FFE39A);border:3px solid var(--sol);color:#7A4E00;font-weight:800;border-radius:99px;padding:11px 19px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastIn .35s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.confeti{position:fixed;top:-14px;width:10px;height:14px;z-index:55;border-radius:3px;animation:caerConfeti linear forwards}
@keyframes caerConfeti{to{transform:translateY(105vh) rotate(540deg)}}
.pulso{animation:pulsar 1.6s ease-in-out infinite}
@keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

var DATOS = {"titulo":"Práctica de Inglés — Repaso completo (Quiz #1: The Mariana Trench, gramática y vocabulario)","materia":"English","sal":"32a2f1c200e49e9d96983b59","creditosNecesarios":2,"fiel":false,"voz":true,"temas":[{"id":"vocabulario","nombre":"Vocabulary: The Mariana Trench","explicacion":"<b>Definitions from the book:</b><ul><li><b>trench</b> — A trench is a long, narrow groove or ditch.</li><li><b>summit</b> — The summit of a mountain is its top or highest point.</li><li><b>thrive</b> — When living things thrive, they grow well and are healthy.</li><li><b>prehistoric</b> — Something that is prehistoric is very old, from a time before history was recorded.</li><li><b>vital</b> — If something is vital, it is needed or very important.</li><li><b>glimpse</b> — A glimpse is a very quick look at something.</li><li><b>submersible</b> — If something is submersible, it can go or work under water.</li><li><b>remotely</b> — If you use something remotely, you control it from a distance.</li><li><b>autonomous</b> — If something is autonomous, it controls itself.</li></ul>","microleccion":"Ejemplo con otra palabra (no es una de la lista): la palabra <b>extinct</b> aparece en la oración 'Scientists say the giant shark called Megalodon is extinct — none are alive today.' Para entender su significado, me fijo en las pistas del contexto: dice que 'ninguno está vivo hoy'. Eso me dice que <b>extinct</b> significa que un tipo de ser vivo ya no existe en ningún lugar de la Tierra. Así se usan las pistas de contexto para descubrir el significado de una palabra nueva, igual que con las 9 palabras de esta práctica.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"voc-v1","formato":"mc","pregunta":"Some scientists study ______ animals that lived millions of years ago.","pista":"Es la palabra que significa 'muy viejo, de antes de que se registrara la historia'.","hashes":["584143af3344b6af7d7ae210fce5f5cfc9bf7056a7b0a3d05c325e66a4fca70b"],"opciones":["prehistoric","vital","remotely","autonomous"]},{"id":"voc-v2","formato":"mc","pregunta":"The mountain climbers finally reached the ______ after many hours of climbing.","pista":"Es la parte más alta de una montaña.","hashes":["b8a664d01413784da81ce114581c30ab35b5046462eb3d13b2e2e1516c431041"],"opciones":["summit","thrive","trench","glimpse"]},{"id":"voc-v3","formato":"mc","pregunta":"A ______ is a special vehicle that can travel deep under the ocean.","pista":"Puede ir o trabajar bajo el agua.","hashes":["504dc183301f1cacaa72644253800076dfacb10e1e13becb5760e94daff5a083"],"opciones":["submersible","summit","trench","glimpse"]},{"id":"voc-v4","formato":"mc","pregunta":"An ______ robot can work without a person controlling it all the time.","pista":"Si algo es esto, se controla a sí mismo.","hashes":["e29b70d0a69247281a9ca7215b8999d4482d6fa0f42c930d6c694d75c7120105"],"opciones":["vital","submersible","remotely","autonomous"]},{"id":"voc-v5","formato":"escribe","pregunta":"Escribí en inglés la palabra: cuando los seres vivos crecen bien y están sanos, decimos que ______ (ej.: 'Plants need sunlight and water to ______.').","pista":"Empieza con 'th'.","hashes":["050595286f74f663f7de8680772f1594aa81c59b7098a763963e3e35a6fdde93"]},{"id":"voc-v6","formato":"escribe","pregunta":"Escribí en inglés la palabra: una mirada muy rápida a algo (ej.: 'I had a quick ______ of a dolphin before it disappeared.').","pista":"Empieza con 'gl'.","hashes":["95a56e087c7e763dbda21866854c8be0ffa020f6b0a43ffd0c899b77d3682144"]},{"id":"voc-v7","formato":"escribe","pregunta":"Escribí en inglés la palabra: muy viejo, de una época antes de que se registrara la historia.","pista":"Empieza con 'pre'.","hashes":["29fb2f28ad7b90ff631238e0e7e34e7e74c3f8eeedbe8fcfc8d970dbf184d774"]},{"id":"voc-v8","formato":"verifica","pregunta":"¿'Autonomous' significa que un robot necesita que una persona lo controle todo el tiempo?","pista":"Autonomous significa lo opuesto: se controla a sí mismo.","hashes":["22aa539b31bf037530b63be6e4d66ff6c9ce1bebdac188e655582b80903bc1fb"],"opciones":["Sí","No"]},{"id":"voc-v9","formato":"verifica","pregunta":"¿'Vital' significa que algo es necesario o muy importante?","pista":"Food and water are vital for people to live.","hashes":["a03a9ff799ba7cf93c2bd82bd81c65b9449782ce99812b4f07df6061bec263b6"],"opciones":["Sí","No"]},{"id":"voc-v10","formato":"verifica","pregunta":"¿'Remotely' significa que controlás algo estando cerca, tocándolo con las manos?","pista":"Remotely = a distancia, no de cerca.","hashes":["b6c1ea3d738c5e9b5b73c9993ae99cca3c27441eabe63454d7de8f7a069a3807"],"opciones":["Sí","No"]},{"id":"voc-v11","formato":"empareja","pregunta":"Uní cada palabra con su definición:","pista":"Pensá en el mapa: la fosa (trench) es como una zanja larga en el fondo del mar.","hashes":["0b69bac3c6297d05b88ccab2b83578e8e79a6f133748dfcf553bb8b07241c3f4"],"izquierda":["trench","summit","thrive","glimpse"],"derecha":["To grow well and be healthy","A long, narrow groove or ditch","The top or highest point of a mountain","A very quick look at something"]},{"id":"voc-v12","formato":"empareja","pregunta":"Uní cada palabra con su definición:","pista":"Un ROV se controla remotely; un AUV es autonomous.","hashes":["f2c9c504a99aba5c54cd891a4ce358ca96fdc6f91ada9c4ae60e58a070653429"],"izquierda":["submersible","remotely","autonomous","prehistoric"],"derecha":["Very old, from before history was recorded","Something that can go or work under water","Something that controls itself","Controlling something from a distance"]},{"id":"voc-v13","formato":"clasifica","pregunta":"Clasificá cada palabra según de qué habla más:","pista":"Las palabras de tecnología describen cómo funcionan los vehículos que exploran el océano.","hashes":["8276c9cc823902dbe215536e75ceb6dab4e49136fd172930fadcaed7fea09fc3"],"categorias":["Sobre lugares y seres vivos","Sobre máquinas y tecnología"],"elementos":["submersible","autonomous","remotely","summit","trench","prehistoric"]},{"id":"voc-v14","formato":"porque","pregunta":"El ROV Kaiko explora la fosa de las Marianas controlado por cables desde un barco en la superficie. ¿Por qué decimos que trabaja 'remotely'?","pista":"Remotely = a distancia, desde otro lugar.","hashes":["3bee9997beb54dca4183fcbbf849171393abd87adb0e6766d262458a8ab20bc1"],"opciones":["Porque vive siempre dentro del barco","Porque nadie lo controla, funciona completamente solo","Porque los científicos lo controlan a distancia, sin tocarlo directamente"]}]},{"id":"comprension-mariana-trench","nombre":"Reading Comprehension: The Mariana Trench","explicacion":"Texto literal del libro (Into Reading, 'Marvels of Nature: The Mariana Trench'): 'Many people know that the highest point on Earth is at the top of Mount Everest. That famous peak towers 29,035 feet (8,850 m) above sea level. It is in the Himalaya Mountains, near the border of China and Nepal. But how many people can name the lowest place in the world? That point is at the bottom of the Mariana Trench, a valley in the floor of the Pacific Ocean. The trench lies just east of the Mariana Islands, southeast of China and Japan.' 'Inside that groove in the ocean floor is the Challenger Deep, the deepest spot in the world. It lies 210 miles (338 km) from the island of Guam. It is about 36,000 feet (11,000 m) below sea level—almost 7 miles (11 km) deep. If Mount Everest were placed in the Challenger Deep, the mountain's peak would still be under 7,000 feet (2,134 m) of water.' 'But no human, not even an expert diver, could survive the environment of the Challenger Deep. In this pitch-black world, the temperature is about 36°F (2°C). The human body shuts down quickly in water that cold. A person on the ocean floor also would be crushed by the weight of the water.' 'Anglerfish have bioluminescent, built-in fishing poles... The anglerfish waves it to attract other fish. When a fish approaches, the angler snaps up the prey.' 'The Mariana Trench is so deep because of movement in Earth's surface... At the Mariana Trench, a heavy plate of rock on the ocean floor is pressing against a plate of lighter rock... the heavier ocean plate plunges downward at a steep angle into Earth's mantle.' 'The Mariana Trench was discovered in 1875. Scientists on the British ship HMS Challenger used a machine to measure the ocean depth...' 'In 1951 the British Royal Navy vessel HMS Challenger II returned to the area with a modern measuring device... called echo sounding, or sonar... The deepest point it found was 35,760 feet (10,900 m). That point was named the Challenger Deep, after the ship.' 'People got their first glimpse of the Challenger Deep in 1960. That year scientist Jacques Piccard and U.S. Navy Lieutenant Don Walsh traveled to the bottom. They rode in the Trieste, a submersible vehicle... It was 35,813 feet (10,916 m) below the surface.' 'After this exploration, there were only two unmanned submarines that visited the Challenger Deep until March 25, 2012. That was when filmmaker James Cameron reached the bottom in the Deepsea Challenger.' 'In May 2019, businessman Victor Vescovo reached the bottom of the Challenger Deep in a submarine called DSV Limiting Factor.' 'Navy submarines patrolling the world's oceans like to stay in deep water. It is more difficult for enemies to detect them there... the Mariana Trench Marine National Monument was established [in 2009]. It protects the Mariana Islands, the Trench, and the underwater volcanoes.'","microleccion":"Ejemplo con otro dato del texto (no es una de las preguntas): el texto dice 'The trench averages about 45 miles (72 km) wide. A person walking at a brisk pace would need about ten hours to go from one side to the other.' Para responder una pregunta como '¿cuánto mide de ancho la fosa?', busco la oración exacta del texto que tiene ese dato: 'about 45 miles (72 km) wide' — esa es la respuesta, tomada directamente de lo que dice el libro, no inventada.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"comp-v1","formato":"mc","pregunta":"Where is the Mariana Trench located?","pista":"Es un valle en el fondo del mismo océano donde están Japón y Filipinas.","hashes":["7ce8555dfaaca1a301e9d8d74aa488036579fdcdf4df91cccc82cdacc3aad34c"],"opciones":["In the Arctic Ocean","In the Himalaya Mountains","In the Atlantic Ocean, near Puerto Rico","In the Pacific Ocean, east of the Mariana Islands"]},{"id":"comp-v2","formato":"mc","pregunta":"What is the deepest point of the Mariana Trench called?","pista":"Se llama así por el barco que lo descubrió.","hashes":["8a7fe11a63e2069b63d1376eaa54fe6dd70260dc8453b357a885b09eabbdcd30"],"opciones":["The Challenger Deep","The Everest Summit","Guam Deep","The Trieste Point"]},{"id":"comp-v3","formato":"escribe","pregunta":"Escribí, solo con el número (sin comas ni palabras), cuántos pies (feet) bajo el nivel del mar está el Challenger Deep, aproximadamente.","pista":"El texto dice 'about ___ feet below sea level—almost 7 miles deep'.","hashes":["93de5907606dbb4f4a7718bc6610103f0bf5eb65fc03c5a9c8397e7b046d6dd9"]},{"id":"comp-v4","formato":"verifica","pregunta":"¿Una persona podría sobrevivir en el Challenger Deep sin un submarino especial, igual que en la cima del Everest?","pista":"El agua está helada y la presión aplastaría a una persona.","hashes":["417427a24105d819494000287fbb181aa64c253e7b86a038d8a6db63592a11cf"],"opciones":["Sí","No"]},{"id":"comp-v5","formato":"mc","pregunta":"What do anglerfish use to attract their prey?","pista":"Es bioluminiscente, como una linterna que crece de su cabeza.","hashes":["c282ed73c254a72c3d2fb1f49e388f3c4e115078fdf218cb0e381cb44167cf3c"],"opciones":["Bright colored scales","A glowing, built-in fishing pole","A loud sound","Sharp claws"]},{"id":"comp-v6","formato":"empareja","pregunta":"Uní cada explorador (o barco) con su vehículo o método:","pista":"Cada explorador usó un vehículo distinto para bajar al Challenger Deep.","hashes":["f66f04651494b62cf143411ba2c5fe21b5992d4e05f35035754b0585b8f7b0e7"],"izquierda":["Jacques Piccard and Don Walsh (1960)","James Cameron (2012)","Victor Vescovo (2019)","HMS Challenger II (1951)"],"derecha":["the Deepsea Challenger","the DSV Limiting Factor","echo sounding (sonar)","the Trieste"]},{"id":"comp-v7","formato":"ordena","pregunta":"Ordená estos hechos del más antiguo al más reciente:","pista":"Pensá en los años: 1875 es el más viejo.","hashes":["29c80489b8c84ef4656c2aeee70dd546b1fb19f9741b8461569461b0d84a2dc7"],"elementos":["2012 — James Cameron reaches the bottom in the Deepsea Challenger","2019 — Victor Vescovo reaches the bottom in the DSV Limiting Factor","1951 — HMS Challenger II measures the Challenger Deep using sonar","1960 — Piccard and Walsh reach the bottom in the Trieste","1875 — The Mariana Trench is discovered by the HMS Challenger"]},{"id":"comp-v8","formato":"mc","pregunta":"Why can't humans survive at the bottom of the Challenger Deep without a submersible?","pista":"Son tres condiciones distintas, todas muy duras para el cuerpo humano.","hashes":["a4190168ff07d8246e09de371c7c0bf9c07d8c7f12d54d3ccf5ae481affbd3f2"],"opciones":["Because there are dangerous sharks everywhere","Because there is no water there","Because of the extreme cold, total darkness, and crushing water pressure","Because it is too hot"]},{"id":"comp-v9","formato":"clasifica","pregunta":"Clasificá cada dato según de cuál lugar habla:","pista":"Uno está muy arriba en el cielo; el otro muy abajo en el mar.","hashes":["5af2cf0d4420cecd72e068c9ba7f3ef467a19cb4437be3c408fb888370acf75b"],"categorias":["Mount Everest","The Mariana Trench / Challenger Deep"],"elementos":["Near the border of China and Nepal","Lies east of the Mariana Islands","Is in the Himalaya Mountains","29,035 feet above sea level","Home of the Challenger Deep","About 36,000 feet below sea level"]},{"id":"comp-v10","formato":"mc","pregunta":"What causes the Mariana Trench to be so deep?","pista":"Tiene que ver con el movimiento de las placas de la Tierra.","hashes":["94d2b86cac452540ed70ebe85eea97cd5424792d6c75fda71d07d305c43a07a9"],"opciones":["Ships dug a long tunnel over many years","A volcano exploded and left a big hole","A heavy ocean plate plunges downward into Earth's mantle","An earthquake split the ocean floor in half"]},{"id":"comp-v11","formato":"escribe","pregunta":"Escribí el año en que se estableció el Mariana Trench Marine National Monument.","pista":"Fue antes de que James Cameron llegara al fondo en 2012.","hashes":["404f48edc0932a9226fe024f697b3189e859fbde0e9d99a37ab4d6feaae530cd"]},{"id":"comp-v12","formato":"verifica","pregunta":"¿Los submarinos de la marina usan la fosa de las Marianas como una especie de ruta de norte a sur en el océano Pacífico?","pista":"El agua profunda los esconde mejor de sus enemigos.","hashes":["05e40e7ac41645e852a4169f647975293ea72d7be1ae0510f373aebd4848b81e"],"opciones":["Sí","No"]},{"id":"comp-v13","formato":"porque","pregunta":"¿Por qué los submarinos de la marina prefieren viajar por aguas profundas como la fosa de las Marianas?","pista":"Piensa en por qué un submarino querría esconderse.","hashes":["500f5a3db9931d538cda073ca6f4c6b19e2e1f38c2b62462eb2d8489889ad970"],"opciones":["Porque ahí hay más peces para comer","Porque es más difícil para los enemigos detectarlos ahí","Porque el agua profunda es más cálida"]},{"id":"comp-v14","formato":"mc","pregunta":"What is the flashlight fish able to do?","pista":"Es bioluminiscente, como el anglerfish.","hashes":["819cf39f423aae1362a6845a69fc1211239e8dda819bd32125c1f1e5196404eb"],"opciones":["Breathe air like a whale","Change the color of the whole ocean","Turn its glowing light on and off to attract curious fish","Fly out of the water"]}]},{"id":"possessive-nouns","nombre":"Possessive Nouns (singular and plural)","explicacion":"<b>Regla general de sustantivos posesivos:</b><ul><li>Sustantivo <b>singular</b>: agregá <b>'s</b> (an apostrophe + s). Ej.: <i>the book of my brother</i> → <b>my brother's book</b>.</li><li>Sustantivo <b>plural regular</b> que YA termina en <b>-s</b>: agregá solo un <b>apóstrofe (')</b>, sin otra s. Ej.: <i>the nuts of the squirrels</i> → <b>the squirrels' nuts</b>.</li><li>Sustantivo <b>plural irregular</b> que NO termina en -s (como <i>women, children, men</i>): agregá <b>'s</b>, igual que un singular. Ej.: <i>the purses of the women</i> → <b>the women's purses</b>.</li><li>Nombres propios (como <i>Michael</i>): agregá <b>'s</b>. Ej.: <i>the lunch of Michael</i> → <b>Michael's lunch</b>.</li></ul>","microleccion":"Ejemplo con otros sustantivos (no son los de las variantes): 'the hat of the man' → man es singular, entonces agrego 's: <b>the man's hat</b>. 'the toys of the dogs' → dogs es plural regular que ya termina en -s, entonces agrego solo el apóstrofe: <b>the dogs' toys</b>. 'the shoes of the men' → men es plural irregular (no termina en -s), entonces agrego 's, igual que un singular: <b>the men's shoes</b>.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"pos-v1","formato":"mc","pregunta":"Which is the correct possessive form of 'the book of my brother'?","pista":"'Brother' es singular: agregá 's.","hashes":["40fd0cfeab29b2b9c179fca1105933bfc56a50000fa8c921e6f6787659552ba3"],"opciones":["my brother's books","my brothers' book","my brothers book","my brother's book"]},{"id":"pos-v2","formato":"escribe","pregunta":"Rewrite in possessive form: 'the lunch of Michael'.","pista":"Michael es un nombre propio singular: agregá 's.","hashes":["373b121150877e406557f265184ea1f466970987048643ed6f49cebd86235297"]},{"id":"pos-v3","formato":"escribe","pregunta":"Rewrite in possessive form: 'the pens of my sisters'.","pista":"'Sisters' ya es plural y termina en -s: agregá solo el apóstrofe.","hashes":["34db624e3aa770e121b2b1676609d0973f53e5e5ab3db694861be2dab748a9c3"]},{"id":"pos-v4","formato":"mc","pregunta":"Which is the correct possessive form of 'the nuts of the squirrels'?","pista":"'Squirrels' es plural regular: solo el apóstrofe al final.","hashes":["42c5e5583d15c1285072a29bd4d9dc3e15cb61246851facdbb02fb42afbd93b1"],"opciones":["the squirrels' nuts","the squirrels's nuts","the squirrel nuts'","the squirrel's nuts"]},{"id":"pos-v5","formato":"mc","pregunta":"Which is the correct possessive form of 'the purses of the women'?","pista":"'Women' es un plural irregular que NO termina en -s: agregá 's.","hashes":["92e63036d37f76effeebdba546ae420ec6e0fdd66c1364c4c64feda9b61d2558"],"opciones":["the womens purses","the womens' purses","the woman's purses","the women's purses"]},{"id":"pos-v6","formato":"verifica","pregunta":"¿Para un sustantivo plural regular que ya termina en -s (como 'cats'), se agrega solo un apóstrofe (') al final, sin otra 's'?","pista":"'The cats' toys', no 'the cats's toys'.","hashes":["f6517fc78aaa4d860a9d5654a13edc3dffd440ea91df041fb69024d934bdc247"],"opciones":["Sí","No"]},{"id":"pos-v7","formato":"verifica","pregunta":"¿Para un sustantivo plural irregular que NO termina en -s (como 'children' o 'women'), se agrega solo un apóstrofe sin la 's'?","pista":"Los plurales irregulares se comportan como singulares: llevan 's completo.","hashes":["307ecd4150603d7bcdb2020c8fa594833162c8f7987f4492e0eed92aef523cd5"],"opciones":["Sí","No"]},{"id":"pos-v8","formato":"clasifica","pregunta":"Clasificá cada frase posesiva según sea singular o plural:","pista":"'Children' es plural irregular, pero la frase 'children's' sigue siendo posesivo PLURAL (de varios niños).","hashes":["41c4d78ef10ee5b2633a9b8bf0eee8e1d7ddcf9d209ef231d26dc04d0b724462"],"categorias":["Singular possessive","Plural possessive"],"elementos":["the dogs' bones","the children's toys","the dog's bone","the teachers' desks","the child's toy","the teacher's desk"]},{"id":"pos-v9","formato":"escribe","pregunta":"Rewrite in possessive form: 'the toys of the children'.","pista":"'Children' es plural irregular (no termina en -s): agregá 's.","hashes":["55475ca583be1fbb15d9b57a686159cc27ad1fb636ebb120c26dc7559ce02713"]},{"id":"pos-v10","formato":"porque","pregunta":"¿Por qué 'the girls' shoes' NO lleva otra 's' después del apóstrofe?","pista":"Repasá la regla de plurales regulares que terminan en -s.","hashes":["ebca982f54f914d80a687de88ef221fe26eccb923077420930cbb9b83b6105dd"],"opciones":["Porque 'shoes' es la palabra más importante","Porque 'girls' ya es un plural regular que termina en -s","Porque los apóstrofes nunca llevan 's' en inglés"]}]},{"id":"tipos-de-verbos","nombre":"Types of Verbs","explicacion":"<b>Del cuadernillo de gramática (literal):</b><ul><li>A <b>verb</b> tells what the subject does. A verb can include more than one word: a <b>main verb</b> and a <b>helping verb</b> (ej.: <i>can come, has baked, am walking</i>).</li><li>An <b>action verb</b> tells what the subject does, did, or will do, en pasado, presente o futuro (ej.: <i>Tameka ran. Ali gives. Sarah will drink.</i>).</li><li>The <b>main verb</b> tells what the subject does or is (ej.: <i>She washes the dog</i>). A <b>helping verb</b> helps the main verb tell about an action or make a statement (ej.: <i>She is washing the dog</i>).</li><li>Helping verbs como <i>have, has, had, is, am, are, was, were, will</i> muestran tiempo presente, pasado o futuro. Algunos helping verbs como <i>can, may, must</i> NO muestran tiempo.</li><li>A <b>linking verb</b> no muestra acción: conecta el sujeto con un sustantivo o adjetivo (ej.: <i>My dog is smelly</i>). Suelen ser formas de <i>be</i> (am, is, are, was, were), o también <i>look, seem, appear, become, feel, grow, smell, taste</i>.</li></ul>","microleccion":"Ejemplo con otra oración (no es una de las variantes): 'The pizza tastes amazing.' El verbo 'tastes' no muestra una acción física; conecta 'the pizza' con el adjetivo 'amazing'. Por eso es un <b>linking verb</b>. En cambio, en 'They were running fast', 'running' es el <b>main verb</b> (la acción) y 'were' es el <b>helping verb</b> que ayuda a formar el tiempo pasado progresivo.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"tv-v1","formato":"mc","pregunta":"The dress looks beautiful. What type of verb is 'looks'?","pista":"No hay ninguna acción física; conecta 'dress' con 'beautiful'.","hashes":["d93865fd5791e8aac4dbc8149fcf7f981383a8c006a7a9728d6af82b3aea1e0a"],"opciones":["linking verb","main verb","action verb","helping verb"]},{"id":"tv-v2","formato":"mc","pregunta":"He is cleaning the house. What type of verb is 'cleaning'?","pista":"'Is' ayuda; 'cleaning' es la acción principal.","hashes":["524d7cfd7aa6dee78cc0d1757820f6ec49da9f0e143260078fe1e7906291ba55"],"opciones":["linking verb","main verb","no es un verbo","helping verb"]},{"id":"tv-v3","formato":"mc","pregunta":"John jumps very high. What type of verb is 'jumps'?","pista":"Muestra algo que John hace.","hashes":["82175df3c23de516e57720592e56f30123d72f9520dab5db3f5997b40de46683"],"opciones":["action verb","helping verb","linking verb","main verb solamente, nunca action"]},{"id":"tv-v4","formato":"mc","pregunta":"She was sleeping. What type of verb is 'was'?","pista":"Ayuda al verbo principal 'sleeping' a formar el tiempo pasado.","hashes":["f206e49018861366471abef34f0fa2e28eebad1a196e231b4a34718b62b370b0"],"opciones":["helping verb","linking verb","action verb","main verb"]},{"id":"tv-v5","formato":"verifica","pregunta":"¿Un linking verb muestra una acción física?","pista":"Conecta el sujeto con un sustantivo o adjetivo, no muestra acción.","hashes":["8ba8c140210f6a856225e0adfe0910ce998bb4fcf6cee315373d9e3dbf5beddc"],"opciones":["Sí","No"]},{"id":"tv-v6","formato":"verifica","pregunta":"¿'Can', 'may' y 'must' son helping verbs que SÍ muestran si la acción es pasado, presente o futuro?","pista":"Esos tres helping verbs NO muestran tiempo.","hashes":["7ce67fff123cacb2f45af4cc96dc957f5339d4066da7e789ff69bba3efe83d89"],"opciones":["Sí","No"]},{"id":"tv-v7","formato":"clasifica","pregunta":"Clasificá cada verbo subrayado según sea 'helping verb' o 'main verb' en su oración:","pista":"El helping verb va primero; el main verb dice la acción real.","hashes":["234f61592213b3bfd08e0b2d4f3f640c0dac5572025db760813219dcf2d58594"],"categorias":["Helping verb","Main verb"],"elementos":["is (in 'is walking')","come (in 'can come')","has (in 'has baked')","can (in 'can come')","baked (in 'has baked')","walking (in 'is walking')"]},{"id":"tv-v8","formato":"clasifica","pregunta":"Clasificá cada verbo según sea 'action verb' o 'linking verb':","pista":"Los linking verbs no muestran una acción; describen cómo ES o SE VE algo.","hashes":["ed9f110b12e864e97ff3d580b15f128e817ddbce644c8bfb6bbf7f1a75405d58"],"categorias":["Action verb","Linking verb"],"elementos":["feels (The blanket feels soft)","jumps (The frog jumps high)","drinks (He drinks water)","seems (The plan seems good)","ran (Tameka ran fast)","appears (She appears tired)"]},{"id":"tv-v9","formato":"empareja","pregunta":"Uní cada grupo de helping verbs con lo que muestran:","pista":"Recordá: can/may/must son los tres que no muestran tiempo.","hashes":["c09493a21b77b7bc474accb5b4446691e8de785c163f271433f8617de6643128"],"izquierda":["is, am, are","was, were","will","can, may, must"],"derecha":["future tense","no tense (no muestran tiempo)","present tense","past tense"]},{"id":"tv-v10","formato":"mc","pregunta":"Which sentence has a linking verb?","pista":"'Is' conecta 'dog' con el adjetivo 'smelly'.","hashes":["81aaa1a64b5a84fc70ae656c5038001646a83fd73d025c1bdc5da080c5b06e22"],"opciones":["My dog is smelly.","The children walk to school.","Tameka ran fast.","Sarah will drink water."]},{"id":"tv-v11","formato":"escribe","pregunta":"'The soup ___ delicious.' Completá con la forma correcta (presente, 3ra persona) del linking verb 'to smell'.","pista":"Conecta 'soup' con 'delicious'.","hashes":["fcecfebd33e322fdbddbf2f6fbdb2b85f445cdf8465a08ebfead0e2e0dc1d528"]},{"id":"tv-v12","formato":"porque","pregunta":"En la oración 'She is washing the dog', ¿por qué 'is' se llama helping verb y no main verb?","pista":"El main verb dice QUÉ hace el sujeto; el helping verb solo ayuda.","hashes":["b79498db2fae2f5eb3c5603682c89c6ce9dbc9da2667ec066fc0508b60418c2d"],"opciones":["Porque no se puede usar con otros verbos","Porque siempre va al final de la oración","Porque ayuda al verbo principal 'washing' a formar la acción, pero la acción en sí es 'washing'"]}]},{"id":"tiempos-verbales","nombre":"Verb Tenses, Agreement, and Irregular Verbs","explicacion":"<b>Del cuadernillo de gramática (literal):</b><ul><li>A verb in the <b>present tense</b> shows the action is happening now or over and over. A present-tense verb must <b>agree</b> with the subject: for singular third-person subjects, add <b>-s</b> or <b>-es</b> to most verbs (ej.: <i>Teri takes piano lessons</i>). If the subject is <i>I, you</i>, a plural noun, or a plural pronoun, do NOT add -s/-es. Use <i>am, is, are</i> + -ing para la forma progresiva (<i>is walking, are talking</i>).</li><li>A verb in the <b>past tense</b> shows the action already happened (ej.: <i>hurried</i>). Use <i>was/were</i> + -ing para la forma progresiva del pasado (<i>was hurrying</i>).</li><li>A verb in the <b>future tense</b> shows action that will happen (ej.: <i>will hurry</i>). Use <i>will be</i> + -ing para la forma progresiva del futuro (<i>will be hurrying</i>).</li><li>Formas de <b>be</b>: presente <i>am, is, are</i>; pasado <i>was, were</i>; futuro <i>will be</i>. Use <i>am, was,</i> o <i>will be</i> con <i>I</i>; <i>is, was,</i> o <i>will be</i> con sujetos singulares; <i>are, were,</i> o <i>will be</i> con sujetos plurales.</li><li><b>Regular past-tense verbs</b> end with -ed (<i>walk/walked</i>). <b>Irregular past-tense verbs</b> do NOT end with -ed (<i>run/ran</i>). Algunos verbos irregulares no cambian del presente al pasado (<i>read/read</i>); otros terminan en -n o -en cuando se usan con un helping verb (<i>have known, have eaten</i>).</li></ul>","microleccion":"Ejemplo con otro verbo (no es uno de las variantes): el verbo 'talk'. Presente: 'She talks to her friend' (agrego -s porque 'she' es singular). Presente progresivo: 'She is talking to her friend'. Pasado: 'She talked to her friend' (regular, termina en -ed). Pasado progresivo: 'She was talking to her friend'. Futuro: 'She will talk to her friend'. Futuro progresivo: 'She will be talking to her friend'. Y un verbo irregular distinto: 'eat' → pasado 'ate' (no termina en -ed), y con helping verb: 'have eaten'.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"tiem-v1","formato":"mc","pregunta":"We visit our grandmother every Sunday. What tense is this?","pista":"Pasa 'cada domingo', una y otra vez.","hashes":["a999fb23969c1a87e070dc766775ac2d05303c6f58868310df18af9aaf158ac8"],"opciones":["future","past","present"]},{"id":"tiem-v2","formato":"mc","pregunta":"Carlos played basketball yesterday. What tense is this?","pista":"'Yesterday' = ayer.","hashes":["61ae7e24988ccc7214240e55305d0e6f47905f650a425d6ab96ea580d78eb11b"],"opciones":["future","present","past"]},{"id":"tiem-v3","formato":"mc","pregunta":"They will go to the beach next weekend. What tense is this?","pista":"'Will' + 'next weekend' = todavía no pasó.","hashes":["2d20141bcb1d9f3b708312890cc89cf17b9a50a52a1bc1a565b7c825510da2b6"],"opciones":["present","future","past"]},{"id":"tiem-v4","formato":"escribe","pregunta":"Rewrite in PAST PROGRESSIVE: 'He reads a book.' (usá mayúscula inicial y punto final)","pista":"was + verbo con -ing.","hashes":["b4cda71744906a3d4d518eb54626a6995ac1033f249bec36e9272de2287fb928","54f359953d1c4e47409aa2b8e683153f80ca9dbb087dc28a228f3445b946fbe0"]},{"id":"tiem-v5","formato":"escribe","pregunta":"Rewrite in SIMPLE FUTURE: 'We clean the classroom.' (usá mayúscula inicial y punto final)","pista":"will + verbo en su forma simple.","hashes":["0341614f5e4da0c5e9ad0d3ead2c9f834045047523616a144d866d712dc8f695","9439c7c635daf20e5de5516ac092a5ee0d7d57bf46d1009e6a9035318d5656cd"]},{"id":"tiem-v6","formato":"escribe","pregunta /* ---------- sha256 puro en JS (sin depender de crypto.subtle) ---------- */
function sha256hex(ascii){
function rr(v,c){return(v>>>c)|(v<<(32-c));}
var mw=Math.pow,ms=mw(2,32),i,j,result='';
var words=[],al=ascii.length*8;
var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
var isC={};
for(var cand=2;pc<64;cand++){
if(!isC[cand]){for(i=0;i<313;i+=cand){isC[i]=cand;}
hash[pc]=(mw(cand,.5)*ms)|0;k[pc++]=(mw(cand,1/3)*ms)|0;}}
ascii+='\x80';
while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;
words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=(al/ms)|0;words[words.length]=al;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16),oh=hash.slice(0,8);
for(i=16;i<64;i++){var w15=w[i-15],w2=w[i-2];
w[i]=((rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))+w[i-16])|0;}
for(i=0;i<64;i++){
var a=hash[0],e=hash[4];
var t1=(hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+w[i])|0;
var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.length=8;}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b>>4).toString(16))+((b&15).toString(16));}
return result;}
function utf8(s){return unescape(encodeURIComponent(s));}
function sha(s){return sha256hex(utf8(s));}

/* ---------- lectura en voz alta ---------- */
var vozElegida=null;
function elegirVoz(){
  try{
    var voces=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang);});
    if(!voces.length)return null;
    function puntos(v){
      var n=v.name.toLowerCase(),p=0;
      if(n.indexOf('natural')>=0)p+=6;
      if(n.indexOf('neural')>=0)p+=6;
      if(n.indexOf('online')>=0)p+=3;
      if(n.indexOf('google')>=0)p+=4;
      if(/m[oó]nica|paulina|dalia|sabina|luciana|camila|jorge/.test(n))p+=2;
      var l=v.lang.toLowerCase();
      if(l.indexOf('es-us')===0||l.indexOf('es-419')===0||l.indexOf('es-mx')===0||l.indexOf('es-cr')===0)p+=2;
      return p;
    }
    voces.sort(function(a,b){return puntos(b)-puntos(a);});
    return voces[0];
  }catch(e){return null;}
}
try{speechSynthesis.addEventListener('voiceschanged',function(){vozElegida=elegirVoz();});}catch(e){}
function leerEnVoz(texto){
  try{
    var limpio=String(texto).replace(/<[^>]*>/g,' ')
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,' ')
      .replace(/[\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u2716\u2714]/g,' ')
      .replace(/→/g,', entonces, ')
      .replace(/\s+/g,' ').trim();
    if(!limpio)return;
    if(!vozElegida)vozElegida=elegirVoz();
    speechSynthesis.cancel();
    var frases=limpio.match(/[^.!?…]+[.!?…]*/g)||[limpio];
    frases.forEach(function(f){
      f=f.trim();
      if(!f)return;
      var u=new SpeechSynthesisUtterance(f);
      u.lang=(vozElegida&&vozElegida.lang)||'es-US';
      if(vozElegida)u.voice=vozElegida;
      u.rate=0.98;
      u.pitch=1.05;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

function tono(secuencia){
  if(!sonidoOn)return;
  try{
    var ctx=tono.ctx=tono.ctx||new (window.AudioContext||window.webkitAudioContext)();
    var t=ctx.currentTime;
    secuencia.forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t+p[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t+p[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+p[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+p[1]);o.stop(t+p[1]+p[2]+0.05);
    });
  }catch(e){}
}

/* ---------- selección de variantes ---------- */
function elegirVariante(tema,evitarFormato){
  var st=estado.temas[tema.id];
  if(DATOS.fiel){
    var sig=null;
    for(var k=0;k<tema.variantes.length;k++){if(st.usadas.indexOf(tema.variantes[k].id)<0){sig=tema.variantes[k];break;}}
    if(!sig)sig=tema.variantes[tema.variantes.length-1];
    if(st.usadas.indexOf(sig.id)<0)st.usadas.push(sig.id);
    st.ultimoFormato=sig.formato;
    return sig;
  }
  var cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0 && v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0;});
  if(!cand.length){st.usadas=[];cand=tema.variantes.slice();}
  var v=cand[Math.floor(Math.random()*cand.length)];
  if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);
  st.ultimoFormato=v.formato;
  return v;
}

/* ---------- planificador ---------- */
function insertarEncuentro(temaId,distancia){
  var pos=Math.min(estado.cola.length,distancia);
  estado.cola.splice(pos,0,temaId);
}
function siguiente(){
  if(!estado.cola.length){
    var pend=temasPendientes();
    if(!pend.length){mostrarFinal();return;}
    estado.orden.forEach(function(id){if(pend.some(function(t){return t.id===id;}))estado.cola.push(id);});
  }
  // evitar dos encuentros seguidos del mismo tema si hay alternativa
  if(!DATOS.fiel&&estado.actual&&estado.cola.length>1&&estado.cola[0]===estado.actual.temaId){
    estado.cola.push(estado.cola.shift());
  }
  var temaId=estado.cola.shift();
  var tema=temaPorId(temaId);
  if(estado.temas[temaId].dominado){siguiente();return;}
  var evitar=(estado.actual&&estado.actual.temaId===temaId)?estado.actual.variante.formato:estado.temas[temaId].ultimoFormato;
  var v=elegirVariante(tema,evitar);
  estado.actual={temaId:temaId,variante:v};
  pintarPregunta(tema,v);
}

function restaurarProgreso(prog){
  estado.orden=prog.orden||DATOS.temas.map(function(t){return t.id;});
  estado.respondidas=prog.respondidas||0;
  estado.guardadas=prog.guardadas||0;
  estado.rondas=prog.rondas||0;
  estado.insignias=prog.insignias||{};
  estado.dias=prog.dias||[];
  estado.modosRepaso=prog.modosRepaso||[];
  DATOS.temas.forEach(function(t){
    var g=prog.temas&&prog.temas[t.id];
    if(g)Object.keys(g).forEach(function(k){estado.temas[t.id][k]=g[k];});
  });
  estado.cola=[];
  estado.inicioRonda=Date.now();
  registrarDia();
  siguiente();
}

function comenzar(){

function barraSuperior(){
  if(estado.fase==='repaso'){

  }
  var dom=DATOS.temas.filter(function(t){return estado.temas[t.id].dominado;}).length;
  var pct=Math.round(100*dom/DATOS.temas.length);
  if(DATOS.fiel){var totV=0,hechas=0;DATOS.temas.forEach(function(t){totV+=t.variantes.length;hechas+=estado.temas[t.id].intentos;});pct=Math.round(100*hechas/totV);}
  var restanRonda=6-(estado.respondidas%6);

    '<button class="btn-icono" id="btn-pausa">⏸ Pausa</button></div>'+

/* ---------- respuesta ---------- */
function responder(tema,v,canonicaUsuario,okPrevio){
  var st=estado.temas[tema.id];
  st.intentos++;
  var ok=(okPrevio!==undefined&&canonicaUsuario===null)?okPrevio:(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+canonicaUsuario))>=0);
  if(ok&&v.formato==='oracion'&&estado.ultimaOracion){
    (st.oraciones=st.oraciones||[]).push(estado.ultimaOracion);
    estado.ultimaOracion=null;
  }
  estado.respondidas++;
  if(estado.fase==='repaso'){responderRepaso(tema,st,ok);return;}
  if(DATOS.fiel){
    if(ok){st.creditos++;sonidoBien();el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐</div>';}
    else{st.fallos++;sonidoSuave();el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Seguimos con la siguiente.</div>';}
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;if(st.fallos===0)celebrarDominio();}
    guardarProgreso();
    desactivarZona();
    setTimeout(function(){
      if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
      despuesDeResponder();
    },1400);
    return;
  }
  if(ok){
    st.creditos++;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;celebrarDominio();}
    else{insertarEncuentro(tema.id,3);} // vuelve más adelante: dominio en encuentros separados
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐ '+(st.dominado?'¡Planeta conquistado!':'Este tema volverá una vez más para asegurarlo.')+'</div>';
  }else{
    st.fallos++;
    insertarEncuentro(tema.id,2); // vuelve pronto, con otra variante de otro formato
    sonidoSuave();
    el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Este tema volverá más adelante con otra pregunta.</div>';
  }
  guardarProgreso();
  desactivarZona();
  setTimeout(function(){
    if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
    despuesDeResponder();
  },1400);
}
function desactivarZona(){
  el('zona-respuesta').querySelectorAll('button,select').forEach(function(x){x.disabled=true;});
  var bp=el('btn-pista');if(bp)bp.disabled=true;
  var bg=el('btn-guardar');if(bg)bg.disabled=true;
}
function despuesDeResponder(){
  if(estado.respondidas%6===0){estado.rondas++;pausaRonda();return;}
  siguiente();
}

/* ---------- fase de repaso final ---------- */
function tarjetasDeTema(t){
  var cartas=[];
  var exp=String(t.explicacion||'').trim();
  if(exp){
    if(exp.indexOf('<')>=0){cartas.push({frente:'Idea clave',dorso:exp,html:true});}
    else{
      var partes=exp.split('. ').map(function(p){p=p.trim();return p?(/[.!?:]$/.test(p)?p:p+'.'):'';}).filter(Boolean);
      var maxCartas=5,tam=Math.max(1,Math.ceil(partes.length/maxCartas));
      for(var i=0;i<partes.length;i+=tam){cartas.push({frente:'Idea '+(cartas.length+1),dorso:partes.slice(i,i+tam).join(' '),html:false});}
    }
  }
  cartas.push({frente:'⭐ Ejemplo paso a paso',dorso:t.microleccion,html:true});
  return cartas;
}
function graficoSvg(g){
  var h='';
  if(g.tipo==='barra'){
    var w=310,c=28,gap=2;
    h='<svg viewBox="0 0 '+w+' 36" style="max-width:340px;width:100%;display:block;margin:10px auto" role="img" aria-label="Barra dividida en 10 partes, '+g.pintadas+' pintadas">';
    for(var i=0;i<10;i++){
      h+='<rect x="'+(i*(c+gap)+2)+'" y="3" width="'+c+'" height="30" rx="4" fill="'+(i<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="2"/>';
    }
    h+='</svg>';
  }else{
    var cel=26,gp=2,tam=10*(cel+gp)+4;
    h='<svg viewBox="0 0 '+tam+' '+tam+'" style="max-width:300px;width:100%;display:block;margin:10px auto" role="img" aria-label="Cuadrícula de 100 partes, '+g.pintadas+' pintadas">';
    for(var f=0;f<10;f++)for(var col=0;col<10;col++){
      var idx=f*10+col;
      h+='<rect x="'+(col*(cel+gp)+2)+'" y="'+(f*(cel+gp)+2)+'" width="'+cel+'" height="'+cel+'" rx="3" fill="'+(idx<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="1.5"/>';
    }
    h+='</svg>';
  }
  return h;
}
function imagenHtml(t){
  return '<img src="'+esc(t.imagenUrl)+'" alt="'+esc(t.imagenTitulo||t.nombre)+'" loading="lazy" '+
    'style="width:100%;border-radius:16px;box-shadow:0 6px 18px rgba(20,10,60,.25);display:block" '+
    'onerror="this.style.display=\'none\';this.nextElementSibling.textContent=\'🖼 La imagen necesita internet.\'">'+
    '<p class="suave">🖼 '+esc(t.imagenTitulo||'')+'</p>';
}
function videoHtml(t){
  return '<div style="position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(20,10,60,.3)">'+
    '<iframe src="https://www.youtube-nocookie.com/embed/'+t.videoId+'?rel=0&modestbranding=1" '+
    'style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy" '+
    'title="'+esc(t.videoTitulo||'Video de repaso')+'"></iframe></div>'+
    '<p class="suave">🎬 '+esc(t.videoTitulo||'Video de repaso')+' · Necesita internet. Si no carga, usá otra forma de repasar.</p>';
}
function modoVideo(tema,alCompletar){
  var h='<p class="suave">Mirá el video con atención: después vas a demostrarlo. 👀</p>';
  h+=videoHtml(tema);
  h+='<button class="btn-sec" id="btn-video-listo" style="width:100%;margin-top:8px">¡Ya lo vi! ✅</button>';
  el('zona-modo').innerHTML=h;
  el('btn-video-listo').addEventListener('click',function(){
    el('btn-video-listo').textContent='Video visto ✔';
    alCompletar();
  });
}
function pintarRepaso(tema){
  var st=estado.temas[tema.id];
  var cartas=tarjetasDeTema(tema);
  var completado=false;
  var h=barraSuperior();
  h+='<div class="carta"><h2>🔁 Repaso: '+esc(tema.nombre)+'</h2>';
  h+='<p class="suave">Elegí CÓMO querés repasarlo. Al terminar cualquiera de las formas, vas a poder demostrarlo.</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">';
  h+='<button class="btn-sec" data-modo="tarjetas">📖 Tarjetas</button>';
  h+='<button class="btn-sec" data-modo="esquema">🗺️ Esquema</button>';
  h+='<button class="btn-sec" data-modo="escribir">✍️ Escribirlo</button>';
  if(tema.videoId)h+='<button class="btn-sec" data-modo="video">🎬 Video</button>';
  if(DATOS.voz)h+='<button class="btn-sec" id="btn-oir-repaso">🔊 Escuchar</button>';
  h+='</div>';
  h+='<div id="zona-modo">'+mascota('👆 Elegí una forma de repasar este planeta. ¡Todas valen! Usá la que más te guste hoy.')+'</div>';
  h+='<button class="btn-principal pulso" id="btn-demostrar" disabled style="margin-top:10px">¡Ya lo repasé, a demostrarlo! 💪</button></div>';
  el('app').innerHTML=h;
  el('btn-pausa').addEventListener('click',pausaLibre);
  bindSonido();
  var bOirR=el('btn-oir-repaso');
  if(bOirR)bOirR.addEventListener('click',function(){
    leerEnVoz(cartas.map(function(c){return c.dorso;}).join('. '));
  });
  function desbloquear(){if(!completado){completado=true;el('btn-demostrar').disabled=false;}}
  document.querySelectorAll('[data-modo]').forEach(function(b){
    b.addEventListener('click',function(){
      var m=b.getAttribute('data-modo');
      if(estado.modosRepaso.indexOf(m)<0){
        estado.modosRepaso.push(m);
        if(estado.modosRepaso.length>=3)otorgarInsignia('explorador');
      }
      if(m==='tarjetas')modoTarjetas(cartas,desbloquear);
      else if(m==='esquema')modoEsquema(tema,cartas,desbloquear);
      else if(m==='video')modoVideo(tema,desbloquear);
      else modoEscribir(cartas,desbloquear,st);
    });
  });
  el('btn-demostrar').addEventListener('click',function(){preguntaRefuerzo(tema);});
}
function modoTarjetas(cartas,alCompletar){
  var vistas=0;
  var h='<p class="suave">Tocá cada tarjeta para descubrir la idea.</p><div id="cartas-repaso">';
  cartas.forEach(function(c,i){
    h+='<div class="tarjeta-repaso" data-i="'+i+'"><div class="cara-frente">'+esc(c.frente)+' · tocá para ver 👆</div><div class="cara-dorso oculto"></div></div>';
  });
  h+='</div><p class="suave" id="contador-cartas">Tarjetas vistas: 0 de '+cartas.length+'</p>';
  el('zona-modo').innerHTML=h;
  document.querySelectorAll('.tarjeta-repaso').forEach(function(card){
    card.addEventListener('click',function(){
      if(card.classList.contains('vista'))return;
      var i=parseInt(card.getAttribute('data-i'),10);
      card.classList.add('girando');
      setTimeout(function(){
        card.querySelector('.cara-frente').classList.add('oculto');
        var dorso=card.querySelector('.cara-dorso');
        if(cartas[i].html)dorso.innerHTML=cartas[i].dorso;else dorso.textContent=cartas[i].dorso;
        dorso.classList.remove('oculto');
        card.classList.remove('girando');
        card.classList.add('vista');
        vistas++;
        el('contador-cartas').textContent='Tarjetas vistas: '+vistas+' de '+cartas.length;
        if(vistas===cartas.length)alCompletar();
      },200);
    });
  });
}
function modoEsquema(tema,cartas,alCompletar){
  var h='<p class="suave">Un mapa de ideas para verlo todo de un vistazo:</p>';
  if(tema.imagenUrl)h+=imagenHtml(tema);
  h+='<div class="esquema"><div class="nodo-centro">'+esc(tema.nombre)+'</div><div class="ramas">';
  cartas.forEach(function(c){
    h+='<div class="rama'+(c.frente.indexOf('⭐')>=0?' rama-estrella':'')+'"><b>'+esc(c.frente)+'</b><div>'+(c.html?c.dorso:esc(c.dorso))+'</div></div>';
  });
  h+='</div></div><button class="btn-sec" id="btn-esquema-listo" style="width:100%;margin-top:8px">¡Ya estudié el esquema! ✅</button>';
  el('zona-modo').innerHTML=h;
  el('btn-esquema-listo').addEventListener('click',function(){
    el('btn-esquema-listo').textContent='Esquema estudiado ✔';
    alCompletar();
  });
}
function modoEscribir(cartas,alCompletar,st){
  var h='<p class="suave">Escribí con TUS palabras lo más importante de este tema. Escribirlo vos ayuda muchísimo a recordarlo:</p>';
  h+='<textarea id="txt-resumen" rows="4" placeholder="Yo aprendí que..."></textarea>';
  h+='<button class="btn-sec" id="btn-comparar" style="width:100%;margin-top:8px" disabled>Comparar con las ideas del libro</button>';
  h+='<div id="zona-comparar"></div>';
  el('zona-modo').innerHTML=h;
  var t=el('txt-resumen');
  t.addEventListener('input',function(){el('btn-comparar').disabled=t.value.trim().length<15;});
  el('btn-comparar').addEventListener('click',function(){
    st.resumen=t.value.trim();
    var c='<p style="margin-top:10px"><b>Compará lo tuyo con las ideas del libro:</b></p>';
    cartas.forEach(function(x){c+='<div class="explicacion">'+(x.html?x.dorso:esc(x.dorso))+'</div>';});
    c+='<p class="suave">¿Se parece? Si te faltó algo, es normal: para eso repasamos 😉</p>';
    el('zona-comparar').innerHTML=c;
    guardarProgreso();
    otorgarInsignia('escritor');
    alCompletar();
  });
}
function preguntaRefuerzo(tema){
  var st=estado.temas[tema.id];
  // preferir formatos generativos (escribir/armar): recordar produciendo fija más la memoria
  var gen=tema.variantes.filter(function(x){return (x.formato==='escribe'||x.formato==='arma')&&st.usadas.indexOf(x.id)<0;});
  var v;
  if(gen.length){v=gen[Math.floor(Math.random()*gen.length)];if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);st.ultimoFormato=v.formato;}
  else{v=elegirVariante(tema,st.ultimoFormato);}
  estado.actual={temaId:tema.id,variante:v};
  pintarPregunta(tema,v);
}
function responderRepaso(tema,st,ok){
  desactivarZona();
  if(ok){
    st.reforzado=true;
    guardarProgreso();
    confeti();
    sonidoBien();
    otorgarInsignia('no-me-rindo');
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Eso es! 🌟 Tema reforzado.</div>';
    setTimeout(avanzarRepaso,1400);
  }else{
    st.fallos++;
    estado.refuerzoIntentos++;
    guardarProgreso();
    sonidoSuave();
    if(estado.refuerzoIntentos<2){
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Mirá el ejemplo otra vez y probá con otra pregunta.</div>';
      setTimeout(function(){
        mostrarOverlay('⭐ Ejemplo paso a paso','<div class="explicacion">'+tema.microleccion+'</div>','Probar otra vez',function(){preguntaRefuerzo(tema);});
      },1400);
    }else{
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no — este tema lo seguimos practicando otro día 💙</div>';
      setTimeout(avanzarRepaso,1400);
    }
  }
}
function avanzarRepaso(){
  estado.refuerzoIntentos=0;
  estado.repasoIdx++;
  if(estado.repasoIdx<estado.repasoLista.length){pintarRepaso(temaPorId(estado.repasoLista[estado.repasoIdx]));}
  else{informeFinal();}
}

/* ---------- informe final ---------- */
function mostrarFinal(){
  if(DATOS.fiel){informeFinal();return;}
  if(estado.fase==='normal'){
    var lista=DATOS.temas.filter(function(t){var st=estado.temas[t.id];return st.fallos>0||(st.intentos>0&&!st.dominado);}).map(function(t){return t.id;});
    if(lista.length){
      var h='<div class="carta" style="text-align:center"><h1>🔁 ¡Último paso!</h1>';
      h+='<p>Hubo '+lista.length+' tema'+(lista.length>1?'s':'')+' que costaron un poquito. Vamos a repasarlos con tarjetas y después demostrás lo aprendido.</p>';
      h+='<button class="btn-principal" id="btn-ir-repaso" style="margin-bottom:8px">¡Vamos al repaso! ✨</button>';
      h+='<button class="btn-sec" id="btn-saltar-repaso" style="width:100%">Ver el informe ya</button></div>';
      el('app').innerHTML=h;
      el('btn-ir-repaso').addEventListener('click',function(){estado.fase='repaso';estado.repasoLista=lista;estado.repasoIdx=0;estado.refuerzoIntentos=0;pintarRepaso(temaPorId(lista[0]));});
      el('btn-saltar-repaso').addEventListener('click',informeFinal);
      return;
    }
  }
  informeFinal();
}
function informeFinal(){
  confeti();
  var h='<div class="carta" style="text-align:center"><h1>¡Misión cumplida! 🌟</h1>';
  h+=mascota('¡Qué gran expedición! Practicaste <b>'+estado.respondidas+' preguntas</b>'+(estado.dias.length>1?' a lo largo de <b>'+estado.dias.length+' días</b> 📅':'')+'. Abajo dejé el reporte para tu persona adulta.');
  h+='</div>';
  var ids=Object.keys(estado.insignias).filter(function(k){return INSIGNIAS[k];});
  if(ids.length){
    h+='<div class="carta"><h2>🏅 Insignias ganadas</h2>';
    ids.forEach(function(k){var i=INSIGNIAS[k];h+='<p>'+i.emoji+' <b>'+esc(i.nombre)+'</b> — '+esc(i.desc)+'</p>';});
    h+='</div>';
  }
  h+='<div class="carta modo-adulto"><h2>Informe para la persona adulta</h2><table class="informe"><tr><th>Tema</th><th>Intentos</th><th>Pistas</th><th>Estado</th></tr>';
  var repasar=[];
  DATOS.temas.forEach(function(t){
    var st=estado.temas[t.id];
    var estadoTxt;
    if(DATOS.fiel){
      var nV=t.variantes.length;
      if(st.dominado)estadoTxt=(st.creditos===nV?'✅ ':'🔄 ')+st.creditos+' de '+nV+' correctas';
      else if(st.intentos)estadoTxt='⏳ En curso: '+st.creditos+' de '+nV+' correctas';
      else estadoTxt='⬜ Sin ver';
      if(st.fallos>0)repasar.push(t.nombre+' ('+st.fallos+' por revisar)');
      h+='<tr><td>'+esc(t.nombre)+'</td><td>'+st.intentos+'</td><td>'+st.pistas+'</td><td>'+estadoTxt+'</td></tr>';
      return;
    }
    if(st.dominado)estadoTxt='✅ Dominado'+(st.reforzado?' · 💪 reforzado':'');
    else if(st.reforzado)estadoTxt='💪 Reforzado en el repaso';
    else if(st.intentos)estadoTxt='🔄 Para seguir practicando';
    else estadoTxt='⬜ Sin ver';
    if((st.fallos>0&&!st.reforzado)||(!st.dominado&&!st.reforzado&&st.intentos>0))repasar.push(t.nombre);
    h+='<tr><td>'+esc(t.nombre)+'</td><td>'+st.intentos+'</td><td>'+st.pistas+'</td><td>'+estadoTxt+'</td></tr>';
  });
  h+='</table>';
  if(repasar.length)h+='<p style="margin-top:12px"><b>Qué conviene repasar:</b> '+repasar.map(esc).join(', ')+'.</p>';
  else h+='<p style="margin-top:12px"><b>'+(DATOS.fiel?'Toda la práctica quedó correcta.':'Todos los temas quedaron dominados.')+'</b> 🎉</p>';
  h+='</div>';
  var escritos=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
  if(escritos.length){
    h+='<div class="carta"><h2>✍️ Lo que escribió con sus palabras</h2>';
    escritos.forEach(function(t){h+='<p><b>'+esc(t.nombre)+':</b> «'+esc(estado.temas[t.id].resumen)+'»</p>';});
    h+='</div>';
  }
  var conOraciones=DATOS.temas.filter(function(t){return (estado.temas[t.id].oraciones||[]).length;});
  if(conOraciones.length){
    h+='<div class="carta modo-adulto"><h2>📝 Oraciones escritas — revisar concordancia y sentido</h2>';
    h+='<p class="suave">El motor verificó la conjugación exacta y la ortografía del verbo; el resto de la oración lo revisa usted.</p>';
    conOraciones.forEach(function(t){
      (estado.temas[t.id].oraciones||[]).forEach(function(o){h+='<p>• «'+esc(o)+'»</p>';});
    });
    h+='</div>';
  }
  h+='<div class="carta modo-adulto"><button class="btn-sec" style="width:100%;margin-bottom:8px" id="btn-copiar">📋 Copiar informe (para WhatsApp o correo)</button>';
  h+='<p class="suave">El progreso queda guardado en este dispositivo: al abrir de nuevo la práctica se puede continuar. "Empezar de cero" borra todo el avance.</p>';
  h+='<button class="btn-sec" style="width:100%" id="btn-reiniciar">🔄 Empezar de cero</button></div>';
  el('app').innerHTML=h;
  el('btn-copiar').addEventListener('click',function(){
    var lineas=['📚 '+DATOS.titulo,'Preguntas practicadas: '+estado.respondidas+(estado.dias.length>1?' en '+estado.dias.length+' días':''),''];
    DATOS.temas.forEach(function(t){
      var s=estado.temas[t.id];
      var est=DATOS.fiel?(s.creditos+' de '+t.variantes.length+' correctas'):(s.dominado?'✅ Dominado':(s.reforzado?'💪 Reforzado':(s.intentos?'🔄 Seguir practicando':'⬜ Sin ver')));
      lineas.push('• '+t.nombre+': '+est+' ('+s.intentos+' intentos, '+s.pistas+' pistas)');
    });
    var conResumen=DATOS.temas.filter(function(t){return estado.temas[t.id].resumen;});
    if(conResumen.length){
      lineas.push('','✍️ Con sus palabras:');
      conResumen.forEach(function(t){lineas.push('• '+t.nombre+': «'+estado.temas[t.id].resumen+'»');});
    }
    var conOr=DATOS.temas.filter(function(t){return (estado.temas[t.id].oraciones||[]).length;});
    if(conOr.length){
      lineas.push('','📝 Oraciones escritas (revisar concordancia):');
      conOr.forEach(function(t){(estado.temas[t.id].oraciones||[]).forEach(function(o){lineas.push('• «'+o+'»');});});
    }
    var ins=Object.keys(estado.insignias).filter(function(k){return INSIGNIAS[k];});
    if(ins.length)lineas.push('','🏅 Insignias: '+ins.map(function(k){return INSIGNIAS[k].emoji+' '+INSIGNIAS[k].nombre;}).join(', '));
    var texto=lineas.join('\n');
    try{
      navigator.clipboard.writeText(texto).then(function(){el('btn-copiar').textContent='¡Informe copiado! ✅';});
    }catch(e){el('btn-copiar').textContent='No se pudo copiar en este navegador';}
  });
  el('btn-reiniciar').addEventListener('click',function(){
    mostrarOverlay('🔄 Empezar de cero','<p>Se borrará todo el avance guardado y la práctica comenzará desde el principio. ¿Continuar?</p>','Sí, empezar de cero',function(){borrarProgreso();location.reload();});
  });
}

crearCielo();
pintarInicio();
</script>
</body>
</html>
