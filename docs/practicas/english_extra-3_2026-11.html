:root{
  --cielo1:#1B1464;--cielo2:#4A1E9E;--carta:#FFFFFF;--tinta:#2D2A5E;--tintaSuave:#6B6899;
  --sol:#FFB703;--solOscuro:#D89400;--menta:#06D6A0;--mentaOscuro:#04A87E;
  --nube:#FFD166;--nubeOscuro:#E0B04A;--cielitoBtn:#8ECAE6;--cielitoOscuro:#5FA8CC;
  --lila:#9B5DE5;--moradoTitulo:#3A1D8A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Andika','Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
  color:var(--tinta);min-height:100vh;overflow-x:hidden;
  font-size:17px;line-height:1.6;letter-spacing:.01em;
  background:linear-gradient(160deg,var(--cielo1) 0%,var(--cielo2) 55%,#7B2FBE 100%);
  background-attachment:fixed}
.estrella{position:fixed;color:#FFF;pointer-events:none;z-index:0;animation:titilar 3s ease-in-out infinite}
@keyframes titilar{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.contenedor{max-width:640px;margin:0 auto;padding:14px;position:relative;z-index:1}
.carta{background:var(--carta);border-radius:22px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(20,10,60,.35);animation:aparecer .35s ease}
@keyframes aparecer{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
h1{font-size:1.55rem;margin:.2em 0;color:var(--moradoTitulo);letter-spacing:.3px}
h2{font-size:1.15rem;color:var(--moradoTitulo);margin:.3em 0 .5em}
.suave{color:var(--tintaSuave);font-size:.92rem}
button{font-family:inherit;font-size:1.02rem;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;
  transition:transform .08s,box-shadow .08s;font-weight:700}
button:active{transform:translateY(4px)}
.btn-principal{background:var(--sol);color:#4A2500;width:100%;font-size:1.12rem;font-weight:800;
  box-shadow:0 5px 0 var(--solOscuro)}
.btn-principal:active{box-shadow:0 1px 0 var(--solOscuro)}
.btn-sec{background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 4px 0 var(--cielitoOscuro)}
.btn-sec:active{box-shadow:0 1px 0 var(--cielitoOscuro)}
.btn-opcion{display:block;width:100%;text-align:left;background:#F5F3FF;color:var(--tinta);
  margin:9px 0;border:3px solid #E4DEFF;font-weight:600;box-shadow:0 3px 0 #E4DEFF}
.btn-opcion:hover{border-color:var(--lila);transform:translateY(-2px)}
.btn-opcion:active{transform:translateY(2px)}
.ficha{display:inline-block;background:#FFF4D6;border:3px solid var(--sol);color:#7A4E00;font-weight:800;
  margin:4px;padding:11px 15px;border-radius:14px;box-shadow:0 3px 0 var(--solOscuro)}
.ficha:active{transform:translateY(3px);box-shadow:none}
.zona-construccion{min-height:56px;background:#F5F3FF;border:3px dashed #C9BEF5;border-radius:16px;padding:8px;margin:10px 0}
.ruta-planetas{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;
  background:rgba(255,255,255,.14);border-radius:99px;padding:8px 12px;margin-bottom:10px}
.planeta{font-size:1.45rem;filter:grayscale(1) opacity(.45);transition:filter .4s,transform .4s}
.planeta.dominado{filter:none;transform:scale(1.18);text-shadow:0 0 14px #FFD166}
.cohete{font-size:1.5rem;animation:flotar 2.6s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.pill{background:rgba(255,255,255,.18);color:#FFF;border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:700}
.btn-icono{background:rgba(255,255,255,.18);color:#FFF;padding:6px 12px;border-radius:99px;box-shadow:none;font-size:.95rem}
.mascota{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mascota .emoji-mascota{font-size:2.5rem;animation:flotar 3s ease-in-out infinite}
.burbuja{background:#FFF;border-radius:18px;border-bottom-left-radius:4px;padding:12px 15px;flex:1;
  box-shadow:0 5px 16px rgba(20,10,60,.3);font-size:.98rem}
.fila-orden{display:flex;align-items:center;gap:8px;background:#F5F3FF;border:3px solid #E4DEFF;border-radius:14px;padding:9px 11px;margin:7px 0}
.fila-orden span{flex:1;font-weight:600}
.fila-orden button{padding:7px 12px;background:var(--cielitoBtn);color:#0B3A52;box-shadow:0 3px 0 var(--cielitoOscuro)}
select{font-family:inherit;font-size:.95rem;padding:9px;border-radius:12px;border:3px solid #E4DEFF;background:#fff;max-width:100%;font-weight:600;color:var(--tinta)}
.fila-sel{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
.fila-sel b{flex:1;min-width:120px}
.feedback{border-radius:16px;padding:15px;margin-top:12px;font-weight:800;font-size:1.05rem;text-align:center}
.fb-bien{background:#D9FBEF;color:#046B52;border:3px solid var(--menta);animation:rebotar .5s ease}
@keyframes rebotar{0%{transform:scale(.9)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.fb-nube{background:#FFF4D6;color:#7A5300;border:3px solid var(--nube);animation:mecer .6s ease}
@keyframes mecer{0%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(4px)}100%{transform:none}}
.overlay{position:fixed;inset:0;background:rgba(20,10,60,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .carta{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.oculto{display:none!important}
.orden-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--sol);color:#4A2500;
  align-items:center;justify-content:center;font-weight:800;margin-right:8px;font-size:.9rem}
table.informe{width:100%;border-collapse:collapse;font-size:.9rem}
table.informe th,table.informe td{border-bottom:1px solid #E4DEFF;padding:8px 6px;text-align:left}
.modo-adulto{font-family:system-ui,'Segoe UI',Arial,sans-serif}
.explicacion{background:#F5F3FF;border-left:5px solid var(--lila);padding:13px 15px;border-radius:10px;margin:12px 0;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch}
.progreso{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:8px 0}
.progreso div{height:100%;background:linear-gradient(90deg,var(--menta),var(--sol));width:0%;transition:width .5s}
.progreso.mision div{background:#FF8A3D}
.confianza{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.confianza .suave{margin-right:4px}
.chip-conf{background:#F1EADF;color:#5F574E;border:2px solid transparent;border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:800;box-shadow:none}
.chip-conf.sel{background:#E6F3F2;color:#0A5C59;border-color:#0E7C78}
.cierre-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.cierre-celda{background:#FFF8EE;border-radius:16px;padding:12px;text-align:center}
.cierre-celda .num{display:block;font-size:1.7rem;font-weight:900;line-height:1;color:#241F1A}
.cierre-celda .sub{display:block;font-size:.8rem;color:#5F574E;font-weight:700;margin-top:4px}
.cierre-tema{display:flex;justify-content:space-between;gap:8px;background:#F7F4EE;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-size:.92rem;color:#241F1A}
.cierre-tema.sube{background:#DCFCE7}.cierre-tema.pend{background:#FDE7C8}
.chips-proxima{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chips-proxima button{background:#fff;color:#0A5C59;border:2px solid #0E7C78;border-radius:99px;padding:9px 14px;font-size:.9rem;box-shadow:none}
.chips-proxima button.sel{background:#FF8A3D;color:#241F1A;border-color:#FF8A3D}
.btn-accion{background:#FF8A3D;color:#241F1A;width:100%;font-size:1.12rem;font-weight:900;box-shadow:0 4px 0 #D9641A}
.btn-accion:active{box-shadow:0 1px 0 #D9641A}
.contador-pausa{font-size:2.6rem;font-weight:900;text-align:center;color:#0A5C59;margin:6px 0}
.tarjeta-repaso{margin:10px 0;cursor:pointer;transition:transform .2s}
.tarjeta-repaso.girando{transform:rotateY(90deg)}
.tarjeta-repaso .cara-frente{background:linear-gradient(135deg,var(--lila),#7B2FBE);color:#fff;font-weight:800;padding:17px;text-align:center;border-radius:16px;box-shadow:0 4px 0 #5B1E96}
.tarjeta-repaso .cara-dorso{background:#F5F3FF;border:3px solid var(--lila);border-radius:16px;padding:15px;font-size:1rem;line-height:1.7;letter-spacing:.015em}
.tarjeta-repaso.vista{cursor:default}
button:disabled{opacity:.45;cursor:not-allowed}
.respuesta-escrita{width:100%;font-family:inherit;font-size:1.1rem;padding:13px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;margin:8px 0;font-weight:700;color:var(--tinta)}
.respuesta-escrita:focus{outline:none;border-color:var(--sol)}
textarea{width:100%;font-family:inherit;font-size:1rem;padding:11px;border-radius:14px;border:3px solid #E4DEFF;box-sizing:border-box;color:var(--tinta)}
textarea:focus{outline:none;border-color:var(--sol)}
.esquema{background:#F5F3FF;border-radius:16px;padding:12px}
.nodo-centro{background:linear-gradient(135deg,var(--moradoTitulo),var(--lila));color:#fff;font-weight:800;text-align:center;border-radius:99px;padding:11px 16px;margin-bottom:10px;box-shadow:0 4px 0 #2A1266}
.ramas{display:grid;grid-template-columns:1fr;gap:12px}
.rama{border-left:6px solid var(--lila);background:#fff;border-radius:0 14px 14px 0;padding:13px 16px;font-size:1rem;line-height:1.7;letter-spacing:.015em;max-width:60ch;box-shadow:0 2px 8px rgba(20,10,60,.08)}
.rama b{color:var(--moradoTitulo);display:block;margin-bottom:6px}
.rama-estrella{border-left-color:var(--sol);background:#FFF9E8}
.toast-insignia{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFF4D6,#FFE39A);border:3px solid var(--sol);color:#7A4E00;font-weight:800;border-radius:99px;padding:11px 19px;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toastIn .35s ease}
.toast-puntos{position:fixed;top:14px;right:14px;background:#FFC43D;color:#7A4B00;font-weight:900;font-size:15px;padding:8px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:60;animation:toastPuntos 1.5s ease forwards}
@keyframes toastPuntos{0%{opacity:0;transform:translateY(-10px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.confeti{position:fixed;top:-14px;width:10px;height:14px;z-index:55;border-radius:3px;animation:caerConfeti linear forwards}
@keyframes caerConfeti{to{transform:translateY(105vh) rotate(540deg)}}
.pulso{animation:pulsar 1.6s ease-in-out infinite}
@keyframes pulsar{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

var DATOS = {"titulo":"Práctica extra de Inglés — How Can We Reduce Household Waste?: vocabulario en situaciones nuevas, lectura de los gráficos, datos del texto y texto informativo vs. argumentativo","materia":"English","sal":"dab7fd8cdeae93d6ea7a8e43","creditosNecesarios":2,"fiel":false,"voz":true,"temas":[{"id":"x3-vocab","nombre":"Household Waste · Vocabulary in new situations","explicacion":"<b>Vocabulary — definiciones literales del libro (recuadros del glosario):</b><ul><li><b>estimate</b> — If you give an estimate, you give an amount or size that is not exact.</li><li><b>decay</b> — When things decay, they slowly break down and rot.</li></ul><b>Vocabulary — cómo lo usa el texto:</b><ul><li><b>household</b> — “Household waste includes all the trash created by the things we throw away.”</li><li><b>landfills</b> — “When products are thrown away, they often end up in landfills. These are places where trash is buried in the ground.”</li><li><b>pollution</b> — “You can help stop household waste pollution by following the three Rs: reduce, reuse, and recycle.”</li><li><b>litter</b> — “Many household items end up as litter in parks, forests, rivers, lakes, and oceans.”</li><li><b>fines</b> — “The city of Seattle, Washington passed a law in 2015. It requires people to recycle food waste. The city fines people who do not follow the law.”</li><li><b>composting</b> — “You can also turn food and yard waste into dirt. This process is called composting.”</li></ul><b>Ayuda</b> (no es texto del libro): <i>a fine</i> = dinero que se paga como castigo por no cumplir una regla o ley; <i>to fine</i> = poner una multa. <i>Litter</i> = basura tirada donde no va. <i>Pollution</i> = lo que ensucia y daña la tierra, el agua o el aire.","microleccion":"Ejemplo con OTRA palabra del texto (no es del temario): <b>incinerators</b>.<br>Paso 1 — buscá la pista en el texto: «Other trash items are burned in incinerators.» → son lugares donde se QUEMA la basura.<br>Paso 2 — pensá en una situación nueva: «The smoke came from a big building where the city burns trash.»<br>Paso 3 — escribí tu propia oración con la palabra: <b>«Some cities burn their trash in incinerators.»</b><br>Paso 4 — revisá: empieza con mayúscula, tiene sujeto y verbo, termina con punto y la palabra tiene sentido en la oración.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"x3-voc-v1","formato":"escribe","pregunta":"Write the vocabulary word: “Mom thinks our family fills about three bags of trash every week. She did not count them, so the number is not exact. It is an ______.”","pista":"Es la palabra del recuadro amarillo de la primera página: una cantidad aproximada. Empieza con «e».","hashes":["7cefa4f8798010b42eab2c9c7d1cde53c5130fc77c6d619ba0a43691208bc9be","39a8a6bade42d52a00d7bab01faccfbf82af7e5163c53e5abd9d4e251f84a2ce","c9e9b27b3de91da02ef7d8b4632c2515a4a33942f009bc44426895ef27b6fcf0"],"fz":{"3048684b7f145f546c68":"9611c2d2793b55ca","d2a16826b081bfffd9ee":"0b115165c2a0a13f","16e2dee549e36b7687dc":"e1db74b87159442e","dcfbfaa956a70d5ba2d3":"86946d8ec02a6504","74cd50568ecfc186224a":"876ac9433eae7a5b"}},{"id":"x3-voc-v2","formato":"mc","pregunta":"Choose the correct word: “An old log in the forest starts to ______: the wood gets soft and breaks down little by little.”","pista":"Es lo que les pasa a las cosas que se pudren despacio.","hashes":["b4ba44d4efcc7c8921157cec27c7d38257d47146449f4373e19146c5e78bd587"],"opciones":["decay","litter","estimate","fines"]},{"id":"x3-voc-v3","formato":"empareja","pregunta":"Uní cada palabra con la situación que la muestra:","pista":"Composting convierte restos en tierra; landfills son lugares donde se ENTIERRA la basura.","hashes":["0e25bcffceb746489ced2801043cab27acbdff9590f4f7c8a4e831a659b347e9"],"izquierda":["pollution","litter","fines","composting","landfills"],"derecha":["A candy wrapper someone dropped on the sidewalk.","Black smoke from a factory makes the air dirty.","Putting banana peels and leaves in a bin so they turn into dirt.","Huge places where garbage trucks bury trash.","Money people must pay for breaking a rule."]},{"id":"x3-voc-v4","formato":"clasifica","pregunta":"¿Qué palabra completa cada oración?","pista":"Pollution = lo que ensucia. Decay = pudrirse despacio. Fines = multas (dinero).","hashes":["fecf8f5c111eef717732ac9fd6d8018d6c9a9ebb0c5def584f0b383188709d57"],"categorias":["pollution","decay","fines"],"elementos":["Drivers who throw trash out of the car window must pay ___.","Wet leaves ___ much faster than plastic bags.","Pumpkins left outside after Halloween begin to ___.","The river is full of oil and plastic; this ___ hurts the fish.","The sign says there are ___ for parking in the wrong place.","Too many cars on the road cause air ___."]},{"id":"x3-voc-v5","formato":"mc","pregunta":"Which sentence uses the word “litter” correctly?","pista":"Litter es basura tirada en lugares públicos: parques, playas, ríos.","hashes":["d2826564dd16753eaae2d22071c6e8bbb4e465c7871bc8fbd346867ac5835813"],"opciones":["We use litter to measure how much trash we make.","Please pick up the litter so the beach stays clean.","A litter is a place where trash is buried in the ground.","The litter slowly turned into good dirt for the garden."]},{"id":"x3-voc-v6","formato":"oracion","pregunta":"Write your own sentence (4+ words) using the vocabulary word that means “places where trash is buried in the ground.” Use the plural form.","pista":"Empieza con «l». Es una palabra compuesta: land (tierra) + fill (llenar).","hashes":["c63cf89f7e6020942c1d79aaa157bbc414a1cf1c6b7f29d3927606963176664b","2b532068b26ee4de39ba0f892d84a619e9578df91317a714ea099851a92af201"]},{"id":"x3-voc-v7","formato":"oracion","pregunta":"Write your own sentence (4+ words) using the vocabulary word that describes things that belong to a home and the people who live in it (for example: ___ waste, ___ items).","pista":"Empieza con «h» y viene de la palabra «house» (casa).","hashes":["05f02324c6a9495ac8479e7631fbd1e73355c9812959cc7d125f43ccc8948870"]},{"id":"x3-voc-v8","formato":"arma","pregunta":"Armá una oración que explique qué hace el composting (sobran fichas):","pista":"El composting convierte restos de comida en tierra.","hashes":["f1887ce5e2df2be25d82f55ecbc4b3ea149fa40512b091246f00feaba63ce904"],"fichas":["into","Composting","plastic","food","turns","litter","dirt","scraps"]},{"id":"x3-voc-v9","formato":"porque","pregunta":"Why is “About 300 students eat lunch at our school” an estimate?","pista":"Fijate en la palabra «About» (más o menos).","hashes":["8af350983f678a8f4e14295f99483aa537ad7c3c09891064791361a3c7905957"],"opciones":["Because the sentence is about food","Because 300 is a very big number","Because the students throw away trash","Because the number is not exact; nobody counted every student"]}]},{"id":"x3-graficos","nombre":"Household Waste · Reading the graphs: pie chart and bar graph","explicacion":"<b>Gráfico circular del libro (pie chart): AMERICAN WASTE (including recyclables)</b><ul><li>paper products 27.4%</li><li>food waste 14.5%</li><li>plastics 12.7%</li><li>yard waste 10.5%</li><li>metal 8.9%</li><li>rubber, leather, and fabrics 8.7%</li><li>wood 6.9%</li><li>other 5.6%</li><li>glass 4.8%</li></ul><b>Gráfico de barras del libro (bar graph): American Recycling Rates From 1960 to 2010</b> — eje vertical: PERCENT OF WASTE RECYCLED; eje horizontal: YEAR.<ul><li>1960: 6.4%</li><li>1970: 6.6%</li><li>1980: 9.6%</li><li>1990: 16.0%</li><li>2000: 28.5%</li><li>2010: 34.0%</li></ul><b>Ayuda para leer gráficos</b> (no es texto del libro):<ul><li>Primero leé el <b>título</b>: te dice de qué trata el gráfico.</li><li>En un <b>pie chart</b> cada parte es un pedazo del total (100%). La parte más grande es el número más grande.</li><li>En un <b>bar graph</b> la barra más alta es el número más grande. Leé el año abajo y el porcentaje arriba de la barra.</li><li>El gráfico es <b>evidencia</b>: sus números apoyan lo que dice el texto (por ejemplo, «Paper makes up more than one-quarter of the materials Americans throw away» → paper products 27.4%).</li></ul>","microleccion":"Ejemplo con OTRO gráfico (inventado, no es del libro): «Bikes at our school» — 2021: 12 bikes · 2022: 18 bikes · 2023: 25 bikes.<br>Paso 1 — título: cuenta bicicletas por año.<br>Paso 2 — ¿qué año tiene la barra más alta? 2023 (25).<br>Paso 3 — ¿cuánto subió de 2022 a 2023? 25 − 18 = <b>7</b>.<br>Paso 4 — conclusión en una oración: <b>«More students came by bike every year.»</b><br>Para un pie chart: si «apples 30%» y «pears 20%», juntas son 30 + 20 = <b>50%</b>, o sea la mitad (one-half).","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"x3-gra-v1","formato":"mc","pregunta":"Look at the pie chart. Which type of waste is the SECOND largest part?","pista":"La más grande es paper products. Buscá el número que le sigue.","hashes":["440cda136a724d5c607524e235e8354d408afa7d57795d19d889f090ed3621de"],"contexto":"Pie chart “AMERICAN WASTE (including recyclables)”: paper products 27.4% · food waste 14.5% · plastics 12.7% · yard waste 10.5% · metal 8.9% · rubber, leather, and fabrics 8.7% · wood 6.9% · other 5.6% · glass 4.8%","opciones":["food waste","paper products","yard waste","plastics"]},{"id":"x3-gra-v2","formato":"escribe","pregunta":"Add food waste and yard waste. What percent of American waste do they make together? Write only the number.","pista":"Sumá 14.5 + 10.5.","hashes":["8a75809372a10d7d0fcc430fc015007e371e9035a74c798a6527a8d4bb77620e","accd3f6a003f9436369f8b90e3a76e8c6217f524d898114a96f69a66f7409f78","bec9746813748695de3f0f1767dec908e1ab52cc027f7b3c4a1098d43420f857","2a4a6969246dd10521cf9fdd4bcd01850e3847792883f1bba153cbcfa85f19dc","a78e83b484cc7c44ae3fb6dba2479d019e89e4acf2018303dc12a867ce61f235"],"contexto":"Pie chart “AMERICAN WASTE (including recyclables)”: paper products 27.4% · food waste 14.5% · plastics 12.7% · yard waste 10.5% · metal 8.9% · rubber, leather, and fabrics 8.7% · wood 6.9% · other 5.6% · glass 4.8%"},{"id":"x3-gra-v3","formato":"verifica","pregunta":"¿Es cierto que glass (vidrio) es la parte MÁS PEQUEÑA del gráfico circular?","pista":"Compará glass con «other» y con wood: ¿cuál número es el menor?","hashes":["764f5044952c423542f38e7afc655b463215afeb46e29d5d7967313e9a89923b"],"contexto":"Pie chart “AMERICAN WASTE (including recyclables)”: paper products 27.4% · food waste 14.5% · plastics 12.7% · yard waste 10.5% · metal 8.9% · rubber, leather, and fabrics 8.7% · wood 6.9% · other 5.6% · glass 4.8%","opciones":["Sí","No"]},{"id":"x3-gra-v4","formato":"ordena","pregunta":"Ordená estos tipos de basura del MÁS GRANDE al más pequeño según el gráfico circular:","pista":"Compará los porcentajes: 27.4 es el mayor.","hashes":["22594fb48e5f1a58ec3cd21dbdcf4b6d8e0dbc78046f4bff67d65b534f7f4be9"],"contexto":"Pie chart “AMERICAN WASTE (including recyclables)”: paper products 27.4% · food waste 14.5% · plastics 12.7% · yard waste 10.5% · metal 8.9% · rubber, leather, and fabrics 8.7% · wood 6.9% · other 5.6% · glass 4.8%","elementos":["food waste","metal","yard waste","paper products","plastics"]},{"id":"x3-gra-v5","formato":"mc","pregunta":"In which year did Americans recycle 16.0% of their waste?","pista":"Buscá la barra que tiene 16.0% arriba y mirá el año de abajo.","hashes":["9955a4cca28f66dfab11ac806d58939b45375cfbca80c5df66ff799bdbc9b683"],"contexto":"Bar graph “American Recycling Rates From 1960 to 2010” (PERCENT OF WASTE RECYCLED by YEAR): 1960 → 6.4% · 1970 → 6.6% · 1980 → 9.6% · 1990 → 16.0% · 2000 → 28.5% · 2010 → 34.0%","opciones":["1990","2000","1970","1980"]},{"id":"x3-gra-v6","formato":"escribe","pregunta":"How many percentage points did the recycling rate go up from 2000 to 2010? Write only the number.","pista":"Restá: el porcentaje de 2010 menos el porcentaje de 2000.","hashes":["5e75b78f68c7d242568ff056d9fb63f3c64a9cdf4e0d68d478a8769627429a08","d57fd1c834d93379e3f2af6879ae670f553dcb07010ffbf66fcb0601ed76b305","6f9f2ba4d37a3ee350934cc75eef00bdc4ff5edcdd927adf0a423493251f829c","72ab726a52598fc0e03afe37ec0f65ee8c8245798907cdf358a7eb9a648fbba6"],"contexto":"Bar graph “American Recycling Rates From 1960 to 2010” (PERCENT OF WASTE RECYCLED by YEAR): 1960 → 6.4% · 1970 → 6.6% · 1980 → 9.6% · 1990 → 16.0% · 2000 → 28.5% · 2010 → 34.0%"},{"id":"x3-gra-v7","formato":"porque","pregunta":"What is the main idea of the bar graph?","pista":"Fijate si las barras se hacen más altas o más bajas con los años. 34% no es todo (100%).","hashes":["4b2d269158860538c8d006b6f1a023efb0c42b44f5b0bf2ed45b08c7edf35a2d"],"contexto":"Bar graph “American Recycling Rates From 1960 to 2010” (PERCENT OF WASTE RECYCLED by YEAR): 1960 → 6.4% · 1970 → 6.6% · 1980 → 9.6% · 1990 → 16.0% · 2000 → 28.5% · 2010 → 34.0%","opciones":["By 2010, Americans recycled all of their waste","From 1960 to 2010, Americans recycled less and less","Recycling stayed the same from 1960 to 2010","From 1960 to 2010, Americans recycled a bigger part of their waste"]},{"id":"x3-gra-v8","formato":"clasifica","pregunta":"¿Qué gráfico del texto usarías para responder cada pregunta?","pista":"El pie chart muestra DE QUÉ está hecha la basura. El bar graph muestra cómo cambió el reciclaje POR AÑO.","hashes":["2fa24909968a302525a35d4b26caf6317c560a24cf4a04952de5e0d87cce9652"],"categorias":["Pie chart: American Waste","Bar graph: American Recycling Rates"],"elementos":["Which material do Americans throw away the most?","Is there more wood or more metal in American trash?","What part of American trash is plastics?","What percent of waste was recycled in 1960?","Was more waste recycled in 1980 or in 2000?","How did recycling change over the years?"]},{"id":"x3-gra-v9","formato":"arma","pregunta":"Armá una conclusión verdadera sobre el gráfico de barras (sobran fichas):","pista":"Compará cada barra con la anterior: 6.4, 6.6, 9.6, 16.0, 28.5, 34.0.","hashes":["c633b39f8eb7e07df117e0181b67856460befef0610943e0c24ee8a03fd90fee"],"contexto":"Bar graph “American Recycling Rates From 1960 to 2010” (PERCENT OF WASTE RECYCLED by YEAR): 1960 → 6.4% · 1970 → 6.6% · 1980 → 9.6% · 1990 → 16.0% · 2000 → 28.5% · 2010 → 34.0%","fichas":["Recycling","years","went","up","ten","every","down","never"]},{"id":"x3-gra-v10","formato":"porque","pregunta":"Which numbers from the pie chart are the evidence that supports paragraph 6?","pista":"El párrafo habla de TRES materiales: plastic, metal y glass. One-quarter = un cuarto = 25%.","hashes":["1127526bc5d20a73b746d203b23f0e7a4d50d17927dd3321bee12416bfd61cfb"],"contexto":"Paragraph 6: “Another quarter of waste comes from plastic, metal, and glass.” — Pie chart: paper products 27.4% · food waste 14.5% · plastics 12.7% · yard waste 10.5% · metal 8.9% · rubber, leather, and fabrics 8.7% · wood 6.9% · other 5.6% · glass 4.8%","opciones":["wood 6.9% + other 5.6% = 12.5%","plastics 12.7% + metal 8.9% + glass 4.8% = 26.4%, about one-quarter","rubber, leather, and fabrics 8.7%","paper products 27.4%, more than one-quarter"]}]},{"id":"x3-detalles","nombre":"Household Waste · Comprehension: numbers, e-waste, recycling and solutions","explicacion":"<b>Párrafos literales del libro:</b><br><br><b>1</b> Household waste includes all the trash created by the things we throw away. And we throw away many things. In the United States, the average person throws away about 4.5 pounds (2 kilograms) of stuff every day. Only 1.5 pounds (0.7 kg) of that gets recycled or composted. The remaining 3 pounds (1.4 kg) is household waste.<br><b>2</b> What happens when you add up all the household waste Americans create? It comes out to about 164 million tons (149 metric tons) each year. But this is only an estimate from the US government. No one knows the exact amount of household waste Americans create. In fact, some experts believe it might be up to seven times that amount! In any case, a huge number of unwanted items end up in the garbage. And all of this garbage has serious effects on our environment.<br><b>5</b> Paper makes up more than one-quarter of the materials Americans throw away. Paper trash includes things such as notebooks and magazines. It also includes the cardboard and paper packages on the things we buy.<br><b>14</b> People are also finding ways to make better use of all our trash. For example, some clothing is made from recycled plastic bottles. Scientists are also studying whether a certain fungus can eat a common type of plastic. That would help cut back on all the plastic trash that fills up landfills.<br><b>24</b> Electronic waste, or e-waste, contains many toxic materials. But less than 15 percent of e-waste is recycled. That means most e-waste ends up in landfills or incinerators. When e-waste is buried or burned, the toxic materials can be released into the land, water, and air.<br><b>25</b> E-waste contains a high amount of lead. If e-waste is not disposed of properly, lead can leach into people’s water supplies. When people drink this water, it can damage their kidneys. It also damages their blood and their nervous systems.<br><b>30</b> The third most important step is recycle. When it is time to get rid of something, make every effort to recycle it rather than throwing it in the trash. In most areas, waste disposal companies provide separate recycling bins. So people can easily recycle paper, glass, and some kinds of plastic and metal. Some items, such as paint and batteries, are harder to recycle. But many areas have centers where these items can be brought for recycling.<br><b>31</b> Many places have laws that require people to recycle. The city of Austin, Texas has set a goal to cut the amount of trash it sends to landfills to nearly zero by the year 2040. The country of Sweden has nearly achieved this goal. It sends only 1 percent of its trash to landfills.<br><br><b>Pies de foto (captions) del libro:</b><ul><li>“A woman in Seattle shows her three waste bins. Waste in the two large bins will be recycled. Waste in the small black bin will end up in a landfill.”</li><li>“Different types of plastic are given different numbers. Numbers 2, 4, and 5 are the least harmful to people and to the environment.”</li><li>“A worker moves shredded paper at a recycling center. Next, water will be added to the paper and it will be turned into pulp.”</li><li>“Americans recycle 71 percent of their steel cans. But they recycle only 50 percent of their aluminum cans.”</li></ul>","microleccion":"Ejemplo con OTRO texto (inventado): «In our town, each family makes about 10 bags of trash a month. Only 2 bags get recycled. Old batteries must go to the library, where there is a special box.»<br>Pregunta: How many bags are NOT recycled?<br>Paso 1 — buscá los números en el texto: 10 bags en total, 2 recycled.<br>Paso 2 — pensá qué pide la pregunta: los que NO se reciclan → 10 − 2 = <b>8</b>.<br>Pregunta 2: Where do old batteries go? Paso 1 — buscá la palabra clave «batteries». Paso 2 — leé la oración completa: <b>to a special box at the library</b>.<br>Truco: la palabra clave de la pregunta (pounds, year, batteries, lead…) te lleva al párrafo correcto.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"x3-det-v1","formato":"escribe","pregunta":"According to paragraph 1, how many pounds of stuff does the average person in the United States throw away EVERY DAY? Write only the number.","pista":"Buscá «every day» en el párrafo; es el primer número de pounds.","hashes":["70c3506282eee41432816be783bf30442a43070dbc63b13a2c82de84480ef460","ebbcd0e41faa2426fa0b7b6857aa4b42a588a07da46785e601611c1ea123dd70","41577f3c3e7dec915fab5772b65fac42aad17d0a755df34e2bf84378f1b34236","e0f6a1daa0aba4b834b0aeec09e659ced8a197ff528d74a5058269d7c5df1a74"],"contexto":"Paragraph 1: Household waste includes all the trash created by the things we throw away. And we throw away many things. In the United States, the average person throws away about 4.5 pounds (2 kilograms) of stuff every day. Only 1.5 pounds (0.7 kg) of that gets recycled or composted. The remaining 3 pounds (1.4 kg) is household waste."},{"id":"x3-det-v2","formato":"mc","pregunta":"What do some experts believe about the amount of household waste Americans create?","pista":"Leé la oración que empieza con «In fact, some experts believe…».","hashes":["f5694c34bada289dc5d2e744f69c9dd8bf149e9ba2277da3fd2a8b6d6ee91ffa"],"contexto":"Paragraph 2: What happens when you add up all the household waste Americans create? It comes out to about 164 million tons (149 metric tons) each year. But this is only an estimate from the US government. No one knows the exact amount of household waste Americans create. In fact, some experts believe it might be up to seven times that amount!","opciones":["The real amount is much smaller than the estimate","The real amount might be up to seven times bigger","Americans do not create any household waste","The real amount is exactly 164 million tons"]},{"id":"x3-det-v3","formato":"porque","pregunta":"Why can e-waste be dangerous for people’s health?","pista":"Buscá la palabra «lead» (plomo) y qué le pasa a la gente que toma esa agua.","hashes":["edb3d0fb334a3542f2343ee6c6bd94a28cffe4e807e0caf278f29a91226549a6"],"contexto":"Paragraph 25: E-waste contains a high amount of lead. If e-waste is not disposed of properly, lead can leach into people’s water supplies. When people drink this water, it can damage their kidneys. It also damages their blood and their nervous systems.","opciones":["Because e-waste makes the air smell like methane","Because e-waste turns into dirt in two to six months","Because lead from e-waste can leak into water, and drinking it can damage kidneys, blood, and nervous systems","Because old phones are too heavy to carry"]},{"id":"x3-det-v4","formato":"verifica","pregunta":"Según el pie de foto, ¿los plásticos con los números 2, 4 y 5 son los MÁS dañinos?","pista":"«Least harmful» significa «los MENOS dañinos».","hashes":["0750cadab6b3540c5fd158d980420e9bc129d8cdd4ac4f9c6a1483e1b3ecc964"],"contexto":"Caption: “Different types of plastic are given different numbers. Numbers 2, 4, and 5 are the least harmful to people and to the environment.”","opciones":["Sí","No"]},{"id":"x3-det-v5","formato":"clasifica","pregunta":"Según el párrafo 30, ¿cada cosa se recicla fácil en los recipientes de la casa o es más difícil y va a un centro especial?","pista":"Buscá la frase «harder to recycle» y mirá qué ejemplos da.","hashes":["898f17e3b98c181cdbc60b634a0ec4f24deecb6eccdc44195e2e194925883d7f"],"contexto":"Paragraph 30: In most areas, waste disposal companies provide separate recycling bins. So people can easily recycle paper, glass, and some kinds of plastic and metal. Some items, such as paint and batteries, are harder to recycle. But many areas have centers where these items can be brought for recycling.","categorias":["Easy: separate recycling bins","Harder: special recycling centers"],"elementos":["some kinds of plastic and metal","paper","batteries","glass","paint"]},{"id":"x3-det-v6","formato":"escribe","pregunta":"By what year does the city of Austin, Texas want to send nearly zero trash to landfills? Write only the year.","pista":"Buscá «by the year» en el párrafo.","hashes":["05597e55d474930bd56e237bfd3acbfc97c3218f987c41e223962c5b67d68811","55f917b7d66f9acd4570ad4b62d0834341d7b2e8e1899f50195086537ba256e2","2184e13ee094043397aa5c20782f9b4eca8c1a45c116309fc3e3a6c02b838e79"],"contexto":"Paragraph 31: Many places have laws that require people to recycle. The city of Austin, Texas has set a goal to cut the amount of trash it sends to landfills to nearly zero by the year 2040. The country of Sweden has nearly achieved this goal. It sends only 1 percent of its trash to landfills."},{"id":"x3-det-v7","formato":"mc","pregunta":"Which waste will end up in a landfill?","pista":"Los dos recipientes GRANDES se reciclan. ¿Cuál es el pequeño?","hashes":["8c47502e54bd210b66910a2890400f7ac3bb988b91615fbc5aadbe2a7ca2b467"],"contexto":"Caption: “A woman in Seattle shows her three waste bins. Waste in the two large bins will be recycled. Waste in the small black bin will end up in a landfill.” (The bins say GARBAGE, RECYCLE, and FOOD & YARD.)","opciones":["The waste in the green FOOD & YARD bin","The waste in the small black GARBAGE bin","The waste in all three bins","The waste in the blue RECYCLE bin"]},{"id":"x3-det-v8","formato":"empareja","pregunta":"Uní cada cosa con lo que dice el texto sobre ella (párrafos 14 y 31, y un pie de foto):","pista":"Fungus = hongo; los científicos estudian si puede «comer» plástico.","hashes":["318cbc3a28eb85394e9c0214011273726233ec8996d925e60696573443c65d82"],"izquierda":["Some clothing","A certain fungus","Sweden","Shredded paper"],"derecha":["might be able to eat a common type of plastic.","is made from recycled plastic bottles.","gets water added and is turned into pulp.","sends only 1 percent of its trash to landfills."]},{"id":"x3-det-v9","formato":"arma","pregunta":"Párrafo 5: ¿qué ejemplos de basura de papel da el texto? Armá la oración (sobran fichas):","pista":"Las botellas y las baterías no son de papel.","hashes":["bebeaef859fadd4d1220644e79001e66221ac1f4ba1fb1d7ebe89b4ccab616b2"],"fichas":["and","trash","includes","magazines","batteries","Paper","bottles","notebooks"]},{"id":"x3-det-v10","formato":"verifica","pregunta":"Según el párrafo 24, ¿la MAYOR parte de la basura electrónica termina en landfills o incinerators?","pista":"Si se recicla menos del 15%, ¿a dónde va casi todo lo demás?","hashes":["dc2407b3224763f6f33528077d48c33138836f6a447a4bd8cdb9a8ac649f2dc7"],"contexto":"Paragraph 24: Electronic waste, or e-waste, contains many toxic materials. But less than 15 percent of e-waste is recycled. That means most e-waste ends up in landfills or incinerators.","opciones":["Sí","No"]}]},{"id":"x3-tipos","nombre":"Informational text vs. argumentative text: features and author’s purpose","explicacion":"<b>Informational text</b> (texto informativo): gives facts and information to <b>explain or teach</b> about a topic. Features (características): <b>headings</b> (títulos de cada sección), <b>photos with captions</b> (pies de foto), <b>charts and graphs</b> (gráficos), <b>numbers and facts</b> (datos que se pueden comprobar), <b>words in bold or highlighted with definitions</b> (glosario).<br><br><b>Argumentative text</b> (texto argumentativo): the author gives a <b>claim</b> (an opinion or position) and tries to <b>persuade</b> the reader to agree or take action. Features: a clear <b>claim</b>, <b>reasons</b>, <b>evidence</b> (facts and examples) that support the reasons, and a <b>conclusion</b> that repeats the claim or asks the reader to act. Often uses words like <i>should, must, best, let’s</i>.<br><br><b>Ejemplos de “How Can We Reduce Household Waste?”:</b><ul><li>Heading: “Solutions to E-Waste Pollution”</li><li>Caption: “Take good care of your cell phone so it will last a long time.”</li><li>Glossary box: “decay — When things decay, they slowly break down and rot.”</li><li>Graph: “American Recycling Rates From 1960 to 2010”</li><li>Final paragraph: “Household waste is a major problem. But we have the power to solve it. And the solution begins with making smart choices in our everyday lives.”</li></ul><b>Fact vs. opinion:</b> a <b>fact</b> can be checked (proved true); an <b>opinion</b> tells what someone thinks or feels.","microleccion":"Ejemplo con OTRO tema (no es del libro): agua.<br><b>Informativo</b>: «A running tap uses about 6 liters of water per minute.» → solo da un dato que se puede comprobar; no nos pide nada.<br><b>Argumentativo</b>, en 4 partes:<br>1) Claim: «Everyone should turn off the tap while brushing their teeth.»<br>2) Reason: «It saves a lot of clean water.»<br>3) Evidence: «A running tap uses about 6 liters of water per minute.»<br>4) Conclusion: «So, let’s close the tap and save water every day!»<br>Truco: si hay <i>should / must / let’s</i> y el autor quiere convencerte → argumentativo. Si solo explica con datos, títulos y gráficos → informativo.","videoId":null,"videoTitulo":"","imagenUrl":null,"imagenTitulo":"","variantes":[{"id":"x3-tip-v1","formato":"empareja","pregunta":"Uní cada característica de un texto informativo con su ejemplo en “How Can We Reduce Household Waste?”:","pista":"Heading = título de una sección. Caption = texto corto debajo de una foto. Glossary = definición de una palabra.","hashes":["7f1a26fb9de7ef650acdb0a01d2dab8fe8abbbe0ae9cbe24a594984e89dac1d9"],"izquierda":["Heading","Caption","Glossary box","Graph"],"derecha":["Solutions to E-Waste Pollution","Take good care of your cell phone so it will last a long time.","American Recycling Rates From 1960 to 2010","decay — When things decay, they slowly break down and rot."]},{"id":"x3-tip-v2","formato":"porque","pregunta":"Why does the author use headings like “E-Waste” and “Food Waste and Yard Waste”?","pista":"Los títulos de sección organizan el texto, como las etiquetas de los cajones.","hashes":["ec65e53fa45fb57bc0851865c90795968eaa450c6a6e9a5d5fa71b8824769273"],"opciones":["To show how many pounds of trash people make","To tell the reader a funny story","To divide the text into parts so readers can find information about each type of waste","To give the definition of a hard word"]},{"id":"x3-tip-v3","formato":"clasifica","pregunta":"¿Cada fragmento es de un texto informativo o de un texto argumentativo?","pista":"Buscá palabras como «must», «should», «ought to»: el autor quiere convencerte.","hashes":["5dd34d76f128ce9a1e112e163c04debd1a6f66c713a8e730648b8074ed581da5"],"categorias":["Informational text","Argumentative text"],"elementos":["Some people use special bins for their food scraps and yard waste.","Everyone should bring reusable bags. It is the easiest way to help the planet!","Cities ought to fine people who litter, because fines make people think twice.","Electronic waste includes old phones, TVs, and computers.","Our school must start composting, because it would cut our trash in half.","Aluminum cans can be me /* ---------- sha256 puro en JS (sin depender de crypto.subtle) ---------- */
function sha256hex(ascii){
function rr(v,c){return(v>>>c)|(v<<(32-c));}
var mw=Math.pow,ms=mw(2,32),i,j,result='';
var words=[],al=ascii.length*8;
var hash=sha256hex.h=sha256hex.h||[],k=sha256hex.k=sha256hex.k||[],pc=k.length;
var isC={};
for(var cand=2;pc<64;cand++){
if(!isC[cand]){for(i=0;i<313;i+=cand){isC[i]=cand;}
hash[pc]=(mw(cand,.5)*ms)|0;k[pc++]=(mw(cand,1/3)*ms)|0;}}
ascii+='\x80';
while(ascii.length%64-56)ascii+='\x00';
for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return null;
words[i>>2]|=j<<((3-i)%4)*8;}
words[words.length]=(al/ms)|0;words[words.length]=al;
for(j=0;j<words.length;){
var w=words.slice(j,j+=16),oh=hash.slice(0,8);
for(i=16;i<64;i++){var w15=w[i-15],w2=w[i-2];
w[i]=((rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10))+w[i-16])|0;}
for(i=0;i<64;i++){
var a=hash[0],e=hash[4];
var t1=(hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+w[i])|0;
var t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2])))|0;
hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;hash.length=8;}
for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}
for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b>>4).toString(16))+((b&15).toString(16));}
return result;}
function utf8(s){return unescape(encodeURIComponent(s));}
function sha(s){return sha256hex(utf8(s));}

/* ---------- utilidades ---------- */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
function normArma(s){return norm(s).replace(/\s+/g,'');}
function skel(s){
  var t=norm(s).replace(/[^a-z]/g,'');if(!t)return '';
  t=t.replace(/ph/g,'f').replace(/ck/g,'k').replace(/qu/g,'k').replace(/q/g,'k')
    .replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/g(?=[ei])/g,'j')
    .replace(/x/g,'ks').replace(/z/g,'s').replace(/y/g,'i').replace(/w/g,'u')
    .replace(/v/g,'b').replace(/(.)ti(?=[aeiou])/g,'$1s').replace(/h/g,'');
  if(!t)return '';
  var r=t[0]+t.slice(1).replace(/[aeiou]/g,'');
  return r.replace(/(.)\1+/g,'$1');
}
function clavesCasi(sk){var a=[sk];if(sk.length>=4)for(var i=1;i<sk.length;i++){var d=sk.slice(0,i)+sk.slice(i+1);if(a.indexOf(d)<0)a.push(d);}return a;}
/* Devuelve la forma correcta si lo escrito se le parece mucho; null si no. */
function formaCercana(v,escrito){
  if(!v.fz)return null;
  var sk=skel(escrito);if(sk.length<3)return null;
  var cands=clavesCasi(sk);
  for(var i=0;i<cands.length;i++){
    var tag=sha(DATOS.sal+'|'+v.id+'|tag|'+cands[i]).slice(0,20);
    var c=v.fz[tag];if(!c)continue;
    var n=c.length/2,ks='';
    for(var j=0;ks.length<n*2;j++)ks+=sha(DATOS.sal+'|'+v.id+'|fz|'+cands[i]+'|'+j);
    var bytes='';
    for(var b=0;b<n;b++)bytes+=String.fromCharCode(parseInt(c.substr(b*2,2),16)^parseInt(ks.substr(b*2,2),16));
    var txt;try{txt=decodeURIComponent(escape(bytes));}catch(e){continue;}
    if(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+norm(txt)))<0)continue;
    /* largo parecido: evita aceptar otra palabra más corta (p. ej. «plant» por «pollutant») */
    var la=norm(escrito).replace(/[^a-z]/g,'').length,lb=norm(txt).replace(/[^a-z]/g,'').length;
    if(Math.min(la,lb)/Math.max(la,lb)<0.75)continue;
    return txt;
  }
  return null;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(id){return document.getElementById(id);}
function mezclarVista(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- progreso global compartido entre prácticas (lo lee docs/index.html) ---------- */
var SESION=(function(){try{return JSON.parse(localStorage.getItem('sas-sesion')||'null');}catch(e){return null;}})();
var SAS=(function(){
  var CLAVE_G='sas-progreso-v1'+(SESION&&SESION.alias?':'+SESION.alias:'');
  var PUNTOS={respuesta:10,reintento:15,dominado:50,reforzado:20,repasoFinal:25};
  var archivo=(function(){try{var p=location.pathname.split('/').pop();return decodeURIComponent(p||'')||DATOS.sal;}catch(e){return DATOS.sal;}})();
  function hoy(){var d=new Date(),m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
  function vacio(){return {v:1,puntos:0,dias:{},practicas:{}};}
  function cargar(){try{var s=localStorage.getItem(CLAVE_G);var g=s?JSON.parse(s):null;if(!g||g.v!==1)g=vacio();if(!g.dias)g.dias={};if(!g.practicas)g.practicas={};return g;}catch(e){return vacio();}}
  function guardar(g){try{localStorage.setItem(CLAVE_G,JSON.stringify(g));}catch(e){}}
  function dia(g){var h=hoy();if(!g.dias[h])g.dias[h]={segundos:0,respondidas:0,puntos:0,misiones:0};return g.dias[h];}

    /* seguimiento por materia (lo lee docs/materia.html): tiempo, puntos y misiones de esta práctica, por día, y sus sesiones */

    return p;
  }
  function diaP(p){var h=hoy();if(!p.dias[h])p.dias[h]={segundos:0,respondidas:0,puntos:0,misiones:0};return p.dias[h];}
  /* sesión en curso (desde que se abrió la página): se cierra al terminar la misión o la práctica, o al salir */
  var sesion={inicio:new Date().toISOString(),preguntas:0,segundos:0,puntos:0,dominados:[]};

    if(sesion.preguntas===0&&sesion.segundos<30)return;
    var p=practica(g);
    p.sesiones.push({t:new Date().toISOString(),tipo:tipo,preguntas:sesion.preguntas,segundos:sesion.segundos,puntos:sesion.puntos,dominados:sesion.dominados.slice()});
    if(p.sesiones.length>40)p.sesiones=p.sesiones.slice(-40);
    sesion={inicio:new Date().toISOString(),preguntas:0,segundos:0,puntos:0,dominados:[]};
  }
  function sumar(g,n){g.puntos=(g.puntos||0)+n;dia(g).puntos+=n;var p=practica(g);p.puntos+=n;diaP(p).puntos+=n;sesion.puntos+=n;}
  function sincronizar(){
    var g=cargar(),p=practica(g);
    p.titulo=DATOS.titulo;p.materia=DATOS.materia;
    p.respondidas=estado.respondidas;p.ultimaVez=new Date().toISOString();
    DATOS.temas.forEach(function(t){var s=estado.temas[t.id];p.temas[t.id]={nombre:t.nombre,estado:s.dominado?'dominado':(s.intentos>0?'progreso':'pendiente'),fallos:s.fallos,intentos:s.intentos,reforzado:!!s.reforzado};});
    guardar(g);
  }
  function respuesta(ok,reintento){

  function reforzado(){var g=cargar();sumar(g,PUNTOS.reforzado);guardar(g);mostrarPuntos(PUNTOS.reforzado);}
  function repasoFinal(){var g=cargar();sumar(g,PUNTOS.repasoFinal);guardar(g);mostrarPuntos(PUNTOS.repasoFinal);}
  function misionCompleta(datos){var g=cargar();dia(g).misiones++;var p=practica(g);p.misiones++;diaP(p).misiones++;cerrarSesion(g,(datos&&datos.final)?'completa':'mision');guardar(g);enviar('mision',datos||{});}
  function practicaCompleta(){var g=cargar();var p=practica(g);p.completada=true;p.ultimaVez=new Date().toISOString();guardar(g);enviar('practica_completa',{titulo:DATOS.titulo,materia:DATOS.materia});}
  /* minutos activos: solo cuenta con una pregunta en pantalla y la pestaña visible */
  var activo=false,visible=true,ultimoTic=Date.now();
  function tic(){
    var ahora=Date.now();
    if(activo&&visible){
      var seg=Math.min(30,Math.round((ahora-ultimoTic)/1000));
      if(seg>0){var g=cargar();dia(g).segundos+=seg;var p=practica(g);p.segundos+=seg;diaP(p).segundos+=seg;p.ultimaVez=new Date().toISOString();guardar(g);segPendientes+=seg;sesion.segundos+=seg;}
    }
    ultimoTic=ahora;
  }
  setInterval(tic,10000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState!=='visible'){tic();visible=false;}else{visible=true;ultimoTic=Date.now();}});
  window.addEventListener('pagehide',function(){tic();var g=cargar();cerrarSesion(g,'parcial');guardar(g);});
  function setActivo(v){tic();if(!v)enviarActivo();activo=!!v;ultimoTic=Date.now();}
  function mostrarPuntos(n){

    }catch(e){}
  }
  function totales(){var g=cargar();return {puntos:g.puntos||0,hoy:dia(g)};}
  function confianza(nivel,ok){var g=cargar();g.confianza=g.confianza||{};var c=g.confianza[nivel]=g.confianza[nivel]||{ok:0,fallo:0};if(ok)c.ok++;else c.fallo++;guardar(g);}
  function racha(){
    var g=cargar();function clave(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x;}
    function act(k){var d=g.dias[k];return !!(d&&((d.respondidas||0)>0||(d.misiones||0)>0));}
    var d=new Date(),n=0;if(!act(clave(d)))d.setDate(d.getDate()-1);

  var TELE=(function(){try{return localStorage.getItem('sas-telemetria')||'';}catch(e){return '';}})();

    if(!TELE||!SESION||!SESION.alias)return;
    try{
      var cuerpo=JSON.stringify({alias:SESION.alias,tipo:tipo,practica:archivo,datos:datos||{},t:new Date().toISOString()});
      if(navigator.sendBeacon){navigator.sendBeacon(TELE,new Blob([cuerpo],{type:'text/plain'}));}
      else{fetch(TELE,{method:'POST',body:cuerpo,keepalive:true,mode:'no-cors'});}
    }catch(e){}
  }
  function enviarActivo(){if(segPendientes>0){enviar('activo',{segundos:segPendientes});segPendientes=0;}}

/* ---------- lectura en voz alta ---------- */
var vozElegida=null;
function elegirVoz(){
  try{
    var voces=speechSynthesis.getVoices().filter(function(v){return /^es/i.test(v.lang);});
    if(!voces.length)return null;
    function puntos(v){
      var n=v.name.toLowerCase(),p=0;
      if(n.indexOf('natural')>=0)p+=6;
      if(n.indexOf('neural')>=0)p+=6;
      if(n.indexOf('online')>=0)p+=3;
      if(n.indexOf('google')>=0)p+=4;
      if(/m[oó]nica|paulina|dalia|sabina|luciana|camila|jorge/.test(n))p+=2;
      var l=v.lang.toLowerCase();
      if(l.indexOf('es-us')===0||l.indexOf('es-419')===0||l.indexOf('es-mx')===0||l.indexOf('es-cr')===0)p+=2;
      return p;
    }
    voces.sort(function(a,b){return puntos(b)-puntos(a);});
    return voces[0];
  }catch(e){return null;}
}
try{speechSynthesis.addEventListener('voiceschanged',function(){vozElegida=elegirVoz();});}catch(e){}
function leerEnVoz(texto){
  try{
    var limpio=String(texto).replace(/<[^>]*>/g,' ')
      .replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g,' ')
      .replace(/[\u2600-\u27BF\u2B00-\u2BFF\uFE0F\u2716\u2714]/g,' ')
      .replace(/→/g,', entonces, ')
      .replace(/\s+/g,' ').trim();
    if(!limpio)return;
    if(!vozElegida)vozElegida=elegirVoz();
    speechSynthesis.cancel();
    var frases=limpio.match(/[^.!?…]+[.!?…]*/g)||[limpio];
    frases.forEach(function(f){
      f=f.trim();
      if(!f)return;
      var u=new SpeechSynthesisUtterance(f);
      u.lang=(vozElegida&&vozElegida.lang)||'es-US';
      if(vozElegida)u.voice=vozElegida;
      u.rate=0.98;
      u.pitch=1.05;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

try{sonidoOn=localStorage.getItem('practica-sonido')!=='off';}catch(e){}
function tono(secuencia){
  if(!sonidoOn)return;
  try{
    var ctx=tono.ctx=tono.ctx||new (window.AudioContext||window.webkitAudioContext)();
    var t=ctx.currentTime;
    secuencia.forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0.0001,t+p[1]);
      g.gain.exponentialRampToValueAtTime(0.12,t+p[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+p[2]);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+p[1]);o.stop(t+p[1]+p[2]+0.05);
    });
  }catch(e){}
}

/* ---------- selección de variantes ---------- */
function elegirVariante(tema,evitarFormato){
  var st=estado.temas[tema.id];
  if(DATOS.fiel){
    var sig=null;
    for(var k=0;k<tema.variantes.length;k++){if(st.usadas.indexOf(tema.variantes[k].id)<0){sig=tema.variantes[k];break;}}
    if(!sig)sig=tema.variantes[tema.variantes.length-1];
    if(st.usadas.indexOf(sig.id)<0)st.usadas.push(sig.id);
    st.ultimoFormato=sig.formato;
    return sig;
  }
  var cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0 && v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return v.formato!==evitarFormato;});
  if(!cand.length)cand=tema.variantes.filter(function(v){return st.usadas.indexOf(v.id)<0;});
  if(!cand.length){st.usadas=[];cand=tema.variantes.slice();}
  var v=cand[Math.floor(Math.random()*cand.length)];
  if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);
  st.ultimoFormato=v.formato;
  return v;
}

/* ---------- planificador ---------- */
function insertarEncuentro(temaId,distancia){
  var pos=Math.min(estado.cola.length,distancia);
  estado.cola.splice(pos,0,temaId);
}
function siguiente(){
  if(!estado.cola.length){
    var pend=temasPendientes();
    if(!pend.length){mostrarFinal();return;}
    estado.orden.forEach(function(id){if(pend.some(function(t){return t.id===id;}))estado.cola.push(id);});
  }
  // evitar dos encuentros seguidos del mismo tema si hay alternativa
  if(!DATOS.fiel&&estado.actual&&estado.cola.length>1&&estado.cola[0]===estado.actual.temaId){
    estado.cola.push(estado.cola.shift());
  }
  var temaId=estado.cola.shift();
  var tema=temaPorId(temaId);
  if(estado.temas[temaId].dominado){siguiente();return;}
  var evitar=(estado.actual&&estado.actual.temaId===temaId)?estado.actual.variante.formato:estado.temas[temaId].ultimoFormato;
  var v=elegirVariante(tema,evitar);
  estado.actual={temaId:temaId,variante:v};
  pintarPregunta(tema,v);
}

  var bOir=el('btn-oir-preg');

  el('btn-pista').addEventListener('click',function(){

    case 'arma':
      function pintarConstruccion(){

        construccion.forEach(function(f,i){

        var z=el('lista-ordena');z.innerHTML='';

          dn.addEventListener('click',function(){if(i<elems.length-1){var t=elems[i+1];elems[i+1]=elems[i];elems[i]=t;pintarOrden();}});
          f.appendChild(up);f.appendChild(dn);z.appendChild(f);

        });

        responder(tema,v,partes.sort().join(';'));
      });
      break;

      var enviarEscrita=function(){
        var val=inp.value.trim();
        if(!val){avisoCompletar();return;}
        var exacta=v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+norm(val)))>=0;
        if(!exacta){var cerca=formaCercana(v,val);if(cerca){responderParcial(tema,v,val,cerca);return;}}
        responder(tema,v,norm(val));
      };
      el('btn-comprobar').addEventListener('click',enviarEscrita);
      inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarEscrita();});
      inp.focus();
      break;
    case 'oracion':
      var inpO=el('respuesta-texto');
      var enviarOracion=function(){
        var val=inpO.value.trim();
        if(!val){avisoCompletar();return;}
        var palabras=val.split(/\s+/);
        if(palabras.length<4){
          el('feedback').innerHTML='<div class="feedback fb-nube">Escribí una oración COMPLETA, de al menos 4 palabras 😊</div>';
          return;
        }
        var ok=palabras.some(function(p){
          var pn=norm(p).replace(/[^a-z0-9ñü]/g,'');
          return pn&&v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+pn))>=0;
        });
        estado.ultimaOracion=val;
        responder(tema,v,null,ok);
      };
      el('btn-comprobar').addEventListener('click',enviarOracion);
      inpO.addEventListener('keydown',function(ev){if(ev.key==='Enter')enviarOracion();});
      inpO.focus();
      break;
  }
}
function avisoCompletar(){

/* ---------- respuesta ---------- */
function responder(tema,v,canonicaUsuario,okPrevio){
  var st=estado.temas[tema.id];
  var reintento=st.fallos>0;
  st.intentos++;
  var ok=(okPrevio!==undefined&&canonicaUsuario===null)?okPrevio:(v.hashes.indexOf(sha(DATOS.sal+'|'+v.id+'|'+canonicaUsuario))>=0);
  if(ok&&v.formato==='oracion'&&estado.ultimaOracion){
    (st.oraciones=st.oraciones||[]).push(estado.ultimaOracion);
    estado.ultimaOracion=null;
  }
  estado.respondidas++;
  SAS.respuesta(ok,reintento);
  var conf=(estado.actual&&estado.actual.confianza)||null;
  if(conf)SAS.confianza(conf,ok);
  document.querySelectorAll('.chip-conf').forEach(function(x){x.disabled=true;});
  if(estado.fase==='repaso'){responderRepaso(tema,st,ok);return;}
  if(DATOS.fiel){
    if(ok){st.creditos++;sonidoBien();el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐</div>';}
    else{st.fallos++;sonidoSuave();el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Seguimos con la siguiente.</div>';}
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;SAS.dominado(tema.nombre);if(st.fallos===0)celebrarDominio();}
    guardarProgreso();
    desactivarZona();
    setTimeout(function(){
      if(!ok&&st.fallos>=2&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
      despuesDeResponder();
    },1400);
    return;
  }
  if(ok&&conf==='adivino'){
    // acertar adivinando no cuenta como dominio: el tema vuelve pronto
    insertarEncuentro(tema.id,2);
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Salió! ⭐ Pero dijiste que ibas adivinando, así que este tema vuelve pronto para asegurarlo de verdad.</div>';
  }else if(ok){
    st.creditos++;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;SAS.dominado(tema.nombre);celebrarDominio();}
    else{insertarEncuentro(tema.id,3);} // vuelve más adelante: dominio en encuentros separados
    sonidoBien();
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Muy bien! ⭐ '+(st.dominado?'¡Planeta conquistado!':'Este tema volverá una vez más para asegurarlo.')+'</div>';
  }else{
    st.fallos++;
    insertarEncuentro(tema.id,2); // vuelve pronto, con otra variante de otro formato
    sonidoSuave();
    var msgNo=conf==='seguro'
      ?'Todavía no 💪 Estabas seguro, y justo esos son los que mejor se aprenden cuando se corrigen. Mirá el ejemplo.'
      :'Todavía no 💪 Este tema volverá más adelante con otra pregunta.';
    el('feedback').innerHTML='<div class="feedback fb-nube">'+msgNo+'</div>';
  }
  guardarProgreso();
  desactivarZona();
  var umbralMicro=(MISION.activa||conf==='seguro')?1:2;
  setTimeout(function(){
    if(!ok&&st.fallos>=umbralMicro&&!st.microVista){st.microVista=true;mostrarMicro(tema);return;}
    despuesDeResponder();
  },1400);
}
/* Ortografía aproximada: la idea está bien pero la palabra no está bien escrita.
   Cuenta como PARCIALMENTE válida (medio crédito) y muestra cómo se escribe. */
function responderParcial(tema,v,escrito,correcto){
  var st=estado.temas[tema.id];
  var reintento=st.fallos>0;
  st.intentos++;
  estado.respondidas++;
  SAS.respuesta(true,reintento);
  (st.ortografia=st.ortografia||[]).push({escrito:escrito,correcto:correcto});
  document.querySelectorAll('.chip-conf').forEach(function(x){x.disabled=true;});
  var msg='<div class="feedback fb-nube">✍️ ¡Casi! La idea está bien, pero se escribe así: <b style="font-size:1.25em;letter-spacing:.04em">'+esc(correcto)+'</b><br><span class="suave">Escribiste: «'+esc(escrito)+'». Cuenta como <b>parcialmente válida</b>. Copiala una vez en tu cuaderno para recordarla.</span></div>';
  desactivarZona();
  sonidoSuave();
  function boton(fn){var b=document.createElement('button');b.className='btn-principal';b.style.marginTop='10px';b.textContent='Seguir ▶';b.addEventListener('click',fn);el('feedback').appendChild(b);}
  if(estado.fase==='repaso'){
    st.reforzado=true;guardarProgreso();
    el('feedback').innerHTML=msg;boton(avanzarRepaso);return;
  }
  if(DATOS.fiel){
    st.creditos+=0.5;
    if(st.usadas.length<tema.variantes.length){insertarEncuentro(tema.id,0);}
    else{st.dominado=true;SAS.dominado(tema.nombre);}
  }else{
    st.creditos+=0.5;
    if(st.creditos>=DATOS.creditosNecesarios){st.dominado=true;SAS.dominado(tema.nombre);celebrarDominio();}
    else insertarEncuentro(tema.id,3);
  }
  guardarProgreso();
  el('feedback').innerHTML=msg;boton(despuesDeResponder);
}
function desactivarZona(){
  el('zona-respuesta').querySelectorAll('button,select').forEach(function(x){x.disabled=true;});
  var bp=el('btn-pista');if(bp)bp.disabled=true;
  var bg=el('btn-guardar');if(bg)bg.disabled=true;
}
function despuesDeResponder(){
  if(MISION.activa){
    var hechas=misionHechas();
    if(hechas>=MISION.meta){SAS.setActivo(false);SAS.misionCompleta({preguntas:hechas,materia:DATOS.materia});guardarProgreso();pintarCierreMision(false);return;}
    if(!MISION.pausaHecha&&MISION.meta>=6&&hechas===Math.floor(MISION.meta/2)){MISION.pausaHecha=true;pausaMovimiento();return;}
    siguiente();return;
  }
  if(estado.respondidas%6===0){estado.rondas++;pausaRonda();return;}
  siguiente();
}
function pausaMovimiento(){
  SAS.setActivo(false);

  o.querySelector('#btn-seguir-pausa').addEventListener('click',function(){clearInterval(iv);o.remove();siguiente();});

/* ---------- fase de repaso final ---------- */
function tarjetasDeTema(t){
  var cartas=[];
  var exp=String(t.explicacion||'').trim();
  if(exp){
    if(exp.indexOf('<')>=0){cartas.push({frente:'Idea clave',dorso:exp,html:true});}
    else{
      var partes=exp.split('. ').map(function(p){p=p.trim();return p?(/[.!?:]$/.test(p)?p:p+'.'):'';}).filter(Boolean);
      var maxCartas=5,tam=Math.max(1,Math.ceil(partes.length/maxCartas));
      for(var i=0;i<partes.length;i+=tam){cartas.push({frente:'Idea '+(cartas.length+1),dorso:partes.slice(i,i+tam).join(' '),html:false});}
    }
  }
  cartas.push({frente:'⭐ Ejemplo paso a paso',dorso:t.microleccion,html:true});
  return cartas;
}
function graficoSvg(g){
  var h='';
  if(g.tipo==='barra'){
    var w=310,c=28,gap=2;
    h='<svg viewBox="0 0 '+w+' 36" style="max-width:340px;width:100%;display:block;margin:10px auto" role="img" aria-label="Barra dividida en 10 partes, '+g.pintadas+' pintadas">';
    for(var i=0;i<10;i++){
      h+='<rect x="'+(i*(c+gap)+2)+'" y="3" width="'+c+'" height="30" rx="4" fill="'+(i<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="2"/>';
    }
    h+='</svg>';
  }else{
    var cel=26,gp=2,tam=10*(cel+gp)+4;
    h='<svg viewBox="0 0 '+tam+' '+tam+'" style="max-width:300px;width:100%;display:block;margin:10px auto" role="img" aria-label="Cuadrícula de 100 partes, '+g.pintadas+' pintadas">';
    for(var f=0;f<10;f++)for(var col=0;col<10;col++){
      var idx=f*10+col;
      h+='<rect x="'+(col*(cel+gp)+2)+'" y="'+(f*(cel+gp)+2)+'" width="'+cel+'" height="'+cel+'" rx="3" fill="'+(idx<g.pintadas?'#118AB2':'#FFFFFF')+'" stroke="#2D2A5E" stroke-width="1.5"/>';
    }
    h+='</svg>';
  }
  return h;
}

  if(bOirR)bOirR.addEventListener('click',function(){
    leerEnVoz(cartas.map(function(c){return c.dorso;}).join('. '));
  });
  function desbloquear(){if(!completado){completado=true;el('btn-demostrar').disabled=false;}}
  document.querySelectorAll('[data-modo]').forEach(function(b){
    b.addEventListener('click',function(){
      var m=b.getAttribute('data-modo');

      }
      if(m==='tarjetas')modoTarjetas(cartas,desbloquear);

function modoTarjetas(cartas,alCompletar){
  var vistas=0;
  var h='<p class="suave">Tocá cada tarjeta para descubrir la idea.</p><div id="cartas-repaso">';
  cartas.forEach(function(c,i){
    h+='<div class="tarjeta-repaso" data-i="'+i+'"><div class="cara-frente">'+esc(c.frente)+' · tocá para ver 👆</div><div class="cara-dorso oculto"></div></div>';
  });
  h+='</div><p class="suave" id="contador-cartas">Tarjetas vistas: 0 de '+cartas.length+'</p>';
  el('zona-modo').innerHTML=h;
  document.querySelectorAll('.tarjeta-repaso').forEach(function(card){
    card.addEventListener('click',function(){
      if(card.classList.contains('vista'))return;
      var i=parseInt(card.getAttribute('data-i'),10);
      card.classList.add('girando');
      setTimeout(function(){
        card.querySelector('.cara-frente').classList.add('oculto');
        var dorso=card.querySelector('.cara-dorso');
        if(cartas[i].html)dorso.innerHTML=cartas[i].dorso;else dorso.textContent=cartas[i].dorso;
        dorso.classList.remove('oculto');
        card.classList.remove('girando');
        card.classList.add('vista');
        vistas++;
        el('contador-cartas').textContent='Tarjetas vistas: '+vistas+' de '+cartas.length;
        if(vistas===cartas.length)alCompletar();
      },200);
    });
  });
}

function preguntaRefuerzo(tema){
  var st=estado.temas[tema.id];
  // preferir formatos generativos (escribir/armar): recordar produciendo fija más la memoria
  var gen=tema.variantes.filter(function(x){return (x.formato==='escribe'||x.formato==='arma')&&st.usadas.indexOf(x.id)<0;});
  var v;
  if(gen.length){v=gen[Math.floor(Math.random()*gen.length)];if(st.usadas.indexOf(v.id)<0)st.usadas.push(v.id);st.ultimoFormato=v.formato;}
  else{v=elegirVariante(tema,st.ultimoFormato);}
  estado.actual={temaId:tema.id,variante:v};
  pintarPregunta(tema,v);
}
function responderRepaso(tema,st,ok){
  desactivarZona();
  if(ok){
    st.reforzado=true;
    SAS.reforzado();
    guardarProgreso();
    confeti();
    sonidoBien();
    otorgarInsignia('no-me-rindo');
    el('feedback').innerHTML='<div class="feedback fb-bien">¡Eso es! 🌟 Tema reforzado.</div>';
    setTimeout(avanzarRepaso,1400);
  }else{
    st.fallos++;
    estado.refuerzoIntentos++;
    guardarProgreso();
    sonidoSuave();
    if(estado.refuerzoIntentos<2){
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no 💪 Mirá el ejemplo otra vez y probá con otra pregunta.</div>';
      setTimeout(function(){
        mostrarOverlay('⭐ Ejemplo paso a paso','<div class="explicacion">'+tema.microleccion+'</div>','Probar otra vez',function(){preguntaRefuerzo(tema);});
      },1400);
    }else{
      el('feedback').innerHTML='<div class="feedback fb-nube">Todavía no — este tema lo seguimos practicando otro día 💙</div>';
      setTimeout(avanzarRepaso,1400);
    }
  }
}
function avanzarRepaso(){
  estado.refuerzoIntentos=0;
  estado.repasoIdx++;
  if(estado.repasoIdx<estado.repasoLista.length){pintarRepaso(temaPorId(estado.repasoLista[estado.repasoIdx]));}
  else{informeFinal();}
}

/* ---------- informe final ---------- */
function mostrarFinal(){
  SAS.setActivo(false);
  if(DATOS.fiel){informeFinal();return;}
  if(estado.fase==='normal'){
    var lista=DATOS.temas.filter(function(t){var st=estado.temas[t.id];return st.fallos>0||(st.intentos>0&&!st.dominado);}).map(function(t){return t.id;});
    if(lista.length){
      var h='<div class="carta" style="text-align:center"><h1>🔁 ¡Último paso!</h1>';
      h+='<p>Hubo '+lista.length+' tema'+(lista.length>1?'s':'')+' que costaron un poquito. Vamos a repasarlos con tarjetas y después demostrás lo aprendido.</p>';
      h+='<button class="btn-principal" id="btn-ir-repaso" style="margin-bottom:8px">¡Vamos al repaso! ✨</button>';
      h+='<button class="btn-sec" id="btn-saltar-repaso" style="width:100%">Ver el informe ya</button></div>';
      el('app').innerHTML=h;
      el('btn-ir-repaso').addEventListener('click',function(){estado.fase='repaso';estado.repasoLista=lista;estado.repasoIdx=0;estado.refuerzoIntentos=0;pintarRepaso(temaPorId(lista[0]));});
      el('btn-saltar-repaso').addEventListener('click',informeFinal);
      return;
    }
  }
  informeFinal();
}
function informeFinal(){
  SAS.setActivo(false);
  if(estado.fase==='repaso')SAS.repasoFinal();
  SAS.misionCompleta({preguntas:MISION.activa?misionHechas():estado.respondidas,materia:DATOS.materia,final:true});
  SAS.practicaCompleta();
  guardarProgreso();
  if(MISION.activa){pintarCierreMision(true);return;}
  informeFinalDetalle();
}

  });
}
