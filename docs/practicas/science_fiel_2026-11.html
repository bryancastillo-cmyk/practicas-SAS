<style>
/* Hoja de la práctica de la profe: una columna de lectura, las 4 partes en el orden del papel. Paleta del sitio (ROADMAP §2). */
:root{
  --fondo:#FFF8EE;--carta:#FFFFFF;--tinta:#241F1A;--suave:#5F574E;--linea:#EAE2D6;--crema:#F1EADF;
  --accion:#FF8A3D;--calma:#0E7C78;--calmaClaro:#E6F3F2;
  --oro:#FFC43D;--oroTexto:#7A4B00;--oroClaro:#FFF1CC;
  --ambar:#B45309;--ambarTexto:#8A4B06;--ambarClaro:#FDE7C8;
  --verde:#15803D;--verdeTexto:#166534;--verdeClaro:#DCFCE7;
  --azulTexto:#1E4E8C;--azulClaro:#E3EEFB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
.envoltura{max-width:780px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
h1,h2{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.6rem;font-weight:900} h2{font-size:1.2rem;font-weight:800}
p{margin:0}
a{color:var(--calma)}
.arriba{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.volver{font-weight:800;text-decoration:none;color:var(--calma);padding:8px 0}
.etiqueta{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--calma)}
.hoja,.panel{background:var(--carta);border:1px solid var(--linea);border-radius:22px;padding:22px;display:grid;gap:18px}
.hoja section{display:grid;gap:6px}
.hoja h2{border-bottom:2px solid var(--linea);padding-bottom:6px}
.dir{font-weight:400;font-size:.95rem;color:var(--suave)}
.preg{display:grid;gap:8px;padding:12px;border-radius:14px;border:1.5px solid transparent;margin:0}
fieldset.preg{min-width:0}
.preg legend{font-weight:700;padding:0}
.opc{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.opc:hover{background:var(--crema)}
.opc input{margin-top:5px;width:20px;height:20px;accent-color:var(--calma);flex:none}
label{font-weight:700}
textarea,input[type=text]{font-family:inherit;font-size:1rem;width:100%;border:1.5px solid #D8D1C5;border-radius:14px;padding:10px 12px;background:#FBFAF7;color:var(--tinta)}
textarea{min-height:80px;resize:vertical}
.ensayo textarea{min-height:150px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:.85rem;color:var(--suave)}
select{font-family:inherit;font-size:1rem;padding:6px 8px;border-radius:10px;border:1.5px solid #D8D1C5;background:#FBFAF7;color:var(--tinta)}
.preg.bien{border-color:var(--verde);background:var(--verdeClaro)}
.preg.revisar{border-color:var(--ambar);background:var(--ambarClaro)}
.preg.parcial{border-color:#8DB3E2;background:var(--azulClaro)}
.pill{display:inline-flex;font-size:.82rem;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--crema)}
.pill.ok{background:var(--verdeClaro);color:var(--verdeTexto)} .pill.warn{background:var(--ambarClaro);color:var(--ambarTexto)} .pill.info{background:var(--azulClaro);color:var(--azulTexto)}
.fb{font-size:.95rem;border-left:4px solid var(--calma);padding:6px 10px;background:var(--carta);border-radius:8px;display:grid;gap:4px}
.btn{font-family:inherit;font-size:1.05rem;font-weight:800;border-radius:16px;padding:13px 18px;border:1.5px solid var(--linea);background:var(--carta);color:var(--tinta);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn-accion{background:var(--accion);border-color:var(--accion);color:#2A1300}
.btn:disabled{opacity:.55;cursor:default}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aviso{background:var(--oroClaro);color:var(--oroTexto);border-radius:14px;padding:10px 14px;font-size:.95rem}
.puntaje{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.puntaje div{background:var(--fondo);border-radius:14px;padding:12px;display:grid;gap:2px}
.puntaje b{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.espera{display:flex;gap:10px;align-items:center}
.giro{width:18px;height:18px;border-radius:50%;border:3px solid var(--calmaClaro);border-top-color:var(--calma);animation:g 1s linear infinite;flex:none}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.giro{animation:none}}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
@media (max-width:520px){.hoja,.panel{padding:14px}h1{font-size:1.35rem}}
</style>

/* esqueleto fonético (el mismo de las prácticas) para aceptar palabras casi bien escritas */
function skel(s){
  var t=norm(s).replace(/[^a-z]/g,'');if(!t)return '';
  t=t.replace(/ph/g,'f').replace(/ck/g,'k').replace(/qu/g,'k').replace(/q/g,'k').replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/g(?=[ei])/g,'j')
    .replace(/x/g,'ks').replace(/z/g,'s').replace(/y/g,'i').replace(/w/g,'u').replace(/v/g,'b').replace(/(.)ti(?=[aeiou])/g,'$1s').replace(/h/g,'');
  if(!t)return '';
  return (t[0]+t.slice(1).replace(/[aeiou]/g,'')).replace(/(.)\1+/g,'$1');
}
var VOCAB=['renewable','nonrenewable','pollution','pollutant','pollutants','scrubber','scrubbers','greenhouse','geothermal','hydropower','biomass','nuclear','uranium','environment','electricity','electric','energy','turbine','turbines','generator','mining','drilling','spills','animals','habitat','carbon','dioxide','solar','panels','replaced','technology','atmosphere','fossil','fuels','chemicals','emission','emissions','forests','damage'];
function revisarLocal(q,resp,parte,max,id){
  var txt=' '+norm(resp).replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ')+' ';
  var pal=txt.trim().split(' ').filter(Boolean),orto=[];
  pal.forEach(function(w){if(w.length<5||VOCAB.indexOf(w)>=0)return;
    VOCAB.forEach(function(v){if(skel(w)===skel(v)&&Math.min(w.length,v.length)/Math.max(w.length,v.length)>=0.75&&!orto.some(function(o){return o.escrito===w;}))orto.push({escrito:w,correcto:v});});});
  var arreglado=txt;orto.forEach(function(o){arreglado=arreglado.split(' '+o.escrito+' ').join(' '+o.correcto+' ');});
  var pts=0,maxIdeas=0,faltaron=0;
  q.ideas.forEach(function(idea){maxIdeas+=idea[0];
    var ex=idea[1].some(function(k){return txt.indexOf(norm(k))>=0;});
    var casi=!ex&&idea[1].some(function(k){return arreglado.indexOf(norm(k))>=0;});
    if(ex)pts+=idea[0];else if(casi)pts+=idea[0]/2;else faltaron++;});
  var puntos;
  if(parte===4){var or=(resp.match(/[.!?](\s|$)/g)||[]).length;puntos=pts+((pal.length>=35&&or>=3)?1:(pal.length>=20?0.5:0));}
  else puntos=pts*(max/maxIdeas);

  var com=!resp.trim()?'Sin responder.':(puntos>=max?'¡Muy bien! Tiene las ideas principales.':(puntos>0?'Vas bien: tiene parte de las ideas. Le falta '+(faltaron===1?'una idea':'alguna idea')+'.':'Todavía no: repasá este tema en la práctica adaptativa.'));
  if(parte===4&&resp.trim()&&pal.length<35)com+=' Escribí un párrafo más completo (3 oraciones o más).';
  return {id:id,puntos:puntos,max:max,comentario:com,ortografia:orto,respuesta:resp};
}

  h+='<div><span class="dir">Part 3 · pareo</span><b>'+t3+' / '+m3+'</b></div><div><span class="dir">Part 4 · ensayos</span><b>'+fmtP(t4)+' / '+m4+'</b></div></div>';
  h+='<p class="aviso">Las partes 2 y 4 tienen una <b>revisión preliminar</b> por ideas clave. Para una revisión completa, un adulto puede copiar las respuestas y pegárselas a Claude, o abrir la versión que revisa Claude.</p>';
  h+='<div class="fila"><button class="btn" id="btn-copiar">Copiar respuestas para Claude</button><a class="btn" href="'+esc(EXAMEN.enlaceClaude)+'" target="_blank" rel="noopener">Abrir la versión con Claude ↗</a><span class="dir" id="msg-copiar"></span></div>';

  var pendiente=res.p1.some(function(x){return !x.ok;})||res.p3.some(function(x){return !x.ok;})||res.p2.concat(res.p4).some(function(x){return x.puntos<x.max;});
  h+='<div class="fila">'+(pendiente?'<button class="btn btn-accion" id="btn-corregir">Corregir lo que faltó</button>':'')+'<button class="btn" id="btn-nueva">Empezar otra vez</button><a class="btn" href="../">Volver al inicio</a></div>';
  h+='<p class="dir">La práctica no muestra cuál es la opción correcta: en las marcadas con «Revisá esta», volvé a leer y probá otra vez.</p></div>';
